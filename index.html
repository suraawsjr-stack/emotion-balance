<script>
/* ============ EB.state + EB.timer — النقاط، الفرق، المؤقت الحقيقي، الحفظ المحلي ============ */
(function (EB) {
  const D = EB.data;
  const KEY = 'emotion-balance-v1';

  /* ---------- مؤقت الفريق: يقيس الزمن المنقضي الحقيقي وليس setInterval ---------- */
  const timer = {
    running: false, _acc: 0, _last: 0, limit: D.TEAM_LIMIT_SEC, onExpire: null, onTick: null,
    reset() { this.running = false; this._acc = 0; this._last = 0; },
    start() { this._acc = 0; this.resume(); },
    resume() { if (this.running) return; this.running = true; this._last = performance.now(); this._loop(); },
    pause() { if (!this.running) return; this._acc += (performance.now() - this._last) / 1000; this.running = false; },
    elapsed() { return this.running ? this._acc + (performance.now() - this._last) / 1000 : this._acc; },
    remaining() { return Math.max(0, this.limit - this.elapsed()); },
    _loop() {
      if (this._looping) return;
      this._looping = true;
      EB.util.onFrame(() => {
        if (!this.running) return;
        const e = this.elapsed();
        if (this.onTick) this.onTick(e);
        if (e >= this.limit && this.onExpire) { const f = this.onExpire; this.pause(); this._expired = true; f(); }
      });
    },
    finish() { this.pause(); return Math.min(this.limit, this.elapsed()); }
  };
  EB.timer = timer;

  /* ---------- حالة المنافسة ---------- */
  function blankTeam(id) {
    return {
      id, score: 0, elapsed: null, finished: false,
      levels: D.LEVELS.map(l => ({ id: l.id, points: null, done: false, skipped: false, partial: false }))
    };
  }
  const state = {
    teams: { pink: blankTeam('pink'), purple: blankTeam('purple') },
    order: ['pink', 'purple'],
    teamIndex: 0,        // الفريق الحالي في الترتيب
    levelIndex: 0,       // رقم المرحلة الحالي (0..4) = رقم الطالبة
    started: false,      // بدأ سباق الفريق الحالي؟
    phase: 'intro',      // intro | level | handoff | teamEnd | results
    winner: null,
    get team() { return this.order[this.teamIndex]; },
    get teamData() { return this.teams[this.team]; },
    get level() { return D.LEVELS[this.levelIndex]; },
    setOrder(first) {
      this.order = first === 'purple' ? ['purple', 'pink'] : ['pink', 'purple'];
    },
    resetAll() {
      this.teams = { pink: blankTeam('pink'), purple: blankTeam('purple') };
      this.teamIndex = 0; this.levelIndex = 0; this.started = false; this.phase = 'intro'; this.winner = null;
      timer.reset(); this.save();
    },
    startTeamRace() {
      this.started = true; timer._expired = false; timer.start();
    },
    /* تسجّل نقاط المرحلة الحالية (مرة واحدة فقط) */
    record(points, opts) {
      opts = opts || {};
      const t = this.teamData;
      const slot = t.levels[this.levelIndex];
      if (slot.done) return slot.points;           // منع احتساب النقاط مرتين
      const rawPoints = EB.util.clamp(points, 0, D.LEVEL_POINTS);
      const errors = opts.errors || 0;
      const deduction = Math.min(rawPoints, errors * D.ERROR_COST);
      const p = opts.skipped ? 0 : Math.round(rawPoints - deduction);
      Object.assign(slot, { rawPoints, errors, deduction });
      slot.points = p; slot.done = true; slot.skipped = !!opts.skipped; slot.partial = !!opts.partial; slot.timedOut = !!opts.timedOut;
      t.score = t.levels.reduce((s, l) => s + (l.points || 0), 0);
      this.save();
      return p;
    },
    completeTeam(opts) {
      const t = this.teamData;
      t.elapsed = opts && opts.elapsed != null ? opts.elapsed : timer.finish();
      const stagePoints = t.levels.reduce((sum, level) => sum + (level.points || 0), 0);
      const completed = t.levels.every(level => level.done && !level.skipped);
      const remaining = EB.util.clamp(1 - t.elapsed / D.TEAM_LIMIT_SEC, 0, 1);
      const accuracy = stagePoints / (D.LEVELS.length * D.LEVEL_POINTS);
      t.timeBonus = completed ? Math.round(D.TIME_BONUS_MAX * remaining * accuracy) : 0;
      t.score = stagePoints + t.timeBonus;
      t.finished = true;
      this.save();
      return t;
    },
    teamDone(id) { return this.teams[id].finished; },
    bothDone() { return this.teams.pink.finished && this.teams.purple.finished; },
    decideWinner() {
      const a = this.teams[this.order[0]], b = this.teams[this.order[1]];
      const A = this.teams.pink, B = this.teams.purple;
      if (A.score !== B.score) return { winner: A.score > B.score ? 'pink' : 'purple', reason: 'points' };
      const ta = A.elapsed == null ? 9e9 : A.elapsed, tb = B.elapsed == null ? 9e9 : B.elapsed;
      if (Math.abs(ta - tb) > 0.5) return { winner: ta < tb ? 'pink' : 'purple', reason: 'time' };
      return { winner: null, reason: 'draw' };
    },
    completedCount(id) { return this.teams[id].levels.filter(l => l.done && !l.skipped && !l.timedOut).length; },
    save() {
      try {
        localStorage.setItem(KEY, JSON.stringify({
          teams: this.teams, order: this.order, winner: this.winner, savedAt: Date.now()
        }));
      } catch (e) { /* Safari وضع التصفح الخاص */ }
    },
    load() {
      try {
        const raw = localStorage.getItem(KEY); if (!raw) return false;
        const o = JSON.parse(raw);
        if (!o || !o.teams || !o.teams.pink) return false;
        this.teams.pink = Object.assign(blankTeam('pink'), o.teams.pink);
        this.teams.purple = Object.assign(blankTeam('purple'), o.teams.purple);
        this.order = o.order || ['pink', 'purple'];
        this.winner = o.winner || null;
        return true;
      } catch (e) { return false; }
    },
    clear() { try { localStorage.removeItem(KEY); } catch (e) { } }
  };
  EB.state = state;
})(window.EB);

</script>
<script>
/* ============ EB.screens — شاشات البداية والانتقال والنهاية ============ */
(function (EB) {
  const { h, tap, mmss } = EB.util;
  const D = EB.data, T = D.TEXT;
  const playerLabel = i => `اللاعبة ${i + 1} من 5`;

  function lvllist(teamId) {
    const t = EB.state.teams[teamId];
    return h('ul', { class: 'lvllist' }, D.LEVELS.map((l, i) => {
      const s = t.levels[i];
      const status = s.skipped ? ' (تخطي)' : s.timedOut ? ' (انتهى الوقت)' : s.partial ? ' (جزئي)' : '';
      const errors = s.errors ? ` · الأخطاء ${s.errors}` : '';
      const val = s.done ? `${s.points}/100${status}${errors}` : '—';
      return h('li', {}, [h('span', { text: `${i + 1}. ${l.skill}` }), h('span', { text: val })]);
    }));
  }

  function teamCard(teamId) {
    const td = EB.state.teams[teamId], meta = D.TEAMS[teamId];
    return h('div', { class: 'team-card ' + meta.css }, [
      h('div', { class: 'lbl', text: meta.name }),
      h('div', { class: 'num', text: `${td.score}` }),
      h('div', { class: 'lbl', text: `من ${td.finished && td.timeBonus == null ? D.TEAM_MAX - D.TIME_BONUS_MAX : D.TEAM_MAX} نقطة` }),
      h('div', { class: 'lbl', text: td.elapsed == null ? 'قيد اللعب…' : `الزمن ${mmss(td.elapsed)}` }),
      h('div', { class: 'lbl', text: `المراحل المكتملة: ${EB.state.completedCount(teamId)} من 5` }),
      h('div', { class: 'lbl', text: td.timeBonus == null ? '' : `مكافأة الوقت +${td.timeBonus}` }),
      lvllist(teamId)
    ]);
  }

  /* ---------- شاشة البداية ---------- */
  function intro() {
    const sel = { first: 'pink' };
    const bPink = h('button', { class: 'btn big violet pick-pink', text: 'الوردي يبدأ أولًا (الافتراضي)' });
    const bPur = h('button', { class: 'btn big violet pick-purple', text: 'البنفسجي يبدأ أولًا' });
    const seg = h('div', { class: 'seg' }, [bPink, bPur]);
    function mark() {
      bPink.classList.toggle('sel', sel.first === 'pink');
      bPur.classList.toggle('sel', sel.first === 'purple');
    }
    EB.util.tap(bPink, () => { sel.first = 'pink'; mark(); EB.audio.pop(); });
    EB.util.tap(bPur, () => { sel.first = 'purple'; mark(); EB.audio.pop(); });
    mark();

    const start = h('button', { class: 'btn huge primary glow', text: T.startRace });
    EB.util.tap(start, () => { EB.audio.unlock(); EB.audio.great(); EB.game.beginRace(sel.first); });

    const card = h('div', { class: 'card' }, [
      h('h1', { class: 'game-title', text: T.title }),
      h('h2', { text: T.subtitle }),
      h('p', { class: 'sub', text: T.lesson }),
      h('p', { class: 'sub', text: 'البطلة متوتّرة من مهام اليوم… ساعديها على اكتساب خمس مهارات: التنفّس، الاسترخاء، الرياضة، التغذية المتوازنة، وإدارة الوقت.' }),
      h('div', { class: 'chips' }, D.LEVELS.map(l => h('span', { class: 'chip', text: `${l.emoji} ${l.skill}` }))),
      h('h3', { text: 'أيّ الفريقين يبدأ أولًا؟' }),
      seg,
      h('div', { class: 'row' }, [start]),
      h('p', { class: 'sub', text: 'لكل فريق ٤ دقائق و٣٠ ثانية. كل مرحلة من ١٠٠ نقطة، ويُخصم ٥ لكل خطأ. إكمال المراحل الخمس يتيح مكافأة تصل إلى ٥٠ نقطة حسب الوقت المتبقي والأداء.' })
    ]);
    return card;
  }

  /* ---------- بطاقة تعريف المرحلة ---------- */
  function levelIntro() {
    const li = EB.state.levelIndex, lvl = EB.state.level, team = D.TEAMS[EB.state.team];
    const start = h('button', { class: 'btn huge primary glow', text: li === 0 ? 'ابدئي' : T.startNext });
    EB.util.tap(start, () => { EB.audio.pop(); EB.game.launchLevel(); });
    return h('div', { class: 'card' }, [
      h('div', { class: `team-badge ${team.css}`, text: `${team.en} · ${team.name}` }),
      h('h2', { text: `${lvl.emoji} ${lvl.name}` }),
      h('p', { class: 'sub', text: `${playerLabel(li)} — المهارة: ${lvl.skill}` }),
      h('div', { class: 'progress-dots' }, D.LEVELS.map((l, i) =>
        h('span', { class: 'dot' + (i < li ? ' done' : i === li ? ' now' : '') }))),
      h('p', { class: 'sub', text: lvl.hint }),
      h('p', { class: 'sub', text: 'المؤقت يستمر بين الأدوار. ابدئي حين تكونين جاهزة.' }),
      h('div', { class: 'row' }, [start])
    ]);
  }

  /* ---------- شاشة انتقال الدور ---------- */
  function handoff(res) {
    const li = EB.state.levelIndex, last = li >= D.LEVELS.length - 1;
    const btn = h('button', { class: 'btn huge primary glow', text: last ? 'إنهاء سباق الفريق' : T.startNext });
    EB.util.tap(btn, () => { EB.audio.pop(); EB.game.advance(); });
    const title = res.partial ? T.handoffPartial : (res.points > 0 ? T.handoffGood : 'انتهت المرحلة.');
    const next = last ? null : D.LEVELS[li + 1];
    const slot = EB.state.teamData.levels[li];
    return h('div', { class: 'card' }, [
      h('h2', { text: title }),
      h('div', { style: 'font-size:clamp(24px,4vmin,44px);font-weight:900;color:var(--purple-deep)', text: `+${res.points} نقطة من 100` }),
      h('div', { class: 'chips' }, [
        h('span', { class: 'chip', text: slot.skipped ? 'مرحلة متخطاة' : `الأداء ${Math.round(slot.rawPoints)} · الأخطاء ${slot.errors} · الخصم ${Math.round(slot.deduction)}` }),
        h('span', { class: 'chip', text: `${EB.state.level.emoji} ${EB.state.level.skill}` }),
        h('span', { class: 'chip', text: `مجموع الفريق: ${EB.state.teamData.score} من ${D.TEAM_MAX}` })
      ]),
      h('h3', { text: T.handoffPad }),
      h('p', { class: 'sub', text: last ? 'هذه كانت المهمة الأخيرة في سباق هذا الفريق.' : `المهمة التالية: ${next.name} — ${playerLabel(li + 1)}` }),
      h('div', { class: 'row' }, [btn])
    ]);
  }

  /* ---------- نهاية سباق الفريق ---------- */
  function teamEnd() {
    const teamId = EB.state.team;
    const meta = D.TEAMS[teamId], td = EB.state.teams[teamId];
    const other = teamId === 'pink' ? 'purple' : 'pink';
    const nextLabel = `بدء سباق ${D.TEAMS[other].name}`;
    const btn = h('button', { class: 'btn huge primary glow', text: nextLabel });
    EB.util.tap(btn, () => { EB.audio.great(); EB.game.beginRace(other, false); });
    return h('div', { class: 'card' }, [
      h('h1', { class: 'game-title', text: `انتهى سباق ${meta.name}` }),
      h('div', { class: 'row' }, [btn]),
      h('div', { style: 'width:100%', }, [teamCard(teamId)]),
      h('p', { class: 'sub', text: `${meta.name}: ${td.score} نقطة في ${mmss(td.elapsed || 0)} — اكتملت ${EB.state.completedCount(teamId)} من 5 مراحل.` }),
      h('h3', { text: 'الآن يبدأ الفريق الآخر من الصفر.' })
    ]);
  }

  /* ---------- النتيجة النهائية والفائز ---------- */
  function results() {
    const dec = EB.state.decideWinner();
    EB.state.winner = dec.winner; EB.state.save();
    const winName = dec.winner ? D.TEAMS[dec.winner].name : null;
    const reason = dec.reason === 'points' ? 'بالنقاط الأعلى' : dec.reason === 'time' ? 'بالزمن الأقل (تعادل النقاط)' : 'تعادل الفريقين';
    const replay = h('button', { class: 'btn huge primary glow', text: 'إعادة المنافسة' });
    EB.util.tap(replay, () => { EB.audio.pop(); EB.game.replay(); });
    const menu = h('button', { class: 'btn big ghost', text: 'القائمة الرئيسية' });
    EB.util.tap(menu, () => { EB.audio.pop(); EB.game.gotoIntro(); });

    const wrap = h('div', { class: 'card' }, [
      h('h1', { class: 'game-title', text: 'نتائج منافسة الفريقين' }),
      h('div', { class: 'scoreboard' }, [teamCard('pink'), teamCard('purple')]),
      dec.winner ? trophy(dec.winner) : h('div', { style: 'font-size:clamp(40px,8vmin,90px)', text: '🤝' }),
      h('div', { class: 'winner', text: T.congrats }),
      h('h2', { text: dec.winner ? `الفريق الفائز هو: ${winName} — ${reason}` : `تعادل الفريقين! ${reason}` }),
      h('div', { class: 'row' }, [replay, menu])
    ]);
    EB.fx.confetti(dec.winner || 'pink', 1400);
    setTimeout(() => EB.audio.fanfare(), 300);
    return wrap;
  }

  function trophy(teamId) {
    const col = D.TEAMS[teamId].colors.main;
    const s = document.createElementNS(EB.util.NS, 'svg');
    s.setAttribute('viewBox', '0 0 120 120'); s.setAttribute('class', 'trophy');
    const mk = (t, a) => { const e = document.createElementNS(EB.util.NS, t); for (const k in a) e.setAttribute(k, a[k]); s.appendChild(e); return e; };
    mk('path', { d: 'M30,18 h60 v22 q0,22 -30,26 q-30,-4 -30,-26 z', fill: '#e8b45c', stroke: '#d9a03c', 'stroke-width': 3 });
    mk('path', { d: 'M30,22 q-18,2 -14,20 q3,14 18,12 M90,22 q18,2 14,20 q-3,14 -18,12', fill: 'none', stroke: '#d9a03c', 'stroke-width': 5 });
    mk('rect', { x: 52, y: 66, width: 16, height: 16, fill: '#e8b45c' });
    mk('rect', { x: 38, y: 82, width: 44, height: 10, rx: 4, fill: '#d9a03c' });
    mk('rect', { x: 30, y: 92, width: 60, height: 12, rx: 5, fill: col });
    mk('path', { d: EB.util.Star, fill: '#fff6d0', transform: 'translate(60,40) scale(1.1)' });
    return s;
  }

  EB.screens = { intro, levelIntro, handoff, teamEnd, results, teamCard, playerLabel };

  /* ---------- احتفال: شرائط ملوّنة ---------- */
  EB.fx = EB.fx || {};
  EB.fx.confetti = function (teamId, ms) {
    const host = EB.dom.overlayInner;
    const box = h('div', { style: 'position:absolute;inset:0;pointer-events:none;overflow:hidden;' });
    host.appendChild(box);
    const cols = ['#e8b45c', '#d98b9d', '#a08cc0', '#9cb381', '#7fb0c4', D.TEAMS[teamId].colors.main];
    const bits = [];
    for (let i = 0; i < 70; i++) {
      const b = h('div', {
        style: `position:absolute;width:${6 + Math.random() * 8}px;height:${10 + Math.random() * 14}px;background:${cols[i % cols.length]};opacity:.95;border-radius:3px;top:-30px;left:${Math.random() * 100}%;`
      });
      box.appendChild(b);
      bits.push({ el: b, x: Math.random() * 100, y: -5 - Math.random() * 40, v: 40 + Math.random() * 90, r: Math.random() * 360, vr: (Math.random() - .5) * 400 });
    }
    const f = EB.util.onFrame((d) => {
      bits.forEach(b => {
        b.y += b.v * d; b.r += b.vr * d; b.x += Math.sin(b.y / 40) * .3;
        if (b.y > 110) { b.y = -8; b.x = Math.random() * 100; }
        b.el.style.transform = `translate(${b.x}vw, ${b.y}vh) rotate(${b.r}deg)`;
      });
    });
    setTimeout(() => { EB.util.offFrame(f); box.remove(); }, ms || 2600);
  };
})(window.EB);

</script>
<script>
/* ============ التحدي 1 — RHYTHM BREATHING: Skill Check احترافي + تنفّس البطلة ======
   استراتيجيتان موثّقتان متساويتا المدة وعدد الضغطات:
   - الفريق الوردي: التنفّس المربّع 4-4-4-4 (Cleveland Clinic / Medical News Today)
   - الفريق البنفسجي: التنفّس المتساوي 8-8 (Healthline)
   الشكل الجديد: شريط Skill Check أقرب إلى واجهات الألعاب، مع تصغير كل جولة
   بصريًا ومنطقيًا، واحتساب نقاط أدق حسب دقة التوقيت. */
(function (EB) {
  const U = EB.util, { svg, tween, Ease, clamp, lerp, burst, ring } = U;
  const D = EB.data;

  const AR_DIGITS = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'];
  const ar = n => String(Math.round(n)).split('').map(c => /\d/.test(c) ? AR_DIGITS[+c] : c).join('');

  const MOVE = {
    in: { raiseL: 26, bendL: 30, raiseR: 26, bendR: 30, lean: 1, headRot: -2, shoulderLift: .8 },
    out: { raiseL: 10, bendL: 18, raiseR: 10, bendR: 18, lean: -1, headRot: 1.5, shoulderLift: .2 },
    hold: {}
  };

  /* اللوحة داخل عرض المسرح (1024) والممر محصور داخلها */
  const CX = 762, CY = 312, BASE_W = 372, BASE_H = 32, SHRINK = .14;
  const PANEL = { x: 536, y: 200, w: 452, h: 200 };

  function gradeTiming(ratio) {
    if (ratio <= .12) return { label: 'مثالي', en: 'PERFECT', score: 100, kind: 'perfect' };
    if (ratio <= .28) return { label: 'ممتاز', en: 'GREAT', score: 92 - ratio * 18, kind: 'great' };
    if (ratio <= .52) return { label: 'جيد جدًا', en: 'GOOD', score: 78 - (ratio - .28) * 50, kind: 'good' };
    if (ratio <= 1) return { label: 'مقبول', en: 'OK', score: 52 - (ratio - .52) * 38, kind: 'ok' };
    return null;
  }

  const L = {
    state: null,
    start(ctx) {
      const strat = (ctx.variant && ctx.variant.strategy) || D.BREATH.box;
      const cfg = {
        cycles: (ctx.variant && ctx.variant.cycles) || D.BREATH.cycles,
        approach: (ctx.variant && ctx.variant.approach) || D.BREATH.approach,
        window: (ctx.variant && ctx.variant.window) || D.BREATH.window
      };
      const g = ctx.layers.game, fx = ctx.layers.fx;
      const main = ctx.meta.colors.main, glow = ctx.meta.colors.glow, deep = ctx.meta.colors.deep || main;

      const sched = [];
      for (let c = 0; c < cfg.cycles; c++) {
        strat.kinds.forEach((kind, k) => sched.push({ cycle: c + 1, kind, secs: strat.secs[k], need: kind === 'in' || kind === 'out' }));
      }
      const totalPresses = sched.filter(s => s.need).length;

      ctx.girl.setOutfit(D.OUTFITS.home);
      ctx.girl.setPose(Object.assign({}, EB.Character.POSES.stand, { mouth: 'tense', brows: 'worried', eyes: .9, shoulderLift: .7 }));
      ctx.girl.setPos(460, 458, 1.2);
      ctx.room.setLighting('focus', 500);

      const stage = svg('g', {}, g);
      const halo = svg('ellipse', { cx: 460, cy: 330, rx: 118, ry: 130, fill: glow, opacity: .1, filter: 'url(#fSoft)' }, stage);
      const aura = svg('ellipse', { cx: 460, cy: 330, rx: 92, ry: 106, fill: 'none', stroke: glow, 'stroke-width': 4, opacity: 0 }, stage);

      const card = svg('g', {}, g);
      svg('rect', { x: 602, y: 58, width: 378, height: 132, rx: 24, fill: 'rgba(255,255,255,.94)', stroke: glow, 'stroke-width': 4 }, card);
      svg('rect', { x: 602, y: 58, width: 378, height: 42, rx: 22, fill: main, opacity: .96 }, card);
      svg('rect', { x: 602, y: 79, width: 378, height: 21, fill: main, opacity: .96 }, card);
      svg('text', { x: 791, y: 87, 'text-anchor': 'middle', 'font-size': 20, 'font-weight': 900, fill: '#fff', text: strat.ar }, card);
      svg('text', { x: 791, y: 134, 'text-anchor': 'middle', 'font-size': 28, 'font-weight': 900, fill: '#5a4034', text: strat.badge }, card);
      svg('text', { x: 791, y: 158, 'text-anchor': 'middle', 'font-size': 14, 'font-weight': 800, fill: '#8a7365', text: strat.latin }, card);
      svg('text', { x: 791, y: 178, 'text-anchor': 'middle', 'font-size': 11.5, 'font-weight': 700, fill: '#a89382', text: 'مصدر موثّق: ' + strat.ref.split('؛')[0] }, card);
      const phaseTxt = svg('text', { x: 791, y: 214, 'text-anchor': 'middle', 'font-size': 24, 'font-weight': 900, fill: main, text: 'استعدي' }, card);
      const cycleTxt = svg('text', { x: 791, y: 238, 'text-anchor': 'middle', 'font-size': 15, 'font-weight': 800, fill: '#8a7365', text: `الدورة ١ من ${ar(cfg.cycles)}` }, card);

      const skill = svg('g', {}, g);
      svg('rect', { x: PANEL.x + 10, y: PANEL.y + 10, width: PANEL.w, height: PANEL.h, rx: 28, fill: 'rgba(0,0,0,.18)', filter: 'url(#fSoft)' }, skill);
      svg('rect', { x: PANEL.x, y: PANEL.y, width: PANEL.w, height: PANEL.h, rx: 28, fill: 'url(#ebSkillPanel)', stroke: 'rgba(255,255,255,.18)', 'stroke-width': 2 }, skill);
      svg('rect', { x: PANEL.x + 78, y: PANEL.y + 8, width: PANEL.w - 156, height: 38, rx: 12, fill: 'rgba(18,18,24,.68)', stroke: 'rgba(255,255,255,.15)', 'stroke-width': 2 }, skill);
      svg('text', { x: PANEL.x + PANEL.w / 2, y: PANEL.y + 33, 'text-anchor': 'middle', 'font-size': 16, 'font-weight': 900, fill: '#f0f0f4', text: 'PRESS TO SKILL CHECK' }, skill);
      svg('rect', { x: PANEL.x + 22, y: PANEL.y + 64, width: PANEL.w - 44, height: 108, rx: 22, fill: 'rgba(8,9,14,.34)', stroke: 'rgba(255,255,255,.08)', 'stroke-width': 2 }, skill);

      const lane = svg('g', {}, skill);
      const barBg = svg('rect', { x: CX - BASE_W / 2, y: CY - BASE_H / 2, width: BASE_W, height: BASE_H, rx: BASE_H / 2,
        fill: 'url(#ebSkillLane)', stroke: 'rgba(255,255,255,.1)', 'stroke-width': 2.5 }, lane);
      const barInner = svg('rect', { x: CX - BASE_W / 2 + 10, y: CY - BASE_H / 2 + 7, width: BASE_W - 20, height: 7, rx: 4,
        fill: 'rgba(255,255,255,.14)' }, lane);
      const zoneGlow = svg('rect', { x: 0, y: 0, width: 0, height: 0, rx: 0, fill: '#fff', opacity: .14, filter: 'url(#fSoft)' }, lane);
      const zone = svg('rect', { x: 0, y: 0, width: 0, height: 0, rx: 0, fill: 'url(#ebTargetGlow)', stroke: '#fff', 'stroke-width': 2.8 }, lane);
      const zoneCore = svg('rect', { x: 0, y: 0, width: 0, height: 0, rx: 0, fill: 'rgba(255,255,255,.84)' }, lane);
      const pulse = svg('rect', { x: 0, y: 0, width: 0, height: 0, rx: 0, fill: 'rgba(255,255,255,.0)', opacity: 0 }, lane);
      const markerGlow = svg('rect', { x: 0, y: 0, width: 10, height: 64, rx: 5, fill: 'rgba(255,146,61,.34)', opacity: .9, filter: 'url(#fSoft)' }, lane);
      const marker = svg('rect', { x: 0, y: 0, width: 4, height: 72, rx: 3, fill: '#ff7b26' }, lane);
      const markerEdge = svg('rect', { x: 0, y: 0, width: 2, height: 72, rx: 1, fill: '#ffd4a8', opacity: .9 }, lane);
      const trail = svg('rect', { x: 0, y: 0, width: 0, height: 10, rx: 5, fill: `rgba(255,255,255,.16)` }, lane);
      const skillHint = svg('text', { x: CX, y: CY + 67, 'text-anchor': 'middle', 'font-size': 13, 'font-weight': 800, fill: '#d9d9df', text: 'اضغطي عندما يمر المؤشر داخل المنطقة البيضاء' }, skill);
      const roundTxt = svg('text', { x: CX, y: CY - 56, 'text-anchor': 'middle', 'font-size': 15, 'font-weight': 900, fill: '#f5b76d', text: '' }, skill);
      const accTxt = svg('text', { x: CX, y: CY + 44, 'text-anchor': 'middle', 'font-size': 15, 'font-weight': 900, fill: '#f0f0f4', text: 'الدقة الحالية ٠٪' }, skill);
      const scoreTxt = svg('text', { x: PANEL.x + 44, y: PANEL.y + 88, 'font-size': 15, 'font-weight': 900, fill: '#ffffff', text: 'Accuracy' }, skill);
      const gradeTxt = svg('text', { x: PANEL.x + PANEL.w - 44, y: PANEL.y + 88, 'text-anchor': 'end', 'font-size': 18, 'font-weight': 900, fill: '#ffd38d', text: 'READY' }, skill);

      const defs = ctx.defs || document.getElementById('stage-defs');
      if (!defs.querySelector('#ebSkillPanel')) {
        const lg1 = svg('linearGradient', { id: 'ebSkillPanel', x1: '0%', y1: '0%', x2: '0%', y2: '100%' }, defs);
        svg('stop', { offset: '0%', 'stop-color': '#4a342a' }, lg1);
        svg('stop', { offset: '45%', 'stop-color': '#271e25' }, lg1);
        svg('stop', { offset: '100%', 'stop-color': '#14161c' }, lg1);
        const lg2 = svg('linearGradient', { id: 'ebSkillLane', x1: '0%', y1: '0%', x2: '100%', y2: '0%' }, defs);
        svg('stop', { offset: '0%', 'stop-color': '#101118' }, lg2);
        svg('stop', { offset: '50%', 'stop-color': '#1d2029' }, lg2);
        svg('stop', { offset: '100%', 'stop-color': '#101118' }, lg2);
        const lg3 = svg('linearGradient', { id: 'ebTargetGlow', x1: '0%', y1: '0%', x2: '0%', y2: '100%' }, defs);
        svg('stop', { offset: '0%', 'stop-color': '#ffffff', 'stop-opacity': '.92' }, lg3);
        svg('stop', { offset: '100%', 'stop-color': '#ffe7b8', 'stop-opacity': '.92' }, lg3);
      }

      const bIn = ctx.ui.addBtn('شهيق ⬆', 'big breath-button', () => press('in'), '↑');
      const bOut = ctx.ui.addBtn('زفير ⬇', 'big breath-button', () => press('out'), '↓');
      EB.keys.set({
        ArrowUp: () => press('in'), KeyW: () => press('in'), KeyA: () => press('in'),
        ArrowDown: () => press('out'), KeyS: () => press('out'), KeyD: () => press('out')
      }, '↑ شهيق · ↓ زفير — اضغطي عند منتصف المنطقة البيضاء');
      function markActive(kind, ready = false) {
        for (const [key, button] of [['in', bIn], ['out', bOut]]) {
          button.dataset.breathState = kind === 'hold' ? 'hold' : key === kind ? 'active' : 'idle';
          button.classList.toggle('glow', ready && key === kind);
        }
      }

      const S = {
        i: 0, cycle: 1, hits: 0, totalPoints: 0, t: 0, cueT: 0, pressed: false, running: false,
        done: false, lastSec: -1, breath: 0, lastGrade: null, combo: 0
      };
      L.state = S;

      function liveScore() {
        const pct = totalPresses ? S.totalPoints / totalPresses : 0;
        ctx.live(pct);
        accTxt.textContent = `الدقة الحالية ${ar(Math.round(pct))}٪`;
        scoreTxt.textContent = `Accuracy ${Math.round(pct)}%`;
      }
      function setPhase(txt) { phaseTxt.textContent = txt; }

      const geo = { w: BASE_W, h: BASE_H, f: 1, x0: 0, x1: 0, zoneW: 0 };
      const travelTime = cycle => cfg.approach * Math.pow(.78, cycle - 1);
      const win = () => cfg.window * geo.f;
      function applyCycle(cycle) {
        const f = clamp(1 - (cycle - 1) * SHRINK, .62, 1);
        geo.f = f;
        geo.w = BASE_W * f;
        geo.h = Math.max(22, BASE_H * f);
        geo.x0 = CX - geo.w / 2; geo.x1 = CX + geo.w / 2;
        geo.zoneW = Math.max(30, (win() / travelTime(cycle)) * (geo.w - geo.h * .76));
        placeSkillCheck(cycle);
      }
      function placeSkillCheck(cycle) {
        barBg.setAttribute('x', geo.x0); barBg.setAttribute('y', CY - geo.h / 2);
        barBg.setAttribute('width', geo.w); barBg.setAttribute('height', geo.h); barBg.setAttribute('rx', geo.h / 2);
        barInner.setAttribute('x', geo.x0 + 10); barInner.setAttribute('y', CY - geo.h / 2 + 6);
        barInner.setAttribute('width', Math.max(0, geo.w - 20));
        zoneGlow.setAttribute('x', CX - geo.zoneW / 2 - 7); zoneGlow.setAttribute('y', CY - geo.h / 2 - 8);
        zoneGlow.setAttribute('width', geo.zoneW + 14); zoneGlow.setAttribute('height', geo.h + 16); zoneGlow.setAttribute('rx', geo.h / 2);
        zone.setAttribute('x', CX - geo.zoneW / 2); zone.setAttribute('y', CY - geo.h / 2 + 1.6);
        zone.setAttribute('width', geo.zoneW); zone.setAttribute('height', geo.h - 3.2); zone.setAttribute('rx', (geo.h - 4) / 2);
        zoneCore.setAttribute('x', CX - geo.zoneW * .22); zoneCore.setAttribute('y', CY - geo.h / 2 + 4);
        zoneCore.setAttribute('width', geo.zoneW * .44); zoneCore.setAttribute('height', geo.h - 8); zoneCore.setAttribute('rx', (geo.h - 8) / 2);
        pulse.setAttribute('x', CX - geo.zoneW / 2); pulse.setAttribute('y', CY - geo.h / 2 - 3); pulse.setAttribute('width', geo.zoneW); pulse.setAttribute('height', geo.h + 6); pulse.setAttribute('rx', geo.h / 2);
        roundTxt.textContent = `ROUND ${cycle} · ${Math.round(geo.f * 100)}%`;
        skillHint.textContent = `الدورة ${ar(cycle)} — كل جولة أسرع وتحتاج توقيتًا أدق`;
      }

      /* لحظة الضغط المثالية = وصول المؤشر إلى مركز المنطقة البيضاء، ثم يتابع للخروج يمينًا */
      function markerX(p) {
        const from = geo.x0 + geo.h * .38, to = geo.x1 - geo.h * .38;
        return lerp(from, to, clamp(p / 2, 0, 1));
      }
      function moveMarker(p) {
        const x = markerX(p), mh = geo.h + 26, my = CY - mh / 2;
        marker.setAttribute('x', x - 2); marker.setAttribute('y', my); marker.setAttribute('height', mh);
        markerGlow.setAttribute('x', x - 5); markerGlow.setAttribute('y', my + 4); markerGlow.setAttribute('height', mh - 8);
        markerEdge.setAttribute('x', x - 1); markerEdge.setAttribute('y', my); markerEdge.setAttribute('height', mh);
        trail.setAttribute('x', geo.x0 + 12); trail.setAttribute('y', CY - 5);
        trail.setAttribute('width', Math.max(0, x - (geo.x0 + 12))); trail.setAttribute('height', 10);
      }

      function startTravel() {
        S.cueT = 0; S.pressed = false; S.ok = false; S.running = false;
        moveMarker(0);
      }
      function cue(kind) {
        startTravel();
        markActive(kind, true);
        setPhase(kind === 'in' ? 'استعداد — شهيق' : 'استعداد — زفير');
        gradeTxt.textContent = kind === 'in' ? 'INHALE' : 'EXHALE';
        gradeTxt.setAttribute('fill', '#ffd38d');
      }

      function credit(grade, d) {
        if (S.pressed) return;
        S.pressed = true; S.ok = true;
        S.hits++;
        S.lastGrade = grade;
        S.combo++;
        const comboBoost = Math.min(6, Math.max(0, S.combo - 1) * 1.5);
        const pts = clamp(grade.score + comboBoost, 0, 100);
        S.totalPoints += pts;
        liveScore();
        gradeTxt.textContent = `${grade.en} +${Math.round(pts)}`;
        gradeTxt.setAttribute('fill', grade.kind === 'perfect' ? '#fff4c0' : grade.kind === 'great' ? '#ffd38d' : '#f4f4f4');
        ctx.ui.banner(`${grade.label} — ${Math.round(pts)} نقطة`, 'ok', 850);
        EB.audio.good();
        ring(g, CX, CY, { from: geo.h * .9, to: geo.zoneW * .9, color: glow, dur: 520, width: 4 });
        burst(fx, 460, 316, { count: 8, color: '#e8b45c', spread: 86, dur: 600 });
        tween({ from: 0, to: 1, dur: 260, onUpdate: v => { pulse.setAttribute('opacity', (1 - v) * .38); } });
      }
      function miss(msg) {
        if (S.pressed) return;
        ctx.mistake();
        S.pressed = true; S.ok = false; S.combo = 0;
        gradeTxt.textContent = 'MISS';
        gradeTxt.setAttribute('fill', '#ff9a86');
        EB.audio.wrong();
        do { S.i++; } while (S.i < sched.length && !sched[S.i].need);
        if (S.i >= sched.length) return succeed();
        const next = sched[S.i];
        cycleTxt.textContent = `الدورة ${ar(next.cycle)} من ${ar(cfg.cycles)}`;
        cue(next.kind);
        ctx.ui.banner(msg + (next.kind === 'in' ? ' · التالي شهيق' : ' · التالي زفير'), 'no', 650);
      }

      function runStep() {
        const st = S.step = sched[S.i];
        S.t = 0; S.running = true; S.lastSec = -1; S.cycle = st.cycle;
        applyCycle(st.cycle);
        markActive(st.kind);
        trail.setAttribute('width', 0);
        if (st.kind === 'in') {
          setPhase('شهيق ' + ar(st.secs));
          ctx.girl.breathe(st.secs * 1000, 1);
          ctx.girl.pose(Object.assign({ mouth: 'open', brows: 'soft' }, MOVE.in), Math.min(700, st.secs * 500));
          EB.audio.inhale();
        } else if (st.kind === 'out') {
          setPhase('زفير ' + ar(st.secs));
          ctx.girl.breatheOut(st.secs * 1000, 1);
          ctx.girl.pose(Object.assign({ mouth: 'calm', brows: 'soft' }, MOVE.out), Math.min(700, st.secs * 500));
          EB.audio.exhale();
        } else {
          const afterIn = sched[S.i - 1] && sched[S.i - 1].kind === 'in';
          setPhase('ثبات ' + ar(st.secs));
          gradeTxt.textContent = 'HOLD';
          gradeTxt.setAttribute('fill', '#dcdcf8');
          ctx.girl.pose(Object.assign({ mouth: 'calm', brows: 'soft', eyes: afterIn ? .55 : .35, headRot: afterIn ? -1.5 : 2 },
            afterIn ? { raiseL: 22, raiseR: 22, shoulderLift: .6 } : MOVE.out), 500);
        }
        const livePct = totalPresses ? S.totalPoints / totalPresses : 0;
        ctx.ui.meter(`الدقة — ${Math.round(livePct)} نقطة`, livePct);
        if (st.need && !S.ok) ctx.ui.banner('راقبي المؤشر واضغطي داخل المنطقة البيضاء', '', 900);
      }

      function advance() {
        S.running = false; S.i++;
        if (S.i >= sched.length) return succeed();
        const nx = sched[S.i];
        S.cycle = nx.cycle;
        cycleTxt.textContent = `الدورة ${ar(nx.cycle)} من ${ar(cfg.cycles)}`;
        if (nx.need) cue(nx.kind); else runStep();
      }

      function press(kind) {
        if (ctx.isPaused()) return;
        if (S.done || S.running) return;
        if (EB.timer.remaining() <= 0) return;
        const st = sched[S.i];
        if (!st || !st.need) return;
        if (st.kind !== kind) {
          return miss('زر غير صحيح');
        }
        const d = Math.abs(S.cueT - travelTime(st.cycle));
        const ratio = d / win();
        const grade = gradeTiming(ratio);
        if (!grade) return miss('خارج المنطقة');
        credit(grade, d);
        runStep();
      }

      const frame = U.onFrame(function (dt) {
        if (ctx.isPaused()) return;
        if (S.done) return;
        const st = sched[S.i]; if (!st) return;
        if (!S.running) {
          S.cueT += dt * 1000;
          const p = S.cueT / travelTime(st.cycle);
          moveMarker(p);
          const w = clamp(p, 0, 1);
          zoneGlow.setAttribute('opacity', (.10 + .16 * w).toFixed(2));
          zone.setAttribute('opacity', (.78 + .18 * Math.sin(w * Math.PI)).toFixed(2));
          halo.setAttribute('opacity', .08 + .2 * w);
          if (S.cueT >= 2 * travelTime(st.cycle)) { miss('فاتت لحظة الضغط'); }
        } else {
          S.t += dt * 1000;
          const cur = sched[S.i], dur = cur.secs * 1000, v = clamp(S.t / dur, 0, 1);
          const breath = cur.kind === 'in' ? Ease.inOut(v) : cur.kind === 'out' ? 1 - Ease.inOut(v) : S.breath;
          S.breath = cur.kind === 'in' ? 1 : cur.kind === 'out' ? 0 : S.breath;
          zoneGlow.setAttribute('opacity', .08 + breath * .12);
          const rr = 118 + breath * 26;
          halo.setAttribute('rx', rr); halo.setAttribute('ry', 130 + breath * 22);
          halo.setAttribute('opacity', .1 + breath * .24);
          aura.setAttribute('rx', rr - 20); aura.setAttribute('ry', 130 + breath * 22 - 18);
          aura.setAttribute('opacity', .1 + breath * .3);
          const sec = Math.floor(S.t / 1000);
          if (sec !== S.lastSec && cur.kind === 'hold') { S.lastSec = sec; EB.audio.tick(); }
          if (v >= 1) { if (cur.kind === 'out') burst(fx, 460, 300, { count: 5, color: glow, spread: 70, dur: 620, size: .7 }); advance(); }
        }
      });

      function succeed() {
        if (S.done) return;
        S.done = true;
        markActive(null);
        setPhase('هدوء ✓');
        ctx.girl.expression('happy', 500);
        ctx.girl.pose({ breathe: 0, shoulderLift: 0, raiseL: 12, raiseR: 12, bendL: 20, bendR: 20, eyes: .75, headRot: 0 }, 700);
        ctx.girl.anim('stretch', 1200);
        ctx.room.setLighting('warm', 900);
        tween({ from: 0, to: 1, dur: 800, onUpdate: v => { halo.setAttribute('opacity', .34 * (1 - v) + .1); aura.setAttribute('opacity', .4 * (1 - v)); } });
        burst(fx, 460, 330, { count: 16, color: '#e8b45c', spread: 200, dur: 900 });
        burst(fx, 800, 200, { count: 10, color: glow, spread: 120, dur: 800 });
        const finalPct = totalPresses ? Math.round(S.totalPoints / totalPresses) : 0;
        ctx.ui.banner(D.TEXT.breathDone, 'ok', 1500);
        EB.audio.great();
        gradeTxt.textContent = `${Math.max(0, finalPct)}% COMPLETE`;
        gradeTxt.setAttribute('fill', '#fff1b3');
        ctx.ui.meter('تنفّس منتظم ' + ar(finalPct) + '٪', finalPct);
        setTimeout(() => { if (!S.reported) { S.reported = true; ctx.done(finalPct, { partial: finalPct < 100 }); } }, 1500);
      }

      applyCycle(1);
      liveScore();
      ctx.ui.banner('اضغطي الزر النشط عندما يدخل المؤشر إلى المنطقة البيضاء', '', 2600);
      cycleTxt.textContent = `الدورة ١ من ${ar(cfg.cycles)}`;
      cue(sched[0].kind);

      L.stop = function () {
        S.done = true;
        U.offFrame(frame);
        ctx.girl.setPos(500, 486, .95);
        [stage, card, skill].forEach(el => el.remove());
      };
    },
    stop() { if (L.stop) L.stop(); },
    _n: 0
  };

  EB.levels = EB.levels || {};
  EB.levels.breath = L;
})(window.EB);

</script>
<script>
/* تحدي الاسترخاء: أربعة مشتّتات متزامنة وثلاث جولات متدرجة. */
(function (EB) {
  const U = EB.util, { svg, tween, Ease, lerp, clamp, burst, ring } = U;
  const D = EB.data;
  const AR = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'];
  const ar = n => (n >= 0 && n <= 9 ? AR[n] : String(n));
  const SKIN = '#fbdcc0';
  const ROUND_SEC = [22, 17, 13];          // زمن كل جولة بالثواني (لا يختلف بين الفريقين)

  const L = {
    state: null,
    start(ctx) {
      const room = ctx.room, T = room.top, geo = room.topGeo;
      const g = ctx.layers.game, fx = ctx.layers.fx;
      const v = ctx.variant || {};
      const rounds = v.rounds || D.CALM_ROUNDS;
      const catFrom = v.catFrom || 'left';
      const accent = v.accent || '#e6a8b4';
      const main = ctx.meta.colors.main;
      const TOTAL = 8 * rounds.length;

      room.resetTopView();
      room.showTopView(true, 0);
      room.setLighting('focus', 500);
      EB.audio.setVolume(.72);                       // تخفيض علوّ الأصوات في هذه المرحلة
      ctx.girl.group.setAttribute('opacity', 0);     // منظور السقف لا يناسب النموذج الجانبي

      const S = { round: 0, calmed: 0, phase: 'gap', gap: 900, needAdvance: false, roundMs: 0, done: false, t: 0 };
      L.state = S;

      const AV = svg('g', { class: 'calm-avatar', transform: `translate(${geo.girl.x},${geo.girl.y})`, 'pointer-events': 'none' }, g);
      const outline = { stroke: '#533246', 'stroke-width': 2.5, 'stroke-linejoin': 'round' };
      const silk = ctx.meta.colors.light;
      svg('ellipse', { cx: 0, cy: 23, rx: 68, ry: 42, fill: '#462541', opacity: .16 }, AV);
      const avCalm = svg('circle', { r: 78, fill: 'none', stroke: accent, 'stroke-width': 6, opacity: 0 }, AV);
      svg('path', { d: 'M-35,4 Q0,-12 35,4 L58,38 Q47,63 0,59 Q-47,63 -58,38 Z', fill: main, ...outline }, AV);
      svg('path', { d: 'M-49,38 Q0,57 49,38 M-33,32 L-39,44 M0,40 V52 M33,32 L39,44', fill: 'none', stroke: accent, 'stroke-width': 3, 'stroke-linecap': 'round' }, AV);
      for (const side of [-1, 1]) {
        const arm = svg('g', { transform: `scale(${side},1)` }, AV);
        svg('path', { d: 'M29,-2 Q53,-5 54,23 L45,36 L33,29 L36,16 Z', fill: silk, ...outline }, arm);
        svg('ellipse', { cx: 42, cy: 34, rx: 7, ry: 9, fill: SKIN, ...outline }, arm);
      }
      const avBody = svg('ellipse', { cy: 7, rx: 37, ry: 29, fill: silk, ...outline }, AV);
      svg('path', { d: 'M-18,11 Q0,29 18,11 M0,26 V35', fill: 'none', stroke: main, 'stroke-width': 3 }, AV);
      svg('circle', { cy: 29, r: 4, fill: accent, ...outline }, AV);
      const avHead = svg('g', {}, AV);
      const hair = { stroke: '#302032', 'stroke-width': 2.5, 'stroke-linejoin': 'round' };
      // The braid sits behind the crown. Its root stays covered as it sways.
      const avTail = svg('g', {}, avHead);
      svg('path', { d: 'M17,-34 Q44,-34 48,-12 Q55,12 40,26 Q31,23 31,15 Q37,1 28,-8 Q18,-11 17,-34 Z', fill: '#4c3046', ...hair }, avTail);
      svg('path', { d: 'M34,-24 Q42,-12 36,-5 M39,-9 Q49,1 39,7 M41,6 Q45,16 35,19', fill: 'none', stroke: '#a06886', 'stroke-width': 2.2, 'stroke-linecap': 'round' }, avTail);
      svg('path', { d: 'M33,17 L44,21 L41,27 L30,23 Z', fill: accent, ...hair }, avTail);
      svg('path', { d: 'M-33,-19 C-36,-43 -17,-55 0,-55 C21,-55 35,-42 34,-19 C35,3 26,22 13,25 Q0,19 -13,25 C-28,20 -36,4 -33,-19 Z', fill: '#4c3046', ...hair }, avHead);
      svg('path', { d: 'M-22,-14 Q0,-36 22,-14 L22,1 Q16,22 0,24 Q-16,22 -22,1 Z', fill: SKIN, ...outline }, avHead);
      svg('path', { d: 'M-31,-22 Q-33,-50 -4,-53 Q23,-56 32,-35 Q35,-16 23,3 Q25,-10 18,-20 Q7,-22 1,-31 Q-5,-17 -22,-13 Q-25,-3 -22,8 Q-32,2 -31,-22 Z', fill: '#654058', ...hair }, avHead);
      svg('path', { d: 'M-26,-30 Q-17,-46 -2,-47 M-22,-23 Q-12,-29 -4,-40 M6,-47 Q24,-42 28,-28 M13,-38 Q24,-29 27,-18', fill: 'none', stroke: '#b17b98', 'stroke-width': 2.3, 'stroke-linecap': 'round' }, avHead);
      svg('path', { d: 'M-14,0 Q-10,-4 -6,0 M6,0 Q10,-4 14,0 M-4,11 Q0,15 4,11', fill: 'none', stroke: '#674255', 'stroke-width': 2, 'stroke-linecap': 'round' }, avHead);
      svg('path', { d: 'M-24,-27 L-14,-32', stroke: accent, 'stroke-width': 5, 'stroke-linecap': 'round' }, avHead);

      /* ---------- لافتة الإرشاد ---------- */
      const head = svg('g', { 'pointer-events': 'none' }, g);
      svg('rect', { x: 300, y: 22, width: 424, height: 52, rx: 26, fill: 'rgba(255,255,255,.9)', stroke: accent, 'stroke-width': 3 }, head);
      const headTxt = svg('text', { x: 512, y: 55, 'text-anchor': 'middle', 'font-size': 21, 'font-weight': 800, fill: '#5a4034', text: 'أطفئي المشتّتات الأربعة المضيئة' }, head);

      /* ---------- أدوات مناطق اللمس ---------- */
      function mkRing(z, circle) {
        return circle
          ? svg('circle', { cx: z.cx, cy: z.cy, r: z.r, fill: 'none', stroke: '#e8b45c', 'stroke-width': 7, opacity: 0, 'pointer-events': 'none' }, g)
          : svg('rect', { x: z.x, y: z.y, width: z.w, height: z.h, rx: 24, fill: 'none', stroke: '#e8b45c', 'stroke-width': 7, opacity: 0, 'pointer-events': 'none' }, g);
      }
      function mkHit(z, key, circle) {
        const el = circle
          ? svg('circle', { cx: z.cx, cy: z.cy, r: z.r, fill: '#fff', 'fill-opacity': 0, 'pointer-events': 'all', class: 'tap' }, g)
          : svg('rect', { x: z.x, y: z.y, width: z.w, height: z.h, rx: 20, fill: '#fff', 'fill-opacity': 0, 'pointer-events': 'all', class: 'tap' }, g);
        U.tap(el, () => calm(key));
        return el;
      }
      /* شارة حالة بعد الإسكات — خلف كل مناطق اللمس حتى لا تعترض الضغط */
      function tag(x, y, txt) {
        const box = svg('g', { 'pointer-events': 'none' }, g);
        const t = svg('text', { x, y, 'text-anchor': 'middle', 'font-size': 19, 'font-weight': 900, fill: '#5a4034', text: txt }, box);
        let bb;
        try { bb = t.getBBox(); } catch (e) { bb = { x: x - 52, y: y - 16, width: 104, height: 21 }; }
        const bg = svg('rect', { x: bb.x - 12, y: bb.y - 6, width: bb.width + 24, height: bb.height + 12, rx: 14, fill: 'rgba(255,255,255,.92)', stroke: accent, 'stroke-width': 2.5 }, box);
        box.insertBefore(bg, t);
        return box;
      }

      /* ================= ١) الهاتف ================= */
      const PZ = geo.phone;
      const P = {
        noisy: false, next: 0,
        ring: mkRing(PZ), hit: mkHit(PZ, 'phone'),
        label: null,
        begin() {
          this.noisy = true; this.next = 200 + Math.random() * 850;
          this.ring.setAttribute('opacity', .9);
          if (this.label) { this.label.remove(); this.label = null; }
        },
        update(dt, now) {
          if (!this.noisy) { this.ring.setAttribute('opacity', 0); return; }
          const j = Math.sin(now / 55) * 2.4, r = Math.sin(now / 41) * 4.5;
          T.phone.setAttribute('transform', `translate(${PZ.cx + j},${PZ.cy}) rotate(${r})`);
          T.phoneWaves.setAttribute('opacity', .35 + .6 * Math.abs(Math.sin(now / 240)));
          T.phoneScreen.setAttribute('fill', Math.sin(now / 170) > 0 ? '#f7e3d9' : '#e6a8b4');
          this.next -= dt * 1000;
          if (this.next <= 0) { this.next = cur().phoneEvery; EB.audio.ring(); }
        },
        calm() {
          this.noisy = false;
          T.phone.setAttribute('transform', `translate(${PZ.cx},${PZ.cy})`);
          T.phoneWaves.setAttribute('opacity', 0);
          T.phoneScreen.setAttribute('fill', '#55402c');
          this.label = tag(PZ.cx, PZ.cy - 52, 'صامت 🔕');
        }
      };

      /* ================= ٢) النافذة (ريح + رعد خفيف) ================= */
      const WZ = geo.window;
      const WI = {
        noisy: false, next: 2200,
        ring: mkRing(WZ), hit: mkHit(WZ, 'window'),
        flash: svg('ellipse', { cx: WZ.cx, cy: WZ.cy + 30, rx: 210, ry: 120, fill: '#fff8e8', opacity: 0, 'pointer-events': 'none', filter: 'url(#fSoft)' }, g),
        label: null,
        begin() {
          this.noisy = true; this.next = 400 + Math.random() * 1300;
          T.windowBand.setAttribute('fill', 'url(#gStorm)');
          T.shutterL.setAttribute('width', 44);
          T.shutterR.setAttribute('x', 608);
          T.shutterR.setAttribute('width', 44);
          this.ring.setAttribute('opacity', .9);
          if (this.label) { this.label.remove(); this.label = null; }
        },
        update(dt, now) {
          if (!this.noisy) { this.ring.setAttribute('opacity', 0); this.flash.setAttribute('opacity', 0); return; }
          room.curtainWind = cur().wind;
          T.streaks.setAttribute('opacity', (.16 + .3 * Math.abs(Math.sin(now / 620))) * clamp(cur().wind, 0, 1.2));
          this.next -= dt * 1000;
          if (this.next <= 0) {
            this.next = 4600; EB.audio.thunder();
            tween({ from: 0, to: 1, dur: 620, ease: Ease.out, onUpdate: v => this.flash.setAttribute('opacity', .22 * (1 - v)) });
          }
        },
        calm() {
          this.noisy = false;
          room.curtainWind = 0;
          T.streaks.setAttribute('opacity', 0);
          T.windowBand.setAttribute('fill', 'url(#gSky)');
          tween({
            from: 0, to: 1, dur: 100, ease: Ease.inOut, onUpdate: v => {
              T.shutterL.setAttribute('width', lerp(44, 132, v));
              T.shutterR.setAttribute('x', lerp(608, 520, v));
              T.shutterR.setAttribute('width', lerp(44, 132, v));
            }
          });
          this.label = tag(WZ.cx, WZ.cy + 118, 'النافذة مغلقة ✓');
        }
      };

      /* ================= ٣) الطفل عند الباب ================= */
      const DZ = geo.door;
      const K = {
        noisy: false, next: 0, t: 0,
        ring: mkRing(DZ), hit: mkHit(DZ, 'kid'),
        label: null,
        begin() {
          this.noisy = true; this.t = Math.random(); this.next = 250 + Math.random() * 950;
          T.kid.setAttribute('opacity', 1);
          this.ring.setAttribute('opacity', .9);
          if (this.label) { this.label.remove(); this.label = null; }
          tween({ from: 90, to: -64, dur: 100, ease: Ease.out, onUpdate: v => T.doorSwing.setAttribute('transform', `rotate(${v},52,224)`) });
        },
        update(dt, now) {
          if (!this.noisy) { this.ring.setAttribute('opacity', 0); return; }
          const sp = cur().kidSpeed;
          this.t += dt * sp;
          const x = 112 + Math.abs(Math.sin(this.t * 2)) * 46;
          T.kid.setAttribute('transform', `translate(${x},${300 + Math.sin(this.t * 3) * 9}) rotate(${Math.sin(this.t * 3) * 9})`);
          T.kidRipple.setAttribute('opacity', .35 + .65 * Math.abs(Math.sin(this.t * 4)));
          this.next -= dt * 1000;
          if (this.next <= 0) { this.next = 1500 / sp; EB.audio.knock(); }
        },
        calm() {
          this.noisy = false;
          T.kidRipple.setAttribute('opacity', 0);
          tween({
            from: 112, to: 40, dur: 100, ease: Ease.in,
            onUpdate: v => T.kid.setAttribute('transform', `translate(${v},300) scale(${lerp(1, .8, (112 - v) / 72)})`),
            onComplete: () => T.kid.setAttribute('opacity', 0)
          });
          tween({ from: -64, to: 90, dur: 100, ease: Ease.inOut, onUpdate: v => T.doorSwing.setAttribute('transform', `rotate(${v},52,224)`) });
          this.label = tag(DZ.cx + 40, DZ.cy, 'الباب مغلق ✓');
        }
      };

      /* ================= ٤) القط الراكض ================= */
      const CATR = 76;
      const CZ = { cx: 512, cy: 360, r: CATR };
      const C = {
        noisy: false, path: [], k: 0, x: 512, y: 360, ang: 0,
        ring: mkRing(CZ, true), hit: mkHit(CZ, 'cat', true),
        label: null,
        begin() {
          this.noisy = true; this.k = 0;
          this.hit.setAttribute('pointer-events', 'all');
          const lane = geo.catLane, r = Math.random;
          this.path = [];
          for (let i = 0; i < 22; i++) {
            let x = lane.x0 + r() * (lane.x1 - lane.x0), y = lane.y0 + r() * (lane.y1 - lane.y0);
            if (catFrom === 'right') x = (lane.x0 + lane.x1) - x;      // اتجاه الانطلاق بحسب الفريق
            this.path.push({ x, y });
          }
          this.x = this.path[0].x; this.y = this.path[0].y;
          T.cat.setAttribute('opacity', 1);
          T.catBody.setAttribute('rx', 38); T.catBody.setAttribute('ry', 25);
          T.catShadow.setAttribute('rx', 40); T.catShadow.setAttribute('ry', 26);
          T.catPaws.setAttribute('opacity', 1);
          if (this.label) { this.label.remove(); this.label = null; }
          this.ring.setAttribute('opacity', .9);
        },
        update(dt, now) {
          if (!this.noisy) { this.ring.setAttribute('opacity', 0); return; }
          const sp = cur().catSpeed, tg = this.path[this.k % this.path.length];
          const dx = tg.x - this.x, dy = tg.y - this.y, d = Math.hypot(dx, dy) || 1;
          if (d < 24) this.k++;
          const step = Math.min(d, sp * dt);
          this.x += dx / d * step; this.y += dy / d * step;
          this.ang = lerp(this.ang, Math.atan2(dy, dx) * 180 / Math.PI + 180, .14);
          T.cat.setAttribute('transform', `translate(${this.x},${this.y}) rotate(${this.ang})`);
          T.catTail.setAttribute('transform', `rotate(${Math.sin(now / 90) * 20},30,0)`);
          T.catPaws.setAttribute('transform', `translate(0,${Math.sin(now / 70) * 4})`);
          T.catBody.setAttribute('ry', 25 + Math.sin(now / 110) * 2);
          this.hit.setAttribute('cx', this.x); this.hit.setAttribute('cy', this.y);
          this.ring.setAttribute('cx', this.x); this.ring.setAttribute('cy', this.y);
        },
        calm() {
          this.noisy = false;
          this.hit.setAttribute('pointer-events', 'none');
          const x = this.x, y = this.y;
          tween({
            from: 0, to: 1, dur: 100, ease: Ease.out, onUpdate: v => {
              T.catBody.setAttribute('rx', lerp(38, 31, v)); T.catBody.setAttribute('ry', lerp(25, 30, v));
              T.catShadow.setAttribute('rx', lerp(40, 33, v)); T.catShadow.setAttribute('ry', lerp(26, 30, v));
              T.catPaws.setAttribute('opacity', lerp(1, .2, v));
              T.cat.setAttribute('transform', `translate(${x},${y}) rotate(${lerp(this.ang, 0, v)})`);
            }
          });
          T.catTail.setAttribute('transform', 'rotate(0,30,0)');
          T.catPaws.setAttribute('transform', 'translate(0,0)');
          EB.audio.purr();
          this.label = tag(x, y - 60, 'القط هدأ ✓');
        }
      };

      C.hit.setAttribute('pointer-events', 'none');
      const MAP = { phone: P, window: WI, kid: K, cat: C };
      const ORDER = ['phone', 'window', 'kid', 'cat'];
      /* اللابتوب: الأرقام ١..٤ تُسكِت كل مصدر (event.code ⇒ تعمل مع لوحة المفاتيح العربية) */
      const kd = {};
      ORDER.forEach((k, i) => { kd['Digit' + (i + 1)] = () => calm(k); });
      EB.keys.set(kd, '١ الهاتف · ٢ النافذة · ٣ الطفل · ٤ القط — أو بالنقر عليها');
      let wave = 0, nextWaveAt = null;
      const waveDelay = [650, 420, 260];
      function activateWave() {
        wave++;
        nextWaveAt = null;
        for (const key of ORDER) MAP[key].begin();
      }
      function cur() { return rounds[Math.min(S.round, rounds.length - 1)]; }

      /* ---------- الإسكات ---------- */
      function calm(key) {
        const o = MAP[key];
        if (S.done || ctx.isPaused() || S.phase !== 'round') return;
        if (nextWaveAt !== null) return;
        if (!o.noisy) { ctx.mistake(); return; }
        o.calm();
        S.calmed++;
        ctx.live(Math.round(S.calmed / TOTAL * 100));
        ctx.ui.meter(`جولة ${ar(S.round + 1)} — أسكتِّ ${S.calmed} من ${TOTAL}`, S.calmed / TOTAL * 100);
        const c = key === 'cat' ? { cx: C.x, cy: C.y } : (key === 'phone' ? PZ : key === 'window' ? WZ : DZ);
        burst(fx, c.cx, c.cy, { count: 9, color: accent, spread: 100, dur: 650 });
        ring(fx, c.cx, c.cy, { from: 30, to: 120, color: '#fff', dur: 520 });
        EB.audio.good();
        const q = S.calmed / TOTAL;
        avCalm.setAttribute('opacity', .25 + .5 * q);
        avCalm.setAttribute('r', 74 + q * 16);
        tween({ from: 0, to: 1, dur: 320, onUpdate: v => { avBody.setAttribute('ry', lerp(34, 31, v)); avHead.setAttribute('transform', `translate(0,${-2 * v})`); } });
        if (ORDER.every(k => !MAP[k].noisy)) {
          if (wave === 2) endRound(true);
          else {
            nextWaveAt = S.roundMs + waveDelay[S.round] * (.75 + Math.random() * .5);
            headTxt.textContent = 'استعدّي — الموجة الثانية';
          }
        }
      }

      function beginRound() {
        S.roundMs = 0; S.phase = 'round'; S.needAdvance = false;
        const cfg = rounds[S.round];
        wave = 0;
        activateWave();
        headTxt.textContent = `الجولة ${ar(S.round + 1)}: ${cfg.ar} — الموجة الأولى`;
        ctx.ui.banner(`الجولة ${ar(S.round + 1)} من ${ar(rounds.length)} — ${cfg.ar}`, '', 1500);
        room.setLighting(S.round === 0 ? 'focus' : S.round === 1 ? 'warm' : 'storm', 500);
      }
      function endRound(all) {
        for (const key of ORDER) if (MAP[key].noisy) MAP[key].calm();
        nextWaveAt = null;
        room.curtainWind = 0;
        S.phase = 'gap'; S.gap = 1300; S.needAdvance = true;
        if (all) {
          burst(fx, geo.girl.x, geo.girl.y, { count: 12, color: accent, spread: 150, dur: 800 });
          EB.audio.great();
          ctx.ui.banner(D.TEXT.calmedAll, 'ok', 1200);
        } else {
          ctx.ui.banner('انتهى وقت الجولة — نكمل الأسرع', 'no', 1200);
        }
      }
      function finish() {
        if (S.done) return;
        S.done = true;
        const pts = Math.round(S.calmed / TOTAL * 100);
        room.setLighting('calm', 900);
        tween({ from: 0, to: 1, dur: 700, onUpdate: v => { avCalm.setAttribute('opacity', .8 * (1 - v * .4)); avCalm.setAttribute('r', 74 + 40 * v); } });
        burst(fx, geo.girl.x, geo.girl.y, { count: 18, color: '#fff', spread: 210, dur: 900 });
        burst(fx, 512, 300, { count: 12, color: accent, spread: 170, dur: 900 });
        ctx.ui.banner(`${D.TEXT.calmRestored} — ${ar(Math.round(S.calmed / TOTAL * 100))}٪ هدوء`, 'ok', 1500);
        EB.audio.great(); EB.audio.setVolume(1);
        ctx.ui.meter(`هدوء ${pts}٪`, pts);
        setTimeout(() => { if (!S.reported) { S.reported = true; ctx.done(pts, { partial: pts < 100 }); } }, 1300);
      }

      /* ---------- الحلقة الرئيسية ---------- */
      const frame = U.onFrame(function (dt, now) {
        if (ctx.isPaused()) return;
        if (S.done) return;
        S.t += dt;
        if (S.phase === 'gap') {
          S.gap -= dt * 1000;
          if (S.gap <= 0) {
            if (S.needAdvance) {
              if (S.round >= rounds.length - 1) return finish();
              S.round++;
            }
            beginRound();
          }
          return;
        }
        S.roundMs += dt * 1000;
        if (nextWaveAt !== null && S.roundMs >= nextWaveAt) {
          activateWave();
          headTxt.textContent = 'الموجة الثانية — أطفئي المشتّتات معًا';
        }
        P.update(dt, now); WI.update(dt, now); K.update(dt, now); C.update(dt, now);
        /* حركة البطلة: تتبع المصدر الأكثر إزعاجًا */
        const nois = ORDER.filter(k => MAP[k].noisy);
        if (nois.length) {
          const k = nois[0];
          const cx = k === 'cat' ? C.x : (k === 'phone' ? PZ.cx : k === 'window' ? WZ.cx : DZ.cx);
          const cy = k === 'cat' ? C.y : (k === 'phone' ? PZ.cy : k === 'window' ? WZ.cy : DZ.cy);
          const a = Math.atan2(cy - geo.girl.y, cx - geo.girl.x) * 180 / Math.PI;
          avHead.setAttribute('transform', `rotate(${lerp(0, clamp(a, -28, 28), .12)})`);
          avTail.setAttribute('transform', `rotate(${Math.sin(S.t * 3) * 4},24,-29)`);
          avBody.setAttribute('ry', 32 + Math.sin(S.t * 5) * 1.4);
        }
        if (S.roundMs > ROUND_SEC[Math.min(S.round, ROUND_SEC.length - 1)] * 1000) endRound(false);
      });

      /* ---------- البداية ---------- */
      ctx.ui.meter(`جولة ${ar(1)} — أسكتِّ 0 من ${TOTAL}`, 0);
      ctx.ui.banner('أطفئي المشتّتات الأربعة، ثم استعدّي للموجة الثانية', '', 1600);

      L.stop = function () {
        S.done = true;
        U.offFrame(frame);
        EB.audio.setVolume(1);
        room.curtainWind = 0;
        [P, WI, K, C].forEach(o => { if (o.ring) o.ring.remove(); if (o.hit) o.hit.remove(); if (o.label) o.label.remove(); });
        if (WI.flash) WI.flash.remove();
        head.remove();
        room.resetTopView();
        room.showTopView(false, 300);
        ctx.girl.group.setAttribute('opacity', 1);
      };
    },
    stop() { if (L.stop) L.stop(); }
  };

  EB.levels = EB.levels || {};
  EB.levels.calm = L;
})(window.EB);

</script>
<script>
/* ============ التحدي 3 — MOVE MEMORY: ذاكرة الحركات الرياضية ============
   الفكرة كما هي: البطلة تشاهد مدريبتها على الهاتف تؤدي ٣ حركات بالترتيب، ثم
   تستدعي الترتيب من أزرار مرتبكة وتؤدي الحركة المختارة. التطوير هنا بصري فقط. */
(function (EB) {
  const U = EB.util, { svg, tween, Ease, lerp, burst } = U;
  const ICON = { armsUp: '🙌', stretch: '🤸', march: '🚶', jump: '🦘' };
  const LINE = '#5a4034';

  /* أيقونات مرسومة محليًا لكل حركة (بدل الاعتماد على الرموز فقط) */
  function moveIcon(parent, id, x, y, s, color) {
    const g = svg('g', { transform: `translate(${x},${y}) scale(${s})`, 'pointer-events': 'none' }, parent);
    const st = { stroke: color || LINE, 'stroke-width': 6, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', fill: 'none' };
    const p = (d, a) => svg('path', Object.assign({ d }, st, a || {}), g);
    svg('circle', { cx: 0, cy: -22, r: 8, fill: color || LINE }, g);
    if (id === 'armsUp') { p('M0,-13 l0,22'); p('M0,-9 l-16,-18 M0,-9 l16,-18'); p('M0,9 l-11,17 M0,9 l11,17'); }
    if (id === 'stretch') { p('M0,-13 l-4,22'); p('M-2,-9 l-18,-14'); p('M-2,-9 l14,4'); p('M-4,9 l-10,17 M-4,9 l12,15'); }
    if (id === 'march') { p('M0,-13 l0,21'); p('M0,-8 l-14,6 M0,-8 l13,-9'); p('M0,8 l-13,15 M0,8 l10,20 l-6,6'); }
    if (id === 'jump') { p('M0,-13 l0,18'); p('M0,-10 l-17,-15 M0,-10 l17,-15'); p('M0,5 l-14,10 M0,5 l14,10'); p('M-22,22 l8,4 M22,22 l-8,4', { 'stroke-width': 4, opacity: .65 }); }
    return g;
  }

  const L = {
    start(ctx) {
      const cfg = ctx.variant || { sequence: ['armsUp', 'stretch', 'march'], viewSeconds: 2 };
      const seq = cfg.sequence.slice();
      const girl = ctx.girl, trainer = ctx.trainer, g = ctx.layers.game, fx = ctx.layers.fx, bg = ctx.layers.bgfx;
      const accent = ctx.meta.colors.glow, main = ctx.meta.colors.main;
      const S = { phase: 'watch', k: 0, points: 0, rewatch: 0, done: false, timers: [] }; L.state = S;
      const later = (ms, fn) => S.timers.push(setTimeout(fn, ms));
      const clearAll = () => { S.timers.forEach(t => clearTimeout(t)); S.timers = []; };

      /* --- المشهد: البطلة واقفة على أرض الغرفة (لا على السرير) تشاهد شاشة التمرين --- */
      const GX = 706, GY = 472, GS = .84;
      girl.setOutfit(EB.data.OUTFITS.sport);
      girl.setPose(Object.assign({}, EB.Character.POSES.stand, { mouth: 'neutral', brows: 'flat', eyes: 1 }));
      girl.setPos(GX, GY, GS);
      girl.prop('phone', { offset: { x: -6, y: -14 } });
      ctx.room.setLighting('day', 400);
      ctx.ui.meter('شاهدي الحركات', 0);

      /* ---------- بطاقة البث: هاتف كبير بحواف وجهاز داخلي ---------- */
      const VX = 88, VY = 96, VW = 486, VH = 356;
      const clip = svg('clipPath', { id: 'clip-video' }, EB.dom.defs);
      svg('rect', { x: VX, y: VY, width: VW, height: VH, rx: 30 }, clip);

      const frame = svg('g', {}, bg);
      svg('rect', { x: VX - 16, y: VY - 16, width: VW + 32, height: VH + 32, rx: 42, fill: 'rgba(110,78,50,.22)', filter: 'url(#fSoft)' }, frame);
      svg('rect', { x: VX - 13, y: VY - 13, width: VW + 26, height: VH + 26, rx: 38, fill: '#55402c', stroke: '#3a2a1e', 'stroke-width': 3 }, frame);
      svg('rect', { x: VX - 8, y: VY - 8, width: VW + 16, height: VH + 16, rx: 32, fill: '#6b5138' }, frame);
      const screen = svg('rect', { x: VX, y: VY, width: VW, height: VH, rx: 30, fill: '#eaf3f0' }, frame);
      svg('rect', { x: VX + VW / 2 - 44, y: VY - 12, width: 88, height: 12, rx: 6, fill: '#3a2a1e' }, frame);
      const inside = svg('g', { 'clip-path': 'url(#clip-video)' }, frame);

      /* استوديو داخل البطاقة: جدار + مرآة + سجادة + أوزان */
      svg('rect', { x: VX, y: VY, width: VW, height: VH, fill: 'url(#gWall)' }, inside);
      svg('rect', { x: VX, y: VY + VH - 96, width: VW, height: 96, fill: '#e6dccb' }, inside);
      svg('rect', { x: VX + 26, y: VY + 34, width: 128, height: 92, rx: 12, fill: '#dfeae6', stroke: '#c3d3d0', 'stroke-width': 3 }, inside);
      svg('path', { d: `M${VX + 34},${VY + 118} l40,-72 M${VX + 70},${VY + 118} l46,-72`, stroke: '#fff', 'stroke-width': 5, opacity: .6, fill: 'none' }, inside);
      svg('ellipse', { cx: VX + VW / 2, cy: VY + VH - 52, rx: 168, ry: 30, fill: accent, opacity: .5 }, inside);
      svg('ellipse', { cx: VX + VW / 2, cy: VY + VH - 52, rx: 128, ry: 20, fill: '#fff', opacity: .45 }, inside);
      /* رفّ الأوزان */
      const rack = svg('g', {}, inside);
      svg('rect', { x: VX + VW - 122, y: VY + VH - 118, width: 96, height: 10, rx: 5, fill: '#b98a6a' }, rack);
      svg('rect', { x: VX + VW - 116, y: VY + VH - 78, width: 84, height: 10, rx: 5, fill: '#b98a6a' }, rack);
      [[-104, -128], [-64, -128], [-100, -88], [-60, -88]].forEach(o =>
        svg('rect', { x: VX + VW + o[0], y: VY + VH + o[1], width: 26, height: 16, rx: 7, fill: '#7d6a52', stroke: LINE, 'stroke-width': 2 }, rack));
      /* قارورة ماء + نبتة */
      svg('path', { d: `M${VX + 40},${VY + VH - 46} l0,-26 q0,-8 8,-8 l6,0 q8,0 8,8 l0,26 z`, fill: '#cfe3ea', stroke: '#7fb0c4', 'stroke-width': 2.4 }, inside);
      svg('rect', { x: VX + 48, y: VY + VH - 82, width: 12, height: 10, rx: 3, fill: '#7fb0c4' }, inside);
      const plant = svg('g', { transform: `translate(${VX + VW - 40},${VY + VH - 104})` }, inside);
      svg('path', { d: 'M0,0 q-16,-24 -4,-40 q10,14 4,40 M0,0 q16,-22 6,-40 q-12,16 -6,40', fill: '#8fbb7a', stroke: '#6f8a5c', 'stroke-width': 2 }, plant);
      svg('path', { d: 'M-12,0 l24,0 l-4,18 l-16,0 z', fill: '#c9a179', stroke: '#b3855f', 'stroke-width': 2 }, plant);

      /* هالة نبض إيقاعي خلف المدربة */
      const pulse = svg('circle', { cx: VX + VW / 2, cy: VY + VH - 96, r: 62, fill: 'none', stroke: main, 'stroke-width': 4, opacity: .35 }, inside);
      const trail = svg('g', { opacity: 0 }, inside);
      const trailArcs = [0, 1, 2].map(i =>
        svg('path', { d: `M${VX + VW / 2 - 70 + i * 18},${VY + VH - 150} q${34 - i * 8},-58 ${68 - i * 10},-6`, fill: 'none', stroke: main, 'stroke-width': 5 - i, 'stroke-linecap': 'round', opacity: .5 - i * .12 }, trail));

      const vText = svg('text', { x: VX + VW / 2, y: VY + 40, 'text-anchor': 'middle', 'font-size': 21, 'font-weight': 800, fill: '#5a4034', text: 'شاهدي الحركات واحفظي ترتيبها!' }, frame);
      /* شارة بث مباشر + عدّاد المشاهدات */
      const live = svg('g', {}, frame);
      svg('rect', { x: VX + 18, y: VY + VH - 40, width: 92, height: 28, rx: 14, fill: '#c1707f' }, live);
      const liveDot = svg('circle', { cx: VX + 34, cy: VY + VH - 26, r: 6, fill: '#fff' }, live);
      svg('text', { x: VX + 48, y: VY + VH - 19, 'font-size': 16, 'font-weight': 900, fill: '#fff', text: 'LIVE' }, live);
      const hearts = svg('g', {}, frame);
      const heartEls = [0, 1, 2, 3].map(i => svg('path', {
        d: 'M0,0 q-6,-8 -12,-2 q-5,5 12,16 q17,-11 12,-16 q-6,-6 -12,2 z',
        fill: i % 2 ? '#e6a8b4' : main, opacity: 0, transform: `translate(${VX + VW - 40 - i * 26},${VY + VH - 40}) scale(.8)`
      }, hearts));
      const stepTxt = svg('text', { x: VX + VW / 2, y: VY + 68, 'text-anchor': 'middle', 'font-size': 18, 'font-weight': 800, fill: main, text: '' }, frame);
      /* شريط تقدم مقسّم إلى فصول */
      const barBack = svg('rect', { x: VX + 14, y: VY + VH - 54, width: VW - 140, height: 10, rx: 5, fill: 'rgba(255,255,255,.75)', stroke: 'rgba(110,78,50,.18)', 'stroke-width': 1.6 }, frame);
      const bar = svg('rect', { x: VX + 14, y: VY + VH - 54, width: 0, height: 10, rx: 5, fill: main }, frame);
      const barDots = seq.map((_, i) => svg('circle', { cx: VX + 14 + (i + 1) * (VW - 140) / seq.length, cy: VY + VH - 49, r: 6, fill: '#fff', stroke: main, 'stroke-width': 2.6, opacity: .9 }, frame));

      /* المدربة داخل الإطار */
      trainer.setOutfit({ top: '#a8c18a', bottom: '#8a5a37', accent: '#f7ecd8', hair: '#4a2f22', skin: '#e8bfa0', main: main, collar: '#f2e7d2', pin: null, sock: '#fdf6e9', shoe: '#5a3f2c', eye: '#4a2f22', brow: '#4a2f22', band: main });
      trainer.group.setAttribute('opacity', 1);
      trainer.setPos(VX + VW / 2, VY + VH - 66, .54);
      trainer.setPose(EB.Character.POSES.stand);
      trainer.expression('happy', 0);

      function playSequence(then) {
        const per = (cfg.viewSeconds || 2) * 1000;
        let i = 0;
        const total = seq.length * per;
        const t0 = performance.now();
        const f = U.onFrame((d, now) => {
          const e = performance.now() - t0;
          bar.setAttribute('width', lerp(0, VW - 140, Math.min(1, e / total)));
          pulse.setAttribute('r', 58 + Math.sin(now / 240) * 7);
          pulse.setAttribute('opacity', .22 + .18 * Math.abs(Math.sin(now / 240)));
          heartEls.forEach((h, k) => {
            const ph = ((now / 1400) + k * .27) % 1;
            h.setAttribute('opacity', (1 - ph) * .85);
            h.setAttribute('transform', `translate(${VX + VW - 40 - k * 26 + Math.sin(ph * 6) * 6},${VY + VH - 40 - ph * 96}) scale(${.7 + ph * .5})`);
          });
        });
        S.frame = f;
        (function step() {
          if (S.done) return;
          if (i >= seq.length) { U.offFrame(f); S.frame = null; then(); return; }
          stepTxt.textContent = `الحركة ${i + 1} من ${seq.length}`;
          vText.textContent = EB.data.MOVES.find(m => m.id === seq[i]).ar;
          trainer.anim(seq[i], per * .92);
          trail.setAttribute('opacity', 1);
          tween({ from: 0, to: 1, dur: 460, ease: Ease.out, onUpdate: v => trailArcs.forEach((a, k) => a.setAttribute('opacity', (1 - v) * (.5 - k * .12))) });
          barDots.forEach((d, di) => d.setAttribute('fill', di < i ? main : '#fff'));
          EB.audio.pop();
          later(per, () => { i++; step(); });
        })();
      }

      /* --- عرض الفيديو --- */
      later(700, () => playSequence(() => {
        S.phase = 'recall';
        vText.textContent = 'أعيدي الحركات بالترتيب الصحيح!';
        stepTxt.textContent = '';
        screen.setAttribute('fill', '#3a2a1e');
        trainer.group.setAttribute('opacity', 0);
        inside.setAttribute('opacity', .25);
        pulse.setAttribute('opacity', 0);
        trail.setAttribute('opacity', 0);
        hearts.setAttribute('opacity', .35);
        buildButtons();
        ctx.ui.banner('دوركِ الآن — تذكّري الترتيب', '', 1400);
        EB.audio.tick();
      }));

      /* --- خانات الترتيب --- */
      const slots = [];
      function buildSlots() {
        const box = svg('g', { 'pointer-events': 'none' }, g);
        svg('rect', { x: 214, y: 440, width: 596, height: 96, rx: 26, fill: 'rgba(255,255,255,.55)', stroke: main, 'stroke-width': 3 }, box);
        for (let i = 0; i < seq.length; i++) {
          const x = 250 + i * 180;
          svg('rect', { x: x - 64, y: 452, width: 128, height: 72, rx: 18, fill: '#fffdfa', stroke: main, 'stroke-width': 3, 'stroke-linejoin': 'round' }, box);
          svg('path', { d: `M${x - 64},${470} l-16,0`, stroke: main, 'stroke-width': 4, 'stroke-linecap': 'round', opacity: i ? .9 : 0 }, box);
          const num = svg('text', { x: x - 44, y: 478, 'font-size': 19, 'font-weight': 900, fill: '#a89382', text: `${i + 1}` }, box);
          const ic = moveIcon(box, seq[i], x + 18, 490, .62, main);
          ic.setAttribute('opacity', 0);
          const chk = svg('text', { x: x + 44, y: 478, 'text-anchor': 'middle', 'font-size': 20, 'font-weight': 900, fill: '#4f6f3f', text: '', opacity: 0 }, box);
          slots.push({ num, ic, chk });
        }
        svg('text', { x: 512, y: 556, 'text-anchor': 'middle', 'font-size': 17, 'font-weight': 800, fill: '#8a7365', text: 'ترتيبك' }, box);
        S.slotBox = box;
      }
      function buildButtons() {
        buildSlots();
        const order = U.shuffle(seq.map((id, i) => ({ id, i })), U.rng(1000 + ctx.index * 7 + (ctx.team === 'purple' ? 13 : 0)));
        const kd = {};
        order.forEach((o, idx) => {
          const mv = EB.data.MOVES.find(m => m.id === o.id);
          const b = ctx.ui.addBtn(`${ICON[o.id]} ${mv.ar}`, 'big violet', () => choose(o.id, b), String(idx + 1));
          b.dataset.move = o.id;
          kd['Digit' + (idx + 1)] = () => choose(o.id, b);
        });
        const doRewatch = () => {
          if (S.rewatch >= 1 || S.phase !== 'recall') { ctx.ui.toast('لا يمكن المشاهدة مجددًا'); return; }
          S.rewatch++;
          rw.remove();
          inside.setAttribute('opacity', 1);
          trainer.group.setAttribute('opacity', 1);
          screen.setAttribute('fill', '#eaf3f0');
          hearts.setAttribute('opacity', 1);
          vText.textContent = 'شاهدي الحركات واحفظي ترتيبها!';
          playSequence(() => {
            vText.textContent = 'أعيدي الحركات بالترتيب الصحيح!';
            screen.setAttribute('fill', '#3a2a1e');
            trainer.group.setAttribute('opacity', 0);
            inside.setAttribute('opacity', .25);
          });
          ctx.ui.toast('المؤقت يستمر أثناء المشاهدة ⏳');
        };
        const rw = ctx.ui.addBtn('▶ مشاهدة مرة أخرى', 'big ghost', doRewatch, 'R');
        kd.KeyR = doRewatch;
        EB.keys.set(kd, '١..٤ لاختيار الحركة · R لإعادة المشاهدة');
      }

      /* --- أداء البطلة للحركة المختارة --- */
      const spot = svg('g', { opacity: 0, 'pointer-events': 'none' }, g);
      svg('ellipse', { cx: GX, cy: GY + 96, rx: 118, ry: 24, fill: 'url(#gPool)', opacity: .9 }, spot);
      const perfTxt = svg('text', { x: GX, y: GY + 132, 'text-anchor': 'middle', 'font-size': 19, 'font-weight': 900, fill: '#5a4034', text: '', 'pointer-events': 'none' }, g);

      function perform(id, ok) {
        girl.stopMotion();
        girl.setPose(EB.Character.POSES.stand);
        girl.anim(id, ok ? 1500 : 1200);
        spot.setAttribute('opacity', ok ? 1 : .5);
        tween({ from: 0, to: 1, dur: ok ? 1500 : 1200, ease: Ease.out, onUpdate: v => spot.setAttribute('opacity', (ok ? 1 : .5) * (1 - v * .7)) });
        perfTxt.textContent = ok ? EB.data.MOVES.find(m => m.id === id).ar : '';
        tween({ from: 0, to: 1, dur: 900, onUpdate: v => perfTxt.setAttribute('opacity', v < .3 ? v / .3 : 1 - (v - .3) / .7) });
        if (ok) burst(fx, GX, GY - 60, { count: 7, color: accent, spread: 90, dur: 620 });
      }

      function choose(id, btn) {
        if (S.done || ctx.isPaused() || S.phase !== 'recall') return;
        if (id === seq[S.k]) {
          perform(id, true);
          const s = slots[S.k];
          s.ic.setAttribute('opacity', 1);
          s.num.setAttribute('fill', main);
          s.chk.textContent = '✓'; s.chk.setAttribute('opacity', 1);
          tween({ from: 0, to: 1, dur: 320, ease: Ease.out, onUpdate: v => s.ic.setAttribute('opacity', v) });
          btn.classList.add('off'); btn.disabled = true;
          S.k++;
          S.points = Math.round(S.k / seq.length * 100);
          ctx.live(S.points);
          ctx.ui.meter(`صح ${S.k}/${seq.length}`, S.points);
          U.burst(fx, 512, 480, { count: 8, color: '#e8b45c', spread: 90, dur: 600 });
          EB.audio.good();
          if (S.k >= seq.length) finish();
        } else {
          perform(id, false);                 // تؤدي الحركة المختارة حتى لو خاطئة
          ctx.ui.banner(EB.data.TEXT.rememberOrder, 'no', 1200);
          ctx.mistake();
          EB.audio.wrong();
          btn.classList.add('off');
          setTimeout(() => btn.classList.remove('off'), 500);
        }
      }

      function finish() {
        if (S.done) return;
        S.done = true;
        ctx.ui.clearControls();
        vText.textContent = 'أحسنتِ! تذكرتِ الترتيب كاملًا';
        let i = 0;
        const per = 900;
        (function fast() {
          if (i >= seq.length) {
            girl.expression('happy', 300);
            girl.anim('celebrate', 1400);
            burst(fx, 512, 300, { count: 16, color: accent, spread: 200, dur: 900 });
            ctx.ui.banner(EB.data.TEXT.moveDone, 'ok', 1500);
            EB.audio.great();
            ctx.ui.meter('اكتملت الحركة', 100);
            later(1300, () => ctx.done(100));
            return;
          }
          girl.anim(seq[i], per * .8);
          later(per, () => { i++; fast(); });
        })();
      }

      L.stop = function () {
        S.done = true; clearAll();
        if (S.frame) U.offFrame(S.frame);
        trainer.group.setAttribute('opacity', 0);
        trainer.setPose(EB.Character.POSES.stand);
        girl.dropProp();
        girl.setOutfit(EB.data.OUTFITS.home);
        const c = document.getElementById('clip-video'); if (c) c.remove();
      };
    },
    stop() { if (L.stop) L.stop(); }
  };

  EB.levels = EB.levels || {};
  EB.levels.move = L;
})(window.EB);

</script>
<script>
/* ============ التحدي 4 — HEALTHY CATCH: التقاط الطعام لتكوين طبق متوازن ============
   الفكرة كما هي: طعام يتساقط وصحن تتحكمين به يمينًا ويسارًا أثناء اللعب.
   التطوير هنا بصري فقط (رسمات الأطعمة، حركة السقوط، تفاعلات البطلة والصحن).
   لا ربط أبدًا بين الأطعمة والوزن أو شكل الجسم. */
(function (EB) {
  const U = EB.util, { svg, tween, Ease, lerp, clamp, burst } = U;
  const D = EB.data;
  const LINE = '#5a4034';

  const FOOD_NAMES = {
    apple: 'تفاح', banana: 'موز', carrot: 'جزر', orange: 'برتقال',
    egg: 'بيض', beans: 'فاصوليا', fish: 'سمك', chicken: 'دجاج',
    bread: 'خبز', rice: 'أرز', oats: 'شوفان', water: 'ماء',
    candy: 'حلوى', cake: 'كعكة', soda: 'مشروب غازي'
  };
  /* ---------- رسمات الأطعمة: جسم + ظل داخلي + لمعة ---------- */
  function drawFood(parent, id) {
    const art = {
      apple: p => {

        path('M-7,-9 q4,-5 8,-2', { stroke: '#fff', 'stroke-width': 3.4, opacity: .65, fill: 'none', 'stroke-linecap': 'round' }, p);

      },
      banana: p => {
        path('M-18,6 q2,-22 22,-22 q14,0 12,10 q-10,-2 -20,6 q-8,7 -14,6 z', { fill: '#ffd85c' }, p);
        path('M-18,6 q10,4 20,-4 q8,-6 14,-6 q2,10 -10,14 q-14,5 -24,-4 z', { fill: '#e8b45c' }, p);
        path('M-12,-2 q8,-8 18,-8', { stroke: '#fff6cf', 'stroke-width': 3, opacity: .8, fill: 'none', 'stroke-linecap': 'round' }, p);
        path('M-19,4 l-4,4 l5,2 z', { fill: '#8a6b3a' }, p);
      },
      carrot: p => {
        path('M-2,-14 l12,4 q4,6 -2,10 l-16,14 q-8,-6 -4,-14 z', { fill: '#ff9a4d' }, p);
        path('M6,-9 l8,3 q3,5 -2,9 l-10,8 q4,-11 4,-20 z', { fill: '#e07b2f', opacity: .6 }, p);
        path('M-6,-4 l8,2 M-9,4 l8,2', { stroke: '#e07b2f', 'stroke-width': 2, opacity: .8 }, p);
        path('M-4,-16 q-10,-10 -16,-4 q8,2 10,8 z M-2,-16 q2,-14 10,-12 q-4,8 -6,12 z', { fill: '#86a86a', stroke: '#6f8a5c', 'stroke-width': 1.6 }, p);
      },
      orange: p => {
        svg('circle', { cx: 0, cy: 0, r: 17, fill: '#ffb04d' }, p);
        path('M3,-15 a17,17 0 0 1 0,30 a17,17 0 0 0 0,-30 z', { fill: '#e08a2f', opacity: .45 }, p);
        svg('circle', { cx: -6, cy: -7, r: 4.6, fill: '#fff', opacity: .5 }, p);
        for (let i = 0; i < 7; i++) svg('circle', { cx: -10 + i * 3.4, cy: -2 + (i % 2) * 6, r: 1.3, fill: '#e8963c', opacity: .8 }, p);
        path('M0,-17 q2,-7 9,-8 q-2,7 -6,9 z', { fill: '#7a4a2b' }, p);
        path('M6,-22 q11,-6 15,3 q-9,4 -15,-3 z', { fill: '#8fbb7a', stroke: '#6f8a5c', 'stroke-width': 1.6 }, p);
      },
      egg: p => {
        path('M0,-18 q13,4 13,16 q0,12 -13,13 q-13,-1 -13,-13 q0,-12 13,-16 z', { fill: '#fff6e2', stroke: '#e0cba8', 'stroke-width': 2.2 }, p);
        path('M5,-14 q8,5 8,14 q0,8 -8,10 q5,-9 0,-24 z', { fill: '#eadfc4', opacity: .8 }, p);
        svg('ellipse', { cx: -4, cy: -6, rx: 3.4, ry: 5, fill: '#fff', opacity: .9 }, p);
      },
      beans: p => {
        [[-9, -3], [0, 4], [9, -2], [-2, -9], [7, 8]].forEach((c, i) => {
          svg('ellipse', { cx: c[0], cy: c[1], rx: 7.4, ry: 5.2, transform: `rotate(${i % 2 ? 24 : -18},${c[0]},${c[1]})`, fill: i % 2 ? '#b56a4b' : '#9c5a3d', stroke: '#7c442c', 'stroke-width': 1.6 }, p);
          svg('path', { d: `M${c[0] - 3},${c[1] - 1} q3,-2 6,0`, stroke: '#e3b195', 'stroke-width': 1.6, fill: 'none', opacity: .8 }, p);
        });
      },
      fish: p => {
        path('M-18,0 q14,-15 30,-4 q8,6 4,10 q-12,8 -34,-6 z', { fill: '#7fb0c4', stroke: '#5b8ba0', 'stroke-width': 2.2 }, p);
        path('M-4,-6 q8,4 12,10 q-9,2 -16,-4 z', { fill: '#dfeae6', opacity: .8 }, p);
        path('M12,-4 l12,-9 l-2,18 z', { fill: '#5b8ba0', stroke: '#4a6f80', 'stroke-width': 1.8 }, p);
        path('M-2,-8 q4,-8 10,-6 q-3,6 -6,8 z', { fill: '#e6a8b4', opacity: .9 }, p);
        svg('circle', { cx: -10, cy: -1, r: 2.6, fill: '#3a2a1e' }, p);
        svg('circle', { cx: -11, cy: -2, r: .9, fill: '#fff' }, p);

        path('M6,-13 q12,3 12,17 q0,5 -4,6 q3,-14 -8,-23 z', { fill: '#c8975a', opacity: .5 }, p);

      },
      rice: p => {

        path('M-18,6 q18,12 36,0 q-4,10 -18,10 q-14,0 -18,-10 z', { fill: '#e6dcc0' }, p);
        for (let i = 0; i < 8; i++) svg('ellipse', { cx: -13 + i * 3.6, cy: -3 + (i % 3) * 3, rx: 2.6, ry: 1.6, transform: `rotate(${i * 24},${-13 + i * 3.6},${-3 + (i % 3) * 3})`, fill: '#fff', stroke: '#e3d8bd', 'stroke-width': 1 }, p);
