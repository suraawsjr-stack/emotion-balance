        path('M-16,-4 q16,7 32,0 l0,-4 q-16,7 -32,0 z', { fill: '#cbb287', opacity: .7 }, p);
        for (let i = 0; i < 5; i++) svg('ellipse', { cx: -11 + i * 5.6, cy: 3, rx: 2.4, ry: 1.6, fill: '#fff6e0', stroke: '#c2a87b', 'stroke-width': 1 }, p);
      },
      water: p => {
        path('M-10,-18 h20 v6 l4,7 l0,21 q0,5 -6,5 l-16,0 q-6,0 -6,-5 l0,-21 l4,-7 z', { fill: '#e6f0ea', stroke: '#7fb0c4', 'stroke-width': 2.2 }, p);
        path('M-8,4 l16,0 l0,11 q0,4 -4,4 l-8,0 q-4,0 -4,-4 z', { fill: '#a8d3e0', opacity: .9 }, p);
        path('M-8,4 l16,0 l0,3 l-16,0 z', { fill: '#cfe3ea' }, p);
        svg('rect', { x: -10, y: -22, width: 20, height: 6, rx: 2.5, fill: '#5b8ba0' }, p);
        path('M-5,-8 l0,16', { stroke: '#fff', 'stroke-width': 3, opacity: .7, 'stroke-linecap': 'round' }, p);
      },
      candy: p => {
        path('M-15,-7 l-9,-9 l1,26 l8,-8 z', { fill: '#e6a8b4', stroke: '#c1707f', 'stroke-width': 1.8 }, p);
        path('M15,-7 l9,-9 l-1,26 l-8,-8 z', { fill: '#e6a8b4', stroke: '#c1707f', 'stroke-width': 1.8 }, p);
        svg('circle', { cx: 0, cy: 0, r: 13, fill: '#f2c3c9', stroke: '#c1707f', 'stroke-width': 2.2 }, p);
        path('M-7,-7 q7,4 0,14 q-7,-4 0,-14 z', { fill: '#fff', opacity: .55 }, p);
        svg('circle', { cx: 5, cy: -5, r: 2.2, fill: '#fff', opacity: .8 }, p);
      },
      cake: p => {
        svg('rect', { x: -17, y: -2, width: 34, height: 18, rx: 5, fill: '#f6b8d4', stroke: '#c99a86', 'stroke-width': 2.2 }, p);
        path('M-17,-2 q8,-12 17,0 q9,-12 17,0 l0,6 l-34,0 z', { fill: '#fdf6ec', stroke: '#c99a86', 'stroke-width': 1.8 }, p);
        path('M-14,8 q6,4 12,0 q6,4 12,0', { stroke: '#fff', 'stroke-width': 2.6, fill: 'none', opacity: .8 }, p);
        svg('circle', { cx: 0, cy: -12, r: 4.6, fill: '#c1707f' }, p);
        path('M0,-16 l0,-6', { stroke: '#8a6b3a', 'stroke-width': 2 }, p);
      },
      soda: p => {
        svg('rect', { x: -11, y: -18, width: 22, height: 36, rx: 7, fill: '#b6a3d2', stroke: '#8a6fae', 'stroke-width': 2.2 }, p);
        svg('rect', { x: -11, y: -6, width: 22, height: 11, fill: '#fff', opacity: .55 }, p);
        path('M-6,2 q3,-4 6,0 q3,-4 6,0', { stroke: '#8a6fae', 'stroke-width': 2, fill: 'none', opacity: .8 }, p);
        svg('rect', { x: -11, y: -18, width: 6, height: 36, rx: 3, fill: '#fff', opacity: .3 }, p);
        svg('circle', { cx: 0, cy: -20, r: 4, fill: '#e3dced', stroke: '#8a6fae', 'stroke-width': 1.6 }, p);

    };
    const p = svg('g', {}, parent);
    (art[id] || art.apple)(p);
    return p;
  }
  function path(d, a, p) { return svg('path', Object.assign({ d }, a || {}), p); }

  const L = {
    start(ctx) {
      const speeds = [1, 1.38, 1.88];
      const cfg = ctx.variant || { needed: [], extras: [], fallSeconds: 3 };
      const girl = ctx.girl, g = ctx.layers.game, fx = ctx.layers.fx, bg = ctx.layers.bgfx;
      const main = ctx.meta.colors.main, glow = ctx.meta.colors.glow;
      const GY = 520, SCALE = .82, PLATE_HALF = 58 * SCALE + 12;
      const S = {
        x: 512, dir: 0, t: 0, round: 0, intermission: false, collected: 0, done: false, items: [], filled: {}, points: 0,
        queue: [], mercy: 0, plateTilt: 0, caught: []
      };
      L.state = S;
      const groups = D.GROUPS;
      groups.forEach(gr => S.filled[gr.id] = false);

      /* ---------- ديكور المطبخ الأمامي: كاونتر خشبي بخزائن ومقابض ---------- */
      const kit = svg('g', { 'pointer-events': 'none' }, bg);
      svg('rect', { x: 0, y: 598, width: 1024, height: 42, fill: '#c99a6c' }, kit);
      for (let i = 0; i < 8; i++) {
        const x = 10 + i * 128;
        svg('rect', { x: x, y: 604, width: 54, height: 30, rx: 6, fill: '#e8c9a4', stroke: '#b98a5c', 'stroke-width': 1.8 }, kit);
        svg('rect', { x: x + 62, y: 604, width: 54, height: 30, rx: 6, fill: '#e8c9a4', stroke: '#b98a5c', 'stroke-width': 1.8 }, kit);
        svg('rect', { x: x + 48, y: 613, width: 5, height: 13, rx: 2.5, fill: '#8a5a37' }, kit);
        svg('rect', { x: x + 70, y: 613, width: 5, height: 13, rx: 2.5, fill: '#8a5a37' }, kit);
      }
      svg('rect', { x: 0, y: 580, width: 1024, height: 20, rx: 7, fill: 'url(#gWood)', stroke: '#8a5a37', 'stroke-width': 2 }, kit);
      svg('rect', { x: 0, y: 574, width: 1024, height: 9, rx: 4, fill: '#f7e6cd', stroke: '#d9b287', 'stroke-width': 1.6 }, kit);
      svg('ellipse', { cx: 512, cy: 556, rx: 460, ry: 34, fill: 'url(#gPool)', opacity: .45 }, kit);

      ctx.room.setLighting('warm', 500);
      girl.setOutfit(D.OUTFITS.home);
      girl.setPose(Object.assign({}, EB.Character.POSES.holdPlate, { mouth: 'neutral', brows: 'flat' }));
      girl.setPos(S.x, GY, SCALE);
      girl.prop('plate', { offset: { x: 0, y: -4 } });

      /* هالة تحت الصحن تتحرك معه */
      const aura = svg('ellipse', { cx: S.x, cy: GY + 78, rx: 78, ry: 15, fill: glow, opacity: .3, 'pointer-events': 'none' }, g);

      /* ---------- خانات المجموعات الأربع ---------- */
      const slotsG = svg('g', { 'pointer-events': 'none' }, g);
      svg('rect', { x: 132, y: 30, width: 760, height: 96, rx: 26, fill: 'rgba(255,255,255,.5)' }, slotsG);
      svg('text', { x: 512, y: 24, 'text-anchor': 'middle', 'font-size': 23, 'font-weight': 800, fill: '#5a4034', text: 'كوّني طبقًا متوازنًا!' }, slotsG);
      const slotEls = groups.map((gr, i) => {
        const x = 196 + i * 210;
        const box = svg('g', {}, slotsG);
        svg('rect', { x: x - 88, y: 58, width: 176, height: 58, rx: 18, fill: 'rgba(110,78,50,.10)' }, box);
        const r = svg('rect', { x: x - 88, y: 58, width: 176, height: 58, rx: 18, fill: 'rgba(255,255,255,.86)', stroke: '#c3b4d4', 'stroke-width': 3 }, box);
        const ic = svg('text', { x: x - 60, y: 96, 'font-size': 26, text: gr.emoji }, box);
        const tx = svg('text', { x: x + 8, y: 94, 'text-anchor': 'middle', 'font-size': 17, 'font-weight': 700, fill: '#8a7365', text: gr.ar }, box);
        const chk = svg('text', { x: x + 68, y: 96, 'font-size': 22, 'text-anchor': 'middle', fill: '#4f6f3f', text: '', opacity: 0 }, box);
        return { box, r, chk, gr, x };
      });

      /* ---------- قائمة السقوط ---------- */
      const list = [];
      cfg.needed.forEach(n => list.push({ t: n.t, x: n.x, item: n.item, need: true }));
      (cfg.extras || []).forEach(n => list.push({ t: n.t, x: n.x, item: n.item, need: false }));
      list.sort((a, b) => a.t - b.t);
      S.queue = list.slice();
      const speed = (600 - 20) / (cfg.fallSeconds || 3);

      function neededGroup(id) {
        const gr = groups.find(x => x.items.indexOf(id) >= 0);
        return gr && !S.filled[gr.id] ? gr : null;
      }
      function spawn(spec) {
        const x = clamp(70 + spec.x * 884, 70, 954);
        const node = svg('g', { 'pointer-events': 'none' }, g);
        svg('circle', { r: 30, fill: '#fffdf7', stroke: '#654e6a', 'stroke-width': 2 }, node);
        const icon = drawFood(node, spec.item);
        svg('rect', { x: -42, y: 31, width: 84, height: 22, rx: 11, fill: '#402c46' }, node);
        svg('text', { x: 0, y: 47, 'text-anchor': 'middle', 'font-size': 14, 'font-weight': 800, fill: '#fff', text: FOOD_NAMES[spec.item] || '' }, node);
        const shadow = svg('ellipse', { cx: x, cy: 600, rx: 10, ry: 3, fill: 'rgba(110,78,50,.18)', 'pointer-events': 'none' }, g);
        const it = {
          x, y: 10, item: spec.item, node, icon, shadow, dead: false, bounced: false, need: spec.need,
          rot: 0, vr: (spec.x < .5 ? -1 : 1) * (26 + Math.random() * 30), sway: Math.random() * 6.28, amp: 12 + Math.random() * 12, pop: 0
        };
        S.items.push(it);
        tween({ from: 0, to: 1, dur: 260, ease: Ease.out, onUpdate: v => { it.pop = v; } });
      }
      function place(it) {
        const swayX = it.bounced ? 0 : Math.sin(it.sway + it.y / 58) * it.amp;
        const sc = lerp(.78, 1, Math.min(1, it.pop));
        const squash = it.bounced ? 1 + Math.sin(it.rot * .04) * .08 : 1;
        it.node.setAttribute('transform', `translate(${it.x + swayX},${it.y}) scale(${sc},${sc * squash})`);
        it.icon.setAttribute('transform', `rotate(${it.bounced ? it.rot : Math.sin(it.y / 50) * 8}) scale(1.12)`);
        const h = clamp((it.y - 20) / 560, 0, 1);
        it.shadow.setAttribute('cx', it.x + swayX);
        it.shadow.setAttribute('rx', lerp(6, 22, h));
        it.shadow.setAttribute('ry', lerp(2, 6, h));
        it.shadow.setAttribute('opacity', lerp(.05, .22, h));
        it.drawX = it.x + swayX;
      }
      function collect(it, gr) {
        S.filled[gr.id] = it.item;
        S.collected++;
        S.points = 100 * S.collected / (speeds.length * groups.length);
        ctx.live(S.points);
        const slot = slotEls.find(s => s.gr.id === gr.id);
        slot.r.setAttribute('fill', '#e8efdd'); slot.r.setAttribute('stroke', '#4f6f3f'); slot.r.setAttribute('stroke-width', 4);
        slot.chk.textContent = '✓'; slot.chk.setAttribute('opacity', 1);
        tween({ from: 0, to: 1, dur: 360, ease: Ease.out, onUpdate: v => slot.box.setAttribute('transform', `translate(0,${lerp(0, -4, Math.sin(v * Math.PI))})`) });
        it.dead = true;
        tween({
          from: 0, to: 1, dur: 420, ease: Ease.out, onUpdate: v => {
            const px = lerp(it.drawX == null ? it.x : it.drawX, S.x, v), py = lerp(it.y, GY - 30, v);
            it.node.setAttribute('transform', `translate(${px},${py}) scale(${lerp(1, .45, v)})`);
            it.node.setAttribute('opacity', 1 - v * .2);
          }, onComplete: () => { it.node.remove(); it.shadow.remove(); }
        });
        /* الصحن يهتزّ عند الاستقبال + البطلة تبتسم */
        tween({ from: 0, to: 1, dur: 380, ease: Ease.out, onUpdate: v => { S.plateKick = Math.sin(v * Math.PI * 2.4) * (1 - v) * 9; } });
        girl.expression('happy', 200);
        later(700, () => { if (!S.done) girl.expression('focus', 300); });
        burst(fx, S.x, GY - 40, { count: 9, color: '#9cb381', spread: 90, dur: 620 });
        EB.audio.catchFood();
        ctx.ui.meter(`${gr.ar} ✓`, S.points);
        /* العنصر المستقر في الصحن */
        const on = drawFood(g, it.item);
        S.caught.push(on);
        tween({
          from: 0, to: 1, dur: 700, ease: Ease.out, onUpdate: v => {
            on.setAttribute('transform', `translate(${lerp(it.x, S.x - 34 + S.caught.length * 22, v)},${lerp(it.y, GY - 26, v)}) scale(${lerp(1, .5, v)})`);
            on.setAttribute('opacity', v > .85 ? (1 - v) * 6 : 1);
          }, onComplete: () => on.remove()
        });
        if (groups.every(x => S.filled[x.id])) win();
      }
      function nextRound() {
        S.round++;
        S.t = 0;
        S.mercy = 0;
        S.items.forEach(it => { it.node.remove(); it.shadow.remove(); });
        S.items = [];
        S.caught.forEach(node => node.remove());
        S.caught = [];
        S.queue = list.map(spec => ({ ...spec, t: spec.t / speeds[S.round] }));
        slotEls.forEach(slot => {
          S.filled[slot.gr.id] = false;
          slot.chk.setAttribute('opacity', 0);
          slot.r.setAttribute('fill', 'rgba(255,255,255,.86)');
          slot.r.setAttribute('stroke', '#c3b4d4');
        });
        S.intermission = false;
        ctx.ui.meter(`الجولة ${S.round + 1} من ${speeds.length}`, S.points);
        ctx.ui.banner(`الجولة ${S.round + 1} — سقوط أسرع`, '', 1000);
      }
      function bounce(it) {
        ctx.mistake();
        it.bounced = true;
        it.vx = (it.drawX < S.x ? -1 : 1) * (80 + Math.random() * 40);
        it.vr = (it.drawX < S.x ? -1 : 1) * 200;
        it.amp = 0;
        EB.audio.pop();
      }
      function later(ms, fn) { S.timers.push(setTimeout(fn, ms)); }
      S.timers = [];
      function win() {
        if (S.done || S.intermission) return;
        if (S.round < speeds.length - 1) {
          S.intermission = true;
          ctx.ui.banner(`اكتمل الطبق ${S.round + 1} من ${speeds.length} ✓`, 'ok', 800);
          EB.audio.great();
          later(800, nextRound);
          return;
        }
        S.done = true;
        S.dir = 0;
        ctx.ui.clearControls();
        girl.expression('happy', 300);
        tween({
          from: 0, to: 1, dur: 900, ease: Ease.inOut, onUpdate: v => {
            girl.setPos(lerp(S.x, 700, v), lerp(GY, 500, v), SCALE);
            aura.setAttribute('cx', lerp(S.x, 700, v));
          }, onComplete: () => {
            girl.dropProp();
            const plate = svg('g', { 'pointer-events': 'none' }, g);
            svg('ellipse', { cx: 700, cy: 598, rx: 66, ry: 15, fill: 'rgba(110,78,50,.2)' }, plate);
            svg('ellipse', { cx: 700, cy: 586, rx: 62, ry: 16, fill: '#fffdf9', stroke: main, 'stroke-width': 3 }, plate);
            svg('ellipse', { cx: 700, cy: 584, rx: 46, ry: 11, fill: 'none', stroke: glow, 'stroke-width': 2, opacity: .7 }, plate);
            groups.map(group => S.filled[group.id]).forEach((id, i) => {
              const f = drawFood(plate, id);
              f.setAttribute('transform', `translate(${652 + i * 32},574) scale(.72)`);
            });
            girl.anim('celebrate', 1300);
            burst(fx, 700, 560, { count: 14, color: glow, spread: 170, dur: 900 });
            ctx.ui.banner(D.TEXT.plateDone, 'ok', 1500);
            EB.audio.great();
            setTimeout(() => ctx.done(100), 1400);
          }
        });
      }

      /* ---------- أزرار الحركة ---------- */
      const bR = ctx.ui.addBtn('➡', 'arrow primary', null, '→');
      const bL = ctx.ui.addBtn('⬅', 'arrow violet', null, '←');
      U.hold(bR, () => { S.dir = 1; }, () => { if (S.dir === 1) S.dir = 0; });
      U.hold(bL, () => { S.dir = -1; }, () => { if (S.dir === -1) S.dir = 0; });
      /* اللابتوب: الأسهم (أو A/D) تحرّك الصحن مع الاستمرار حتى ترك المفتاح */
      const stopL = () => { if (S.dir === -1) S.dir = 0; }, stopR = () => { if (S.dir === 1) S.dir = 0; };
      EB.keys.set({
        ArrowLeft: () => { S.dir = -1; }, KeyA: () => { S.dir = -1; },
        ArrowRight: () => { S.dir = 1; }, KeyD: () => { S.dir = 1; },
        $up: { ArrowLeft: stopL, KeyA: stopL, ArrowRight: stopR, KeyD: stopR }
      }, '← → للتحريك · أو A / D');

      /* ---------- حلقة اللعب ---------- */
      S.plateKick = 0;
      const f = U.onFrame(dt => {
        if (ctx.isPaused()) return;
        if (S.done || S.intermission) return;
        S.t += dt;
        /* ظهور العناصر حسب الجدول */
        while (S.queue.length && S.queue[0].t <= S.t) spawn(S.queue.shift());
        /* رحمة: عنصر من مجموعة ناقصة إن طال الانتظار */
        const missing = groups.filter(x => !S.filled[x.id]);
        if (missing.length && S.t - S.mercy > 5.5 && !S.queue.some(q => q.need && missing.some(m => m.items.indexOf(q.item) >= 0))) {
          S.mercy = S.t;
          const gr = missing[0];
          spawn({ x: .15 + Math.random() * .7, item: gr.items[Math.floor(Math.random() * gr.items.length)], need: true });
        }
        /* حركة البطلة والصحن */
        const v = 430;
        if (S.dir) {
          S.x = clamp(S.x + S.dir * v * dt, 90, 934);
          girl.setPos(S.x, GY, SCALE);
          S.plateTilt = lerp(S.plateTilt, S.dir * 7, Math.min(1, dt * 9));
          girl.pose({ lean: S.dir * 5, raiseL: 58 + S.dir * 7 + Math.sin(S.t * 9) * 3, raiseR: 58 - S.dir * 7 + Math.sin(S.t * 9 + 1) * 3 }, 120);
        } else {
          S.plateTilt = lerp(S.plateTilt, 0, Math.min(1, dt * 8));
        }
        aura.setAttribute('cx', S.x);
        aura.setAttribute('rx', 78 + S.plateKick * 2);
        aura.setAttribute('opacity', .26 + Math.abs(S.plateKick) * .02);
        /* سقوط وفحص الالتقاط */
        const plateY = GY - 34;
        for (const it of S.items) {
          if (S.done || S.intermission) break;
          if (it.dead) continue;
          it.y += speed * speeds[S.round] * dt * (it.bounced ? .6 : 1);
          if (it.vx) it.x += it.vx * dt;
          it.rot += it.vr * dt;
          place(it);
          if (!it.bounced && it.y > plateY - 16 && it.y < plateY + 26 && Math.abs((it.drawX == null ? it.x : it.drawX) - S.x) < PLATE_HALF) {
            const gr = neededGroup(it.item);
            if (gr) collect(it, gr);
            else bounce(it);
          }
          if (it.y > 660) { it.dead = true; it.node.remove(); it.shadow.remove(); }
        }
        S.items = S.items.filter(i => !i.dead);
        ctx.ui.info(ctx.team, ctx.index, `${ctx.level.emoji} ${ctx.level.skill} · الجولة ${S.round + 1}/${speeds.length}`);
      });

      ctx.ui.banner('استخدمي سهمي اليمين واليسار لتحريك الصحن', '', 2000);
      ctx.ui.meter('الجولة 1 من 3 — الصحن فارغ', 0);

      L.stop = function () {
        S.done = true;
        U.offFrame(f);
        (S.timers || []).forEach(t => clearTimeout(t));
        S.items.forEach(i => { i.node && i.node.remove(); i.shadow && i.shadow.remove(); });
        S.caught.forEach(n => n.remove());
        girl.dropProp();
      };
    },
    stop() { if (L.stop) L.stop(); }
  };

  EB.levels = EB.levels || {};
  EB.levels.catch = L;
})(window.EB);

</script>
<script>
/* ============ التحدي 5 — MAGIC CLOCK: الساعة السحرية وتنظيم المساء ============ */
(function (EB) {
  const U = EB.util, { svg, tween, Ease, clamp, lerp, burst } = U;
  const D = EB.data;

  const CX = 556, CY = 262, R = 168, BAND = 32;
  const A0 = 135, SWEEP = 270, END = D.CLOCK_END_MIN, STEP = D.CLOCK_STEP_MIN;
  const DEG = Math.PI / 180;

  function ang(min) { return (A0 + (min / END) * SWEEP) * DEG; }
  function pt(min, r) { const a = ang(min); return { x: CX + Math.cos(a) * r, y: CY + Math.sin(a) * r }; }
  function arcPath(m0, m1, r) {
    const a = pt(m0, r), b = pt(m1, r);
    const large = Math.abs(m1 - m0) / END * SWEEP > 180 ? 1 : 0;
    return `M${a.x},${a.y} A${r},${r} 0 ${large} 1 ${b.x},${b.y}`;
  }
  const snap = m => clamp(Math.round(m / STEP) * STEP, 0, END);
  const span = b => b ? (b.to - b.from) : 0;
  const hhmm = U.clock12;

  /* زمن أقرب نقطة على القرص من إحداثية اللمس */
  function minAt(p) {
    const t = ((Math.atan2(p.y - CY, p.x - CX) / DEG - A0) % 360 + 360) % 360;
    if (t <= SWEEP) return snap(t / SWEEP * END);
    return t < SWEEP + (360 - SWEEP) / 2 ? END : 0;
  }

  /* ---------- التقييم النهائي حسب معايير CLOCK_RUBRIC (لا يوجد ترتيب واحد صحيح) ---------- */
  function gradeFrac(d, lo, hi, fall) {
    if (d >= lo && d <= hi) return 1;
    const dist = d < lo ? lo - d : d - hi;
    return clamp(1 - dist / (fall || 60), 0, 1);
  }
  function evaluate(bl) {
    const out = [];
    const push = (id, frac, detail) => {
      const rub = D.CLOCK_RUBRIC.find(r => r.id === id);
      out.push({ id, ar: rub.ar, note: rub.note, w: rub.w, frac: clamp(frac, 0, 1), earned: Math.round(rub.w * clamp(frac, 0, 1)), detail });
    };
    const b = k => bl[k];
    push('study', b('study') ? gradeFrac(span(b('study')), 90, 150, 60) : 0,
      b('study') ? `${span(b('study'))} دقيقة للدراسة` : 'لم تحدّدي وقتًا للدراسة');
    push('homework', b('homework') ? gradeFrac(span(b('homework')), 45, 90, 45) : 0,
      b('homework') ? `${span(b('homework'))} دقيقة للواجب` : 'لم تحدّدي وقتًا للواجب');

    const br = b('break'); let bf = 0, bd = 'لا توجد استراحة';
    if (br) {
      const len = span(br);
      const others = Object.keys(bl).filter(k => k !== 'break').map(k => bl[k]);
      const before = others.some(o => o.to <= br.from + STEP);
      const after = others.some(o => o.from >= br.to - STEP);
      bf = (len >= 20 ? 1 : len / 20) * (before && after ? 1 : (before || after ? .7 : .5));
      bd = `${len} دقيقة${before && after ? ' وبين مهمتين' : (before || after ? ' وبجانبها مهمة واحدة' : ' ومنفردة عن المهام')}`;
    }
    push('break', bf, bd);

    const wd = b('winddown'); let wf = 0, wdd = 'لا يوجد تحضير للنوم';
    if (wd) {
      const len = span(wd), atEnd = wd.to >= END - STEP;
      wf = (atEnd ? 1 : .35) * gradeFrac(len, 20, 60, 40);
      wdd = `${len} دقيقة${atEnd ? ' وتُختم بها الساعة 10' : ' ولا تختم بها المساء'}`;
    }
    push('winddown', wf, wdd);

    const all = Object.keys(bl).map(k => bl[k]);
    const covered = all.reduce((s, o) => s + span(o), 0);
    const gap = Math.max(0, END - covered);
    const overlap = all.some((o, i) => all.some((p, j) => j > i && o.from < p.to && o.to > p.from));
    push('org', overlap ? 0 : clamp(1 - Math.max(0, gap - 30) / 120, 0, 1),
      overlap ? 'يوجد تداخل بين الفترات' : `وقت مُنظّم ${covered} دقيقة من 240`);

    const score = out.reduce((s, r) => s + r.earned, 0);
    return { rows: out, score: clamp(score, 0, 100) };
  }

  const L = {
    start(ctx) {
      const order = (ctx.variant && ctx.variant.order) || D.CLOCK_TASKS.map(t => t.id);
      const tasks = order.map(id => D.CLOCK_TASKS.find(t => t.id === id));
      const girl = ctx.girl, g = ctx.layers.game, fx = ctx.layers.fx;
      const main = ctx.meta.colors.main, glow = ctx.meta.colors.glow;
      const S = { sel: tasks[0].id, start: null, blocks: {}, done: false, judged: false, score: 0 };
      L.state = S;

      girl.setOutfit(D.OUTFITS.study);
      girl.setPose(Object.assign({}, EB.Character.POSES.stand, { mouth: 'calm', brows: 'soft' }));
      girl.setPos(800, 560, .62);
      ctx.room.setLighting('evening', 500);

      /* ---------- قرص سحري كبير في الوسط ---------- */
      const clock = svg('g', {}, g);
      const halo = svg('circle', { cx: CX, cy: CY, r: R + 58, fill: 'rgba(255,255,255,.5)', 'fill-opacity': .7, filter: 'url(#fSoft)' }, clock);
      svg('circle', { cx: CX, cy: CY, r: R + 44, fill: '#fffdf9', 'fill-opacity': .96, stroke: glow, 'stroke-width': 5 }, clock);
      const magicRing = svg('path', { d: arcPath(0, END, R + 30), stroke: glow, 'stroke-width': 3, fill: 'none', 'stroke-dasharray': '2 16', 'stroke-linecap': 'round', opacity: .85 }, clock);
      svg('path', { d: arcPath(0, END, R), stroke: '#e9e2ef', 'stroke-width': BAND + 10, fill: 'none', 'stroke-linecap': 'round' }, clock);
      svg('path', { d: arcPath(0, END, R), stroke: '#c3b4d4', 'stroke-width': BAND + 10, fill: 'none', 'stroke-linecap': 'round', opacity: .3 }, clock);

      /* درجات زمنية كل 30 دقيقة + علامات كل 15 */
      const ticks = svg('g', {}, clock);
      for (let m = 0; m <= END; m += STEP) {
        const big = m % 60 === 0;
        const a = pt(m, R - BAND / 2 - 4), b2 = pt(m, R - BAND / 2 - (big ? 18 : 10));
        svg('line', { x1: a.x, y1: a.y, x2: b2.x, y2: b2.y, stroke: big ? '#8a7365' : '#c3b4d4', 'stroke-width': big ? 3.5 : 2, 'stroke-linecap': 'round' }, ticks);
        if (big) {
          const lp = pt(m, R - BAND / 2 - 36);
          svg('text', { x: lp.x, y: lp.y + 6, 'text-anchor': 'middle', 'font-size': 15, 'font-weight': 800, fill: '#5a4034', text: hhmm(m) }, ticks);
        }
      }
      /* شمس وبدر في طرفي المساء */
      svg('text', { x: pt(0, R + 14).x, y: pt(0, R + 14).y + 8, 'text-anchor': 'middle', 'font-size': 24, text: '🌇' }, clock);
      svg('text', { x: pt(END, R + 14).x, y: pt(END, R + 14).y + 8, 'text-anchor': 'middle', 'font-size': 22, text: '🌙' }, clock);

      const arcsG = svg('g', {}, clock);
      const needle = svg('line', { x1: CX, y1: CY, x2: CX, y2: CY, stroke: '#5a4034', 'stroke-width': 4, 'stroke-linecap': 'round', opacity: 0 }, clock);
      const pin = svg('g', { opacity: 0 }, clock);
      svg('circle', { cx: 0, cy: 0, r: 15, fill: '#e8b45c', stroke: '#5a4034', 'stroke-width': 3 }, pin);
      const pinTxt = svg('text', { x: 0, y: 5, 'text-anchor': 'middle', 'font-size': 12, 'font-weight': 900, fill: '#5a4034', text: '' }, pin);
      svg('circle', { cx: CX, cy: CY, r: 11, fill: '#5a4034' }, clock);
      svg('circle', { cx: CX, cy: CY, r: 5, fill: glow }, clock);

      const cEmoji = svg('text', { x: CX, y: CY - 26, 'text-anchor': 'middle', 'font-size': 40, text: '' }, clock);
      const cName = svg('text', { x: CX, y: CY - 2, 'text-anchor': 'middle', 'font-size': 19, 'font-weight': 800, fill: '#5a4034', text: '' }, clock);
      const cHint = svg('text', { x: CX, y: CY + 34, 'text-anchor': 'middle', 'font-size': 15, 'font-weight': 800, fill: main, text: '' }, clock);

      const title = svg('text', { x: CX, y: 60, 'text-anchor': 'middle', 'font-size': 25, 'font-weight': 900, fill: '#5a4034', text: 'نظّمي مساءك على الساعة السحرية' }, g);

      /* منطقة لمس القرص: حلقة عريضة حول المسار */
      const pad = svg('circle', { cx: CX, cy: CY, r: R + 44, fill: '#fff', 'fill-opacity': .01, class: 'tap' }, g);

      /* ---------- بطاقات المهام الأربع (كلها ظاهرة من البداية، بلا مدد مطلوبة) ---------- */
      const chipG = svg('g', {}, g);
      const chips = {};
      tasks.forEach((t, i) => {
        const y = 92 + i * 104;
        const box = svg('g', { class: 'tap' }, chipG);
        svg('rect', { x: 26, y: y, width: 250, height: 90, rx: 20, fill: 'rgba(255,255,255,.93)', stroke: '#c3b4d4', 'stroke-width': 3 }, box);
        const bar = svg('rect', { x: 26, y: y, width: 10, height: 90, rx: 5, fill: t.color }, box);
        svg('text', { x: 62, y: y + 44, 'font-size': 30, text: t.emoji }, box);
        const nm = svg('text', { x: 230, y: y + 40, direction: 'rtl', 'text-anchor': 'start', 'font-size': 17, 'font-weight': 800, fill: '#5a4034', text: t.ar }, box);
        const tm = svg('text', { x: 230, y: y + 68, direction: 'rtl', 'text-anchor': 'start', 'font-size': 15, 'font-weight': 800, fill: '#8a7365', text: 'غير محددة' }, box);
        const chk = svg('text', { x: 254, y: y + 40, 'text-anchor': 'middle', 'font-size': 22, 'font-weight': 900, fill: '#4f6f3f', text: '', opacity: 0 }, box);
        U.tap(box, () => select(t.id));
        chips[t.id] = { box, tm, chk, bar, t };
      });
      const legend = svg('text', { x: 151, y: 528, 'text-anchor': 'middle', 'font-size': 15, 'font-weight': 800, fill: '#8a7365', text: 'حدّدي بداية المهمة ونهايتها' }, g);

      /* ---------- طباعة الفترات ---------- */
      function redraw() {
        arcsG.innerHTML = '';
        Object.keys(S.blocks).forEach(id => {
          const t = D.CLOCK_TASKS.find(x => x.id === id), bl = S.blocks[id];
          svg('path', { d: arcPath(bl.from, bl.to, R), stroke: t.color, 'stroke-width': BAND, fill: 'none', 'stroke-linecap': 'butt', opacity: .95 }, arcsG);
          const p1 = pt(bl.from, R), p2 = pt(bl.to, R);
          svg('circle', { cx: p1.x, cy: p1.y, r: 5, fill: '#fff', stroke: t.color, 'stroke-width': 3 }, arcsG);
          svg('circle', { cx: p2.x, cy: p2.y, r: 5, fill: '#fff', stroke: t.color, 'stroke-width': 3 }, arcsG);
          const mid = pt((bl.from + bl.to) / 2, R);
          svg('text', { x: mid.x, y: mid.y + 8, 'text-anchor': 'middle', 'font-size': 20, text: t.emoji }, arcsG);
        });
        tasks.forEach(t => {
          const c = chips[t.id], bl = S.blocks[t.id];
          c.tm.textContent = bl ? `${hhmm(bl.from)} → ${hhmm(bl.to)}` : 'غير محددة';
          c.tm.setAttribute('fill', bl ? '#4f6f3f' : '#8a7365');
          c.chk.textContent = bl ? '✓' : ''; c.chk.setAttribute('opacity', bl ? 1 : 0);
          c.box.children[0].setAttribute('stroke', S.sel === t.id ? main : '#c3b4d4');
          c.box.children[0].setAttribute('stroke-width', S.sel === t.id ? 5 : 3);
        });
        const sel = chips[S.sel];
        cEmoji.textContent = sel.t.emoji; cName.textContent = sel.t.ar;
        cHint.textContent = S.start == null ? 'حدّدي البداية من القرص' : 'حدّدي النهاية الآن';
        const doneN = Object.keys(S.blocks).length;
        const ev = evaluate(S.blocks);
        S.score = ev.score;
        ctx.live(Math.round(ev.score));
        ctx.ui.meter(`المهام ${doneN} من ${tasks.length} — التقييم الحالي ${ev.score}٪`, doneN / tasks.length * 100);
      }

      function select(id) {
        if (S.done) return;
        S.sel = id; S.start = null; hidePin();
        EB.audio.tick();
        redraw();
      }
      function hidePin() { pin.setAttribute('opacity', 0); needle.setAttribute('opacity', 0); }

      /* ---------- الاختيار على القرص: ضغطة بداية ثم ضغطة نهاية ---------- */
      function dialTap(evt) {
        if (S.done || ctx.isPaused()) return;
        const p = U.svgPoint(evt);
        const r = Math.hypot(p.x - CX, p.y - CY);
        if (r < R - BAND - 26) return;              // مركز القرص ليس منطقة اختيار
        const m = minAt(p);
        if (S.start == null) {
          S.start = m; showPin(m);
          EB.audio.tick(); redraw();
          ctx.ui.toast(`البداية ${hhmm(m)} — الآن حدّدي النهاية`);
          return;
        }
        if (m === S.start) { S.start = null; hidePin(); EB.audio.tick(); redraw(); return; }
        place(S.start, m);
      }

      /* تثبيت فترة بعد التحقق من التعارض مع المهام الأخرى */
      function place(a, b) {
        if (ctx.isPaused()) return;
        const from = Math.min(a, b), to = Math.max(a, b);
        const other = Object.keys(S.blocks).find(k => k !== S.sel && S.blocks[k].from < to && S.blocks[k].to > from);
        if (other) {
          ctx.mistake();
          ctx.ui.banner(`هذا الوقت محجوز لـ«${D.CLOCK_TASKS.find(t => t.id === other).ar}»`, 'no', 1500);
          EB.audio.wrong();
          S.start = null; hidePin();
          tween({ from: 0, to: 1, dur: 500, onUpdate: v => halo.setAttribute('opacity', .35 + .35 * Math.abs(Math.sin(v * 6))) });
          redraw();
          return;
        }
        S.blocks[S.sel] = { from, to };
        S.start = null; hidePin();
        const t = D.CLOCK_TASKS.find(x => x.id === S.sel);
        burst(fx, CX, CY, { count: 9, color: t.color, spread: 120, dur: 620 });
        EB.audio.clockLock();
        girl.expression('happy', 220); tween({ from: 0, to: 1, dur: 420, onComplete: () => girl.expression('calm', 200) });
        redraw();
        if (Object.keys(S.blocks).length === tasks.length) {
          ctx.ui.banner('اكتملت المهام الأربع — اضغطي «شغّلي جدولي وقيّميه»', 'ok', 2200);
          EB.audio.great();
        }
      }
      function showPin(m) {
        const p = pt(m, R);
        pin.setAttribute('transform', `translate(${p.x},${p.y})`); pin.setAttribute('opacity', 1);
        pinTxt.textContent = m % 60 === 0 ? '▶' : '';
        needle.setAttribute('x2', p.x); needle.setAttribute('y2', p.y); needle.setAttribute('opacity', .5);
      }
      U.tap(pad, dialTap);

      /* ---------- اللابتوب: مؤشر القرص بلوحة المفاتيح ---------- */
      function cursor(step) {
        if (S.done) return;
        const base = S.cursor == null ? (S.start == null ? 0 : S.start) : S.cursor;
        S.cursor = clamp(snap(base + step), 0, END);
        showPin(S.cursor); EB.audio.tick();
        ctx.ui.toast(`المؤشر ${hhmm(S.cursor)} — ${S.start == null ? 'Enter لتثبيت البداية' : 'Enter لتثبيت النهاية'}`);
      }
      function kbEnter() {
        if (S.done) return;
        if (S.cursor == null) { cursor(0); return; }
        if (S.start == null) {
          S.start = S.cursor; showPin(S.cursor); EB.audio.tick(); redraw();
          ctx.ui.toast(`البداية ${hhmm(S.cursor)} — الآن حدّدي النهاية`);
          return;
        }
        if (S.cursor === S.start) { S.start = null; hidePin(); redraw(); return; }
        place(S.start, S.cursor);
      }
      const kbUndo = () => { if (S.done) return; if (S.start != null) { S.start = null; hidePin(); } else if (S.blocks[S.sel]) delete S.blocks[S.sel]; EB.audio.pop(); redraw(); };

      /* ---------- أزرار التحرير والاعتماد ---------- */
      const bClear = ctx.ui.addBtn('تراجع عن الفترة', 'big ghost', kbUndo, '⌫');
      const kbClearAll = () => {
        if (S.done) return;
        S.blocks = {}; S.start = null; S.cursor = null; hidePin();
        EB.audio.pop(); redraw();
        ctx.ui.banner('بدأنا الجدول من جديد', '', 1200);
      };
      ctx.ui.addBtn('مسح الكل', 'big ghost', kbClearAll, 'C');
      const bJudge = ctx.ui.addBtn('شغّلي جدولي وقيّميه ✓', 'big primary', judge, 'J');

      /* اللابتوب: ١..٤ لاختيار المهمة، الأسهم تحريك المؤشر، Enter تثبيت، ⌫ تراجع */
      const kd = {
        ArrowRight: () => cursor(STEP), ArrowUp: () => cursor(STEP), KeyD: () => cursor(STEP),
        ArrowLeft: () => cursor(-STEP), ArrowDown: () => cursor(-STEP), KeyA: () => cursor(-STEP),
        Home: () => { S.cursor = 0; showPin(0); }, End: () => { S.cursor = END; showPin(END); },
        Enter: kbEnter, NumpadEnter: kbEnter, Backspace: kbUndo, KeyC: kbClearAll,
        KeyJ: () => judge()
      };
      tasks.forEach((t, i) => { kd['Digit' + (i + 1)] = () => select(t.id); });
      EB.keys.set(kd, '١..٤ اختيار مهمة · ← → تحريك على القرص · Enter تثبيت · ⌫ تراجع');

      /* ---------- التقييم النهائي ---------- */
      function judge() {
        if (S.done || ctx.isPaused()) return;
        S.done = true;
        S.start = null;
        hidePin();
        ctx.ui.clearControls();
        EB.keys.clear();
        ctx.lockFinalTime();
        const ev = evaluate(S.blocks);
        ctx.live(ev.score);
        const schedule = tasks.filter(task => S.blocks[task.id])
          .map(task => ({ task, ...S.blocks[task.id] }))
          .sort((a, b) => a.from - b.from);
        playSchedule(schedule, () => {
          girl.dropProp();
          girl.setPose(EB.Character.POSES.stand);
          girl.expression(ev.score >= 70 ? 'happy' : 'calm', 200);
          ctx.room.setLighting('night', 500);
          ctx.ui.meter(`التقييم ${ev.score}٪`, ev.score);
          showCard(ev);
          S.resultTimer = setTimeout(() => ctx.done(ev.score, { partial: ev.score < 100 }), 2200);
        });
      }

      function playSchedule(schedule, finish) {
        const acts = {
          study: { prop: 'book', pose: { raiseL: 16, raiseR: 16, bendL: 63, bendR: 63, headRot: 7 } },
          homework: { prop: 'book', pose: { raiseL: 12, raiseR: 32, bendL: 55, bendR: 76, headRot: -6 } },
          rest: { prop: 'cup', pose: { raiseR: 26, bendR: 80, eyes: .7, mouth: 'calm' } },
          sleep: { pose: { raiseL: 48, raiseR: 48, bendL: 65, bendR: 65, headRot: 10, eyes: .25, mouth: 'yawn' } }
        };
        girl.setPos(820, 560, .76);
        function sweep(from, to, dur, onUpdate, onComplete) {
          tween({ from: 0, to: 1, dur, tag: 'lvl',
            onUpdate(v) { showPin(lerp(from, to, v)); if (onUpdate) onUpdate(v); },
            onComplete
          });
        }
        function next(i, from) {
          if (i === schedule.length) {
            if (from < END && schedule.length) sweep(from, END, 220, null, finish);
            else finish();
            return;
          }
          const { task, from: start, to } = schedule[i];
          function play() {
            const act = acts[task.anim];
            girl.dropProp();
            girl.setPose(EB.Character.POSES.stand);
            if (act.prop) girl.prop(act.prop);
            girl.pose(act.pose, 180);
            cEmoji.textContent = task.emoji;
            cName.textContent = task.ar;
            chips[task.id].box.setAttribute('class', 'tap clock-playing');
            EB.audio.tick();
            sweep(start, to, 850, v => {
              cHint.textContent = hhmm(Math.round(lerp(start, to, v)));
              const motion = Math.sin(v * Math.PI * 4);
              if (v > .25) girl.setPose({ headRot: (act.pose.headRot || 0) + motion * 3, bob: motion * 1.6 });
            }, () => {
              chips[task.id].box.setAttribute('class', 'tap');
              next(i + 1, to);
            });
          }
          if (start > from) sweep(from, start, 170, null, play);
          else play();
        }
        next(0, 0);
      }

      function showCard(ev) {
        const card = svg('g', {}, fx);
        const W = 560, H = 330, X = CX - W / 2, Y = CY - H / 2 + 6;
        svg('rect', { x: X + 6, y: Y + 10, width: W, height: H, rx: 26, fill: 'rgba(60,42,28,.28)' }, card);
        svg('rect', { x: X, y: Y, width: W, height: H, rx: 26, fill: '#fffdf9', stroke: main, 'stroke-width': 5 }, card);
        svg('text', { x: CX, y: Y + 40, 'text-anchor': 'middle', 'font-size': 22, 'font-weight': 900, fill: '#5a4034', text: 'تقييم جدولك' }, card);
        const big = svg('text', { x: CX, y: Y + 82, 'text-anchor': 'middle', 'font-size': 40, 'font-weight': 900, fill: main, text: '0٪' }, card);
        ev.rows.forEach((r, i) => {
          const y = Y + 122 + i * 42;
          const mark = r.frac >= .85 ? '✓' : r.frac >= .45 ? '≈' : '✗';
          const col = r.frac >= .85 ? '#4f6f3f' : r.frac >= .45 ? '#d99a3c' : '#c25c54';
          svg('circle', { cx: X + 34, cy: y - 6, r: 14, fill: col, opacity: .18 }, card);
          svg('text', { x: X + 34, y: y, 'text-anchor': 'middle', 'font-size': 20, 'font-weight': 900, fill: col, text: mark }, card);
          svg('text', { x: X + W - 106, y: y, direction: 'rtl', 'text-anchor': 'start', 'font-size': 16, 'font-weight': 800, fill: '#5a4034', text: r.ar }, card);
          svg('text', { x: X + W - 106, y: y + 17, direction: 'rtl', 'text-anchor': 'start', 'font-size': 13, 'font-weight': 700, fill: '#8a7365', text: r.detail }, card);
          svg('text', { x: X + W - 26, y: y + 4, direction: 'ltr', 'text-anchor': 'end', 'font-size': 16, 'font-weight': 900, fill: col, text: `${r.earned}/${r.w}` }, card);
        });
        tween({
          from: 0, to: 1, dur: 900, ease: Ease.out,
          onUpdate: v => { big.textContent = `${Math.round(ev.score * v)}٪`; card.setAttribute('opacity', .2 + .8 * v); }
        });
        S.card = card;
      }

      /* ---------- نبض سحري خفيف ---------- */
      let ph = 0;
      const pulse = U.onFrame(dt => {
        if (S.done) return;
        ph += dt;
        magicRing.setAttribute('transform', `rotate(${(ph * 8) % 360},${CX},${CY})`);
        halo.setAttribute('r', R + 56 + Math.sin(ph * 1.6) * 3);
      });

      redraw();
      ctx.ui.banner('لكل مهمة لون: حدّدي البداية ثم النهاية على القرص، وتقدرين تعدّلين قبل الاعتماد', '', 3000);

      L.stop = function () {
        clearTimeout(S.resultTimer);
        S.done = true;
        U.offFrame(pulse);
        pad.removeEventListener('pointerdown', dialTap);
        if (bJudge) bJudge.remove();
        if (bClear) bClear.remove();
      };
    },
    stop() { if (L.stop) L.stop(); }
  };

  L.evaluate = evaluate;
  EB.levels = EB.levels || {};
  EB.levels.clock = L;
})(window.EB);

</script>
<script>
/* ============ game.js — المنسّق العام: الشاشات، التدفق، المؤقت، النقاط ============ */
(function (EB) {
  const U = EB.util, D = EB.data, T = D.TEXT;

  /* ---------- مراجع DOM ---------- */
  const dom = {
    stage: U.$('#stage'), defs: U.$('#stage-defs'),
    roomLayer: U.$('#layer-room'), bgfx: U.$('#layer-bgfx'), charLayer: U.$('#layer-char'),
    gameLayer: U.$('#layer-game'), fxLayer: U.$('#layer-fx'), lightLayer: U.$('#layer-light'),
    hud: U.$('#hud'), hudTeam: U.$('#hud-team'), hudPlayer: U.$('#hud-player'), hudLevel: U.$('#hud-level'),
    hudScore: U.$('#hud-score'), hudTimer: U.$('#hud-timer'), meter: U.$('#hud-meter'),
    meterFill: U.$('#hud-meter-fill'), meterLabel: U.$('#hud-meter-label'),
    controls: U.$('#controls'), banner: U.$('#banner'), toast: U.$('#toast'),
    overlay: U.$('#overlay'), overlayInner: U.$('#overlay-inner'),
    teacherBtn: U.$('#teacher-btn'), teacherPanel: U.$('#teacher-panel'),
    confirm: U.$('#confirm-box'), confirmText: U.$('#confirm-text'),
    confirmYes: U.$('#confirm-yes'), confirmNo: U.$('#confirm-no'),
    status: U.$('#teacher-status'),
    kbdLegend: U.$('#kbd-legend')
  };
  EB.dom = dom;

  /* ---------- بناء المسرح ---------- */
  const room = EB.Room.create({ layer: dom.roomLayer, defs: dom.defs, lightLayer: dom.lightLayer });
  const girl = EB.Character.create(dom.charLayer, Object.assign({}, D.OUTFITS.home), { x: 500, y: 300, scale: .95, flower: true, braid: true, teamClothes: true });
  const trainer = EB.Character.create(dom.charLayer, {
    top: '#7d9468', bottom: '#8a5a37', accent: '#f7ecd8', hair: '#4a2f22', skin: '#e8bfa0',
    main: '#a3563a', collar: '#f2e7d2', deep: 'rgba(60,40,25,.12)', sock: '#fdf6e9', shoe: '#5a3f2c',
    eye: '#4a2f22', brow: '#4a2f22', band: '#c87a52'
  }, { x: 170, y: 300, scale: .8, ponytail: true, headband: true, teamClothes: true });
  trainer.group.setAttribute('opacity', 0);
  EB.stage = { room, girl, trainer, layers: { game: dom.gameLayer, fx: dom.fxLayer, bgfx: dom.bgfx } };
  girl.setPose(EB.Character.POSES.stand);
  girl.expression('tense', 0);

  /* ---------- واجهة اللعب ---------- */
  const ui = {
    hud(on) { on ? U.show(dom.hud) : U.hide(dom.hud); },
    controls(on) { on ? U.show(dom.controls) : U.hide(dom.controls); },
    clearControls() { dom.controls.innerHTML = ''; },
    addBtn(label, cls, onPress, keyHint) {
      const b = U.h('button', { class: 'btn ' + (cls || 'big primary'), text: label });
      if (keyHint && U.IS_FINE) b.appendChild(U.h('span', { class: 'kbd', text: keyHint }));
      U.tap(b, () => { if (EB.game.paused) return; if (onPress) onPress(b); });
      dom.controls.appendChild(b);
      return b;
    },
    meter(label, pct) {
      dom.meterFill.style.width = U.clamp(pct, 0, 100) + '%';
      dom.meterLabel.textContent = label || '';
      dom.meter.style.visibility = label == null ? 'hidden' : 'visible';
    },
    info(teamId, playerIdx, levelName) {
      const meta = D.TEAMS[teamId];
      dom.hudTeam.className = 'team-badge ' + meta.css;
      dom.hudTeam.textContent = `${meta.en} · ${meta.name}`;
      dom.hudPlayer.textContent = `اللاعبة ${playerIdx + 1} من ${D.TEAM_SIZE}`;
      dom.hudLevel.textContent = levelName;
    },
    score(pts) { dom.hudScore.textContent = `${EB.state.teamData.score} / ${D.TEAM_MAX}`; },
    timer() {
      const e = EB.timer.elapsed(), left = EB.timer.remaining();
      dom.hudTimer.textContent = U.mmss(e) + ' / ' + U.mmss(EB.timer.limit);
      dom.hudTimer.classList.toggle('low', left <= 30);
    },
    banner(text, kind, ms) {
      dom.banner.textContent = text;
      dom.banner.className = (kind ? kind : '') || '';
      U.show(dom.banner);
      clearTimeout(ui._bt);
      ui._bt = setTimeout(() => U.hide(dom.banner), ms || 1200);
    },
    toast(text, ms) {
      dom.toast.textContent = text; U.show(dom.toast);
      clearTimeout(ui._tt); ui._tt = setTimeout(() => U.hide(dom.toast), ms || 1800);
    },
    overlay(node) {
      dom.overlayInner.innerHTML = '';
      if (node) { dom.overlayInner.appendChild(node); U.show(dom.overlay); }
      else U.hide(dom.overlay);
    }
  };
  EB.ui = ui;

  /* ==========================================================
     دعم اللابتوب: لوحة المفاتيح
     - كل مرحلة تسجّل مفاتيحها بـ EB.keys.set({...}) وتنظّفها في stop
     - المفاتيح تُقرأ من event.code فلا تتأثر بتعريب لوحة المفاتيح
     - الأزرار الحقيقية (button) تعمل بـ Enter/Space تلقائيًا على الفأرة
     ========================================================== */
  const KB = { down: {}, up: {} };
  EB.keys = {
    set(map, hint) {
      map = map || {};
      KB.up = map.$up || {};
      KB.down = Object.assign({}, map);
      delete KB.down.$up;
      if (dom.kbdLegend) {
        dom.kbdLegend.textContent = hint ? '⌨ ' + hint : '';
        dom.kbdLegend.classList.toggle('hidden', !hint || !U.IS_FINE);
      }
    },
    clear() {
      KB.down = {}; KB.up = {};
      if (dom.kbdLegend) dom.kbdLegend.classList.add('hidden');
    }
  };
  function kbLookup(table, code) {
    if (table[code]) return table[code];
    const m = /^Numpad(\d)$/.exec(code);
    if (m && table['Digit' + m[1]]) return table['Digit' + m[1]];
    return null;
  }
  function overlayButton() {
    if (!dom.overlay || dom.overlay.classList.contains('hidden')) return null;
    return dom.overlay.querySelector('.btn.huge') || dom.overlay.querySelector('.btn.primary') || dom.overlay.querySelector('.btn');
  }
  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const c = e.code;
    if (c === 'Escape') {
      e.preventDefault();
      if (!dom.teacherPanel.classList.contains('hidden')) EB.teacher.close();
      else if (EB.state.phase === 'level') EB.teacher.open();
      return;
    }
    if (EB.game.paused) return;
    if ((c === 'Enter' || c === 'Space' || c === 'NumpadEnter') && overlayButton()) {
      e.preventDefault(); overlayButton().click(); return;
    }
    if (e.repeat) return;
    const f = kbLookup(KB.down, c);
    if (f) { e.preventDefault(); f(e); }
  });
  document.addEventListener('keyup', e => {
    const f = kbLookup(KB.up, e.code);
    if (f) { e.preventDefault(); f(e); }
  });

  /* ---------- تنظيف المشهد بين المراحل ---------- */
  function resetScene() {
    U.killTag('pose'); U.killTag('breathe'); U.killTag('lvl');
    dom.gameLayer.innerHTML = ''; dom.fxLayer.innerHTML = ''; dom.bgfx.innerHTML = '';
    room.cat.setAttribute('opacity', 0);
    room.kid.setAttribute('opacity', 0);
    room.phoneWaves.setAttribute('opacity', 0);
    room.rain.setAttribute('opacity', 0);
    room.curtainWind = 0;
    room.window.setAttribute('transform', '');
    room.door.setAttribute('transform', '');
    room.doorWrap.setAttribute('opacity', 1);
    room.phone.setAttribute('opacity', 1);
    room.tvScreen.setAttribute('opacity', .8);
    room.resetTopView();
    if (room.topView) room.showTopView(false, 260);
    room.setLighting('day', 300);
    girl.dropProp();
    girl.stopMotion();
    girl.group.setAttribute('opacity', 1);
    girl.setPose(EB.Character.POSES.stand);
    girl.setOutfit(D.OUTFITS.home);
    girl.expression('calm', 0);
    girl.setPos(500, 486, .95);
    trainer.stopMotion();
    trainer.group.setAttribute('opacity', 0);
    trainer.setPos(170, 300, .8);
  }
  EB.resetScene = resetScene;

  /* ---------- المنسّق ---------- */
  const game = {
    current: null,      // كائن المرحلة النشطة
    live: 0,            // النقاط الحية للمرحلة الحالية (للاحتساب الجزئي)
    paused: false,
    lastFinished: null,

    boot() {
      if (game._booted) return;
      game._booted = true;
      EB.state.load();
      if (U.IS_FINE) document.body.classList.add('desktop');
      U.tap(dom.teacherBtn, () => EB.teacher.open());
      EB.timer.onTick = () => ui.timer();
      EB.timer.onExpire = () => game.onTimeUp();
      ui.timer();
      game.gotoIntro();
      U.tap(dom.confirmYes, () => { const f = EB.teacher._yes; U.hide(dom.confirm); EB.teacher._yes = null; if (f) f(); });
      U.tap(dom.confirmNo, () => { U.hide(dom.confirm); EB.teacher._yes = null; });
      // منع تكبير Safari بالنقر المزدوج وسحب الصفحة
      document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
      document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
    },

    gotoIntro() {
      game.stopLevel();
      game.finalTimeLocked = false;
      delete document.body.dataset.team;
      EB.timer.pause(); EB.state.phase = 'intro'; EB.state.started = false;
      resetScene(); ui.hud(false); ui.controls(false); ui.clearControls();
      girl.setPos(520, 486, .95); girl.expression('happy', 400);
      ui.overlay(EB.screens.intro());
    },

    /* بدء سباق فريق: هنا يبدأ المؤقت فقط */
    beginRace(teamId, asFirst) {
      const st = EB.state;
      if (asFirst !== false) {
        st.resetAll();
        st.setOrder(teamId);
      }
      game.finalTimeLocked = false;
      st.started = false;
      st.teamIndex = Math.max(0, st.order.indexOf(teamId));
      st.levelIndex = 0;
      document.body.dataset.team = teamId;
      st.teams[teamId] = { id: teamId, score: 0, elapsed: null, finished: false, levels: D.LEVELS.map(l => ({ id: l.id, points: null, done: false, skipped: false, partial: false })) };
      st.save();
      st.phase = 'levelIntro';
      resetScene();
      ui.hud(false); ui.controls(false);
      ui.overlay(EB.screens.levelIntro());
    },

    /* من بطاقة المرحلة → تشغيلها فعليًا وبدء المؤقت إن كان أول مرحلة */
    launchLevel() {
      const st = EB.state;
      game.paused = false;
      if (!st.started) { st.startTeamRace(); }
      ui.overlay(null);
      ui.hud(true); ui.controls(true);
      game.runLevel(st.levelIndex);
    },

    runLevel(index) {
      const st = EB.state;
      st.levelIndex = index; st.phase = 'level';
      document.body.dataset.team = st.team;
      game.live = 0;
      if (game.finalTimeLocked && !game.paused) EB.timer.resume();
      game.finalTimeLocked = false;
      ui.overlay(null);
      ui.hud(true); ui.controls(true);
      game.stopLevel();
      resetScene();
      const lvl = D.LEVELS[index], team = st.team, variant = D.VARIANTS[team];
      ui.info(team, index, `${lvl.emoji} ${lvl.skill}`);
      ui.score(); ui.meter(lvl.skill, 0); ui.clearControls(); ui.timer();
      const ctx = {
        team, meta: D.TEAMS[team], variant: variant[lvl.id], cfg: variant, level: lvl, index,
        girl, trainer, room, ui,
        layers: { game: dom.gameLayer, fx: dom.fxLayer, bgfx: dom.bgfx },
        live(points) { game.live = U.clamp(points, 0, D.LEVEL_POINTS); ui.meter(`${lvl.skill} — ${Math.round(game.live)} نقطة`, game.live); },
        errors: 0,
        isPaused() { return game.paused; },
        mistake() {
          if (game._ctx !== ctx || game.paused) return;
          ctx.errors++;
          const notice = U.$('#penalty');
          notice.textContent = `خطأ! خُصمت ${D.ERROR_COST} نقاط · إجمالي الخصم ${ctx.errors * D.ERROR_COST}`;
          notice.classList.remove('penalty-flash');
          void notice.offsetWidth;
          notice.classList.add('penalty-flash');
          U.show(notice);
        },
        lockFinalTime() {
          if (game._ctx === ctx && index === D.LEVELS.length - 1 && EB.timer.remaining() > 0) {
            game.finalTimeLocked = true;
            EB.timer.pause();
          }
        },
        done(points, opts) {
          if (game._ctx === ctx) game.levelFinished(points, opts);
        },
        stop() { game.stopLevel(); }
      };
      game._ctx = ctx;
      const mod = EB.levels[lvl.id];
      game.current = mod;
      mod.start(ctx);
    },

    stopLevel() {
      EB.keys.clear();
      game._ctx = null;
      U.hide(U.$('#penalty'));
      if (game.current && game.current.stop) { try { game.current.stop(); } catch (e) { console.warn(e); } }
      game.current = null;
      U.killTag('lvl');
    },

    levelFinished(points, opts) {
      opts = opts || {};
      const st = EB.state;
      if (st.phase !== 'level') return;
      if (EB.timer.remaining() <= 0) { game.onTimeUp(); return; }
      const p = st.record(points == null ? game.live : points, {
        skipped: opts.skipped, partial: !!opts.partial, errors: game._ctx?.errors
      });
      game.live = 0;
      st.phase = 'handoff';
      ui.score(p);
      game.stopLevel();
      const last = st.levelIndex === D.LEVELS.length - 1;
      if (last) EB.timer.pause();
      if (opts.skipped) ui.banner('تم تخطي المرحلة — بدون نقاط', 'no', 1000);
      setTimeout(() => {
        if (st.phase !== 'handoff') return;
        if (last) { game.finishTeam(); }
        else { ui.overlay(EB.screens.handoff({ points: p, partial: !!opts.partial })); }
      }, opts.skipped ? 900 : 260);
    },

    /* زر «ابدئي المهمة التالية» بعد التسليم */
    advance() {
      const st = EB.state;
      if (st.levelIndex >= D.LEVELS.length - 1) { game.finishTeam(); return; }
      st.levelIndex++;
      st.phase = 'levelIntro';
      ui.overlay(EB.screens.levelIntro());
    },

    finishTeam() {
      const st = EB.state;
      if (st.teamData.finished) { game.afterTeam(); return; }
      const t = st.completeTeam({ elapsed: EB.timer.finish() });
      ui.score();
      st.lastFinishedTeam = st.team;
      game.lastFinished = st.team;
      st.started = false;
      st.phase = 'teamEnd';
      resetScene();
      girl.setPos(500, 486, .95);
      girl.setOutfit(D.OUTFITS.sleep);
      girl.setPose(EB.Character.POSES.stand);
      girl.expression('happy', 600);
      room.setLighting('warm', 800);
      setTimeout(() => girl.anim('celebrate', 1600), 400);
      U.burst(dom.fxLayer, 500, 300, { count: 14, color: D.TEAMS[t.id].colors.glow, spread: 160 });
      game.afterTeam();
    },

    afterTeam() {
      const st = EB.state;
      if (st.bothDone()) {
        st.phase = 'results';
        const w = st.decideWinner(); st.winner = w.winner; st.save();
        ui.overlay(EB.screens.results());
      } else {
        st.phase = 'teamEnd';
        ui.overlay(EB.screens.teamEnd());
      }
    },

    /* انتهى الحد الزمني للفريق (04:30) */
    onTimeUp() {
      const st = EB.state;
      ui.banner('انتهى وقت الفريق! ⏳', 'no', 1600);
      EB.audio.wrong();
      if (!['level', 'handoff', 'levelIntro'].includes(st.phase)) return;
      EB.timer.pause();
      if (st.phase === 'level') {
        st.record(game.live, { partial: true, timedOut: true, errors: game._ctx?.errors });
        game.stopLevel();
        game.live = 0;
      }
      if (!st.teamData.finished) st.completeTeam({ elapsed: D.TEAM_LIMIT_SEC });
      ui.score();
      st.started = false;
      st.phase = 'teamEnd';
      resetScene();
      game.afterTeam();
    },

    replay() {
      const first = EB.state.order[0];
      game.beginRace(first);
      setTimeout(() => EB.game.launchLevel(), 50);
    },

    /* لوحة المعلمة */
    skipLevel() {
      if (EB.state.phase !== 'level') { ui.toast('لا توجد مرحلة جارية للتخطي'); return; }
      game.levelFinished(0, { skipped: true });
    },
    restartLevel() {
      if (EB.state.phase !== 'level') { ui.toast('أعيدي تشغيل المرحلة أثناء اللعب فقط'); return; }
      game.stopLevel(); game.runLevel(EB.state.levelIndex);
    }
  };
  EB.game = game;

  /* ---------- لوحة تحكم المعلمة ---------- */
  EB.teacher = {
    open() { U.show(dom.teacherPanel); EB.audio.pop(); this.status(); },
    close() { U.hide(dom.teacherPanel); U.hide(dom.confirm); },
    status() {
      const st = EB.state;
      const t = st.teams[st.team];
      dom.status.textContent =
        `team ${st.team} · level ${st.levelIndex + 1}/5 · score ${t.score}/${D.TEAM_MAX} · timer ${U.mmss(EB.timer.elapsed())} (${EB.timer.running ? 'running' : 'paused'}) · muted=${EB.audio.muted}`;
    },
    ask(text, onYes) {
      dom.confirmText.textContent = text;
      EB.teacher._yes = onYes;
      U.show(dom.confirm);
    }
  };

  document.addEventListener('click', e => {
    const b = e.target.closest && e.target.closest('#teacher-panel [data-act]');
    if (!b) return;
    const act = b.getAttribute('data-act');
    EB.audio.pop();
    switch (act) {
      case 'close': EB.teacher.close(); break;
      case 'pause-timer': EB.timer.pause(); EB.game.paused = true; ui.toast('تم إيقاف المؤقت'); break;
      case 'resume-timer': EB.game.paused = false; if (!EB.game.finalTimeLocked && EB.state.started && !EB.state.teamData.finished && !(EB.state.phase === 'handoff' && EB.state.levelIndex === D.LEVELS.length - 1)) EB.timer.resume(); break;
      case 'mute': {
        const m = EB.audio.toggle();
        b.textContent = m ? 'إلغاء الكتم' : 'كتم الأصوات';
        break;
      }
      case 'skip-intro': EB.ui.overlay(null); if (!EB.state.started) EB.state.startTeamRace(); EB.game.runLevel(EB.state.levelIndex); break;
      case 'restart-level': EB.game.restartLevel(); break;
      case 'skip-level': EB.game.skipLevel(); break;
      case 'results': EB.teacher.close(); EB.ui.overlay(EB.screens.results()); break;
      case 'menu': EB.teacher.close(); EB.game.gotoIntro(); break;
      case 'reset':
        EB.teacher.ask('سيتم مسح نتائج الفريقين وإعادة المنافسة من البداية. هل تريدين المتابعة؟', () => {
          EB.state.resetAll(); EB.game.paused = false; EB.timer.reset(); EB.teacher.close(); EB.game.gotoIntro();
        });
        break;
    }
    EB.teacher.status();
  });

  /* ---------- الإقلاع ---------- */
  EB.levels = EB.levels || {};
  document.addEventListener('DOMContentLoaded', () => game.boot());
  if (document.readyState !== 'loading') game.boot();
})(window.EB);

</script>
