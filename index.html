<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#faf0dd">
<title>Emotion Balance — مهمة استعادة التوازن</title>
<style>
/* ============ Emotion Balance — أنماط اللعبة ============
   ثيم "غرفة القصة" (cottagecore): عاج ودافئ خشبي + مريمية + تراكوتا + زهور */
:root{
  /* أسماء الفريقيْن محفوظة (pink/purple) — درجة اللون فقط تغيّرت لتناسب الثيم */
  --pink:#d98b9d; --pink-deep:#b8566f; --pink-soft:#fbe8ea;
  --purple:#a08cc0; --purple-deep:#6f5a94; --purple-soft:#efe9f5;
  --beige:#f4e7d2; --cream:#fdf6e9; --ink:#5a4034; --ink-soft:#8a7365;
  --gold:#e8b45c; --mint:#9cb381; --danger:#c25c54;
  --sage:#9cb381; --sage-deep:#6f8a5c; --sage-soft:#e8efdd;
  --terra:#c87a52; --terra-deep:#a3563a; --wood:#b98154; --wood-deep:#8a5a37;
  --team-a:var(--pink); --team-b:var(--purple);
  --shadow:0 6px 20px rgba(96,66,44,.18);
  --r-lg:26px; --r-md:18px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none;}
body{
  font-family:"Tahoma","Noto Sans Arabic","Geeza Pro","Arial",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(110% 90% at 50% -10%,rgba(255,255,255,.42),rgba(255,255,255,0) 45%),
    radial-gradient(120% 120% at 50% 0%,#fbf1de 0%,#f2e3ca 55%,#e0ccb0 100%);
  -webkit-user-select:none;user-select:none;touch-action:manipulation;
}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
#stage-wrap{
  position:relative;width:100%;height:100%;overflow:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  background:linear-gradient(180deg,rgba(255,250,242,.18),rgba(139,105,77,.06));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.18), inset 0 -80px 120px rgba(50,34,24,.06);
}
/* الطبقات الزخرفية فوق منطقة اللعب يجب ألا تعترض اللمس — layer-game وحده قابل للضغط */
#layer-room,#layer-bgfx,#layer-char,#layer-fx,#layer-light{pointer-events:none;}
#layer-game{pointer-events:auto;}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block;}

.hidden{display:none !important;}

/* ---------- HUD ---------- */
#hud{
  position:absolute;top:0;left:0;right:0;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 16px;pointer-events:none;z-index:20;
}
.hud-side{display:flex;align-items:center;gap:8px;flex:0 0 auto;}
.hud-center{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;}
.team-badge{
  font-weight:800;font-size:clamp(13px,1.6vmin,19px);padding:8px 16px;border-radius:999px;
  color:#fff;box-shadow:0 4px 14px rgba(96,66,44,.24),inset 0 1px 0 rgba(255,255,255,.55);white-space:nowrap;
}
.team-badge.pink{background:linear-gradient(135deg,var(--pink),var(--pink-deep));}
.team-badge.purple{background:linear-gradient(135deg,var(--purple),var(--purple-deep));}
.pill{
  background:linear-gradient(180deg,rgba(255,255,255,.88),rgba(248,239,225,.8));border:1.5px solid rgba(255,255,255,.92);border-radius:999px;padding:7px 14px;
  font-size:clamp(12px,1.5vmin,17px);font-weight:700;color:var(--ink);
  box-shadow:0 4px 14px rgba(96,66,44,.16);white-space:nowrap;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
}
.hud-title{
  background:linear-gradient(180deg,rgba(255,255,255,.88),rgba(245,235,220,.8));border:1.5px solid rgba(255,255,255,.95);border-radius:var(--r-md);padding:6px 18px;
  font-size:clamp(12px,1.7vmin,20px);font-weight:800;color:var(--ink);
  box-shadow:0 4px 16px rgba(96,66,44,.18);text-shadow:0 1px 0 rgba(255,255,255,.7);
  text-align:center;white-space:nowrap;max-width:96%;overflow:hidden;text-overflow:ellipsis;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
}
#hud-score{direction:ltr;font-variant-numeric:tabular-nums;}
.timer-pill{
  direction:ltr;font-variant-numeric:tabular-nums;font-weight:800;font-size:clamp(14px,2vmin,24px);
  padding:6px 16px;border-radius:999px;color:var(--terra-deep);
  background:linear-gradient(180deg,rgba(255,252,245,.97),rgba(244,231,210,.94));
  box-shadow:0 4px 14px rgba(96,66,44,.2),inset 0 1px 0 #fff;
}
.timer-pill.low{background:var(--danger);color:#fff;animation:pulse .8s infinite alternate;}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.07)}}

#hud-meter{
  position:relative;width:min(58%,480px);height:24px;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.72),rgba(228,214,194,.88));
  box-shadow:inset 0 2px 6px rgba(120,90,60,.22),0 1px 0 rgba(255,255,255,.8);overflow:hidden;
}
#hud-meter-fill{position:relative;height:100%;width:0%;border-radius:999px;transition:width .35s ease;
  background:linear-gradient(90deg,var(--sage),var(--gold));}
#hud-meter-fill::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0) 55%);}
#hud-meter-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:800;color:var(--ink);unicode-bidi:plaintext;white-space:nowrap;
  max-width:100%;padding:0 12px;box-sizing:border-box;overflow:hidden;text-overflow:ellipsis;}
#hud-player,.chip,.lbl{unicode-bidi:plaintext;}

/* ---------- أزرار التحكم الكبيرة ---------- */
#controls{
  position:absolute;left:0;right:0;bottom:0;z-index:22;
  display:flex;align-items:flex-end;justify-content:center;gap:clamp(14px,4vw,64px);
  padding:0 16px calc(18px + env(safe-area-inset-bottom));pointer-events:none;
}
#controls > *{pointer-events:auto;}
.btn{
  position:relative;border:0;font-family:inherit;cursor:pointer;color:var(--ink);
  background:linear-gradient(180deg,#fffefb 0%,#f9efe1 56%,#ead6b8 100%);
  border-radius:var(--r-lg);
  box-shadow:0 8px 0 rgba(140,102,64,.24),0 16px 30px rgba(96,66,44,.24),inset 0 2px 0 rgba(255,255,255,.95),inset 0 -3px 0 rgba(96,66,44,.1);
  font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .12s ease,box-shadow .12s ease,filter .12s ease;
  text-shadow:0 1px 0 rgba(255,255,255,.5);
}
.btn:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(140,102,64,.24),0 6px 14px rgba(96,66,44,.2),inset 0 2px 0 rgba(255,255,255,.9);}
.btn.primary{background:linear-gradient(180deg,#fbe3dc 0%,#e0a08f 55%,var(--terra-deep) 100%);color:#fff;text-shadow:0 1px 2px rgba(120,55,35,.45);}
.btn.violet{background:linear-gradient(180deg,#e6dcee 0%,#b3a1cd 55%,var(--purple-deep) 100%);color:#fff;text-shadow:0 1px 2px rgba(70,50,40,.45);}
.btn.mint{background:linear-gradient(180deg,#e8f0dc 0%,#a8bd93 55%,var(--sage-deep) 100%);color:#fff;text-shadow:0 1px 2px rgba(50,75,35,.4);}
.btn.ghost{background:rgba(255,251,242,.75);box-shadow:0 6px 16px rgba(96,66,44,.14),inset 0 0 0 2px rgba(190,155,115,.35);}
.btn.big{font-size:clamp(15px,2.3vmin,26px);padding:15px 32px;min-height:58px;}
.btn.huge{font-size:clamp(18px,2.8vmin,30px);padding:18px 44px;min-height:70px;}
.btn.glow{animation:glow .9s infinite alternate;}
@keyframes glow{from{box-shadow:0 0 0 rgba(255,214,110,0),0 8px 0 rgba(140,102,64,.24),var(--shadow)}
  to{box-shadow:0 0 34px 6px rgba(240,190,90,.75),0 8px 0 rgba(140,102,64,.24),var(--shadow)}}
.btn.off{filter:grayscale(.55) brightness(.94);opacity:.75;}
.btn.arrow{width:clamp(88px,15vmin,150px);height:clamp(88px,15vmin,150px);border-radius:50%;font-size:clamp(30px,5vmin,54px);padding:0;}


.round-btn{
  position:absolute;top:calc(10px + env(safe-area-inset-top));inset-inline-start:calc(12px + env(safe-area-inset-left));
  width:44px;height:44px;border-radius:50%;border:0;z-index:40;
  background:rgba(255,251,242,.88);color:var(--terra-deep);font-size:20px;font-weight:700;
  box-shadow:var(--shadow);cursor:pointer;
}

/* ---------- رسائل ---------- */
#banner{
  position:absolute;left:50%;top:37%;transform:translate(-50%,-50%);z-index:26;
  background:rgba(255,252,246,.95);border-radius:var(--r-lg);padding:16px 30px;
  font-size:clamp(17px,2.6vmin,30px);font-weight:800;box-shadow:var(--shadow);text-align:center;max-width:86%;
  border:2px solid rgba(214,186,146,.5);
  animation:pop .3s ease;pointer-events:none;
}
#banner.ok{background:linear-gradient(180deg,#f0f5e6,#d6e4c2);color:#4a6335;}
#banner.no{background:linear-gradient(180deg,#fbeae6,#f0cfc6);color:#8f4436;}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.8);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
#toast{
  position:absolute;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:27;
  background:rgba(90,64,52,.92);color:#fff;border-radius:999px;padding:10px 22px;
  font-size:clamp(13px,1.8vmin,19px);font-weight:700;box-shadow:var(--shadow);max-width:88%;text-align:center;pointer-events:none;
}

/* ---------- توقيع المصممة ---------- */
#credit{
  position:absolute;bottom:calc(6px + env(safe-area-inset-bottom));left:calc(10px + env(safe-area-inset-left));
  z-index:60;pointer-events:none;direction:rtl;
  font-size:clamp(12px,1.6vmin,17px);font-weight:700;
  color:var(--ink-soft);background:rgba(255,251,242,.62);border-radius:999px;padding:3px 10px;
  text-shadow:0 1px 0 rgba(255,255,255,.7);white-space:nowrap;
}

/* ---------- الشاشات (overlay) ---------- */
#overlay{
  position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(120% 130% at 50% 10%,rgba(255,246,229,.92),rgba(238,222,198,.95));
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
}
#overlay-inner{width:min(1000px,94%);max-height:96%;overflow:auto;padding:10px;
  display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;}
.card{
  background:linear-gradient(180deg,rgba(255,252,246,.94),rgba(248,238,221,.92));
  border:2px solid rgba(214,186,146,.55);
  border-radius:30px;box-shadow:var(--shadow);
  padding:clamp(14px,2.4vmin,28px) clamp(16px,3vmin,36px);width:100%;
  display:flex;flex-direction:column;align-items:center;gap:12px;
}
h1.game-title{margin:0;font-size:clamp(26px,5.2vmin,58px);letter-spacing:.5px;
  background:linear-gradient(90deg,var(--pink-deep),var(--purple-deep));-webkit-background-clip:text;background-clip:text;color:transparent;}
h2{margin:0;font-size:clamp(19px,3.2vmin,36px);}
h3{margin:0;font-size:clamp(15px,2.3vmin,25px);color:var(--purple-deep);}
.sub{margin:0;color:var(--ink-soft);font-size:clamp(13px,2vmin,22px);line-height:1.7;font-weight:600;}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
.chip{background:var(--purple-soft);border-radius:999px;padding:6px 14px;font-weight:700;font-size:clamp(12px,1.7vmin,18px);color:var(--purple-deep);}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:center;}
.col2{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;}
.scoreboard{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,2vmin,24px);width:100%;}
.team-card{border-radius:24px;padding:14px;color:#fff;box-shadow:var(--shadow)}
.team-card.pink{background:linear-gradient(160deg,var(--pink),var(--pink-deep));}
.team-card.purple{background:linear-gradient(160deg,var(--purple),var(--purple-deep));}
.team-card .num{font-size:clamp(28px,5vmin,54px);font-weight:900;font-variant-numeric:tabular-nums;direction:ltr}
.team-card .lbl{font-size:clamp(12px,1.8vmin,18px);opacity:.95;font-weight:700}
.lvllist{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.lvllist li{display:flex;justify-content:space-between;gap:10px;background:rgba(255,255,255,.25);border-radius:12px;padding:6px 12px;font-weight:700;font-size:clamp(11px,1.7vmin,17px)}
.seg{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.seg .btn.sel{outline:4px solid var(--gold);outline-offset:2px}
.winner{font-size:clamp(20px,3.6vmin,40px);font-weight:900;color:var(--purple-deep)}
.trophy{width:clamp(90px,16vmin,180px);height:auto;animation:bounce 1.1s ease-in-out infinite alternate}
@keyframes bounce{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-12px) rotate(3deg)}}
.progress-dots{display:flex;gap:8px;justify-content:center}
.dot{width:14px;height:14px;border-radius:50%;background:rgba(138,115,101,.28)}
.dot.done{background:var(--mint)}
.dot.now{background:var(--gold);box-shadow:0 0 0 4px rgba(255,207,92,.35)}

/* ---------- لوحة المعلمة ---------- */
.panel{
  position:absolute;inset:0;z-index:70;background:linear-gradient(180deg,#fdf6e9,#f2e5cf);
  padding:calc(20px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right))
           calc(20px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
  display:flex;flex-direction:column;align-items:center;gap:10px;overflow:auto;
}
.panel h2{color:var(--purple-deep)}
.panel-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;width:100%}
.panel button{
  border:0;font-family:inherit;cursor:pointer;font-weight:800;color:var(--ink);
  border-radius:var(--r-md);background:linear-gradient(180deg,#fffdf7,#eee0c6);
  box-shadow:0 5px 0 rgba(140,102,64,.2),0 10px 20px rgba(96,66,44,.16);
  font-size:clamp(13px,1.9vmin,20px);padding:12px 20px;min-height:52px;
}
.panel button:active{transform:translateY(4px)}
.panel button.warn{background:linear-gradient(180deg,#ffeccd,#ffb877);color:#7a4210}
.panel button.danger{background:linear-gradient(180deg,#ffd7dd,var(--danger));color:#fff}
.panel .btn{font-size:clamp(13px,1.9vmin,20px);padding:12px 20px;min-height:52px}
.btn.warn{background:linear-gradient(180deg,#ffeccd,#ffb877);color:#7a4210}
.btn.danger{background:linear-gradient(180deg,#ffd7dd,var(--danger));color:#fff}
.panel-note{font-size:clamp(12px,1.7vmin,18px);color:var(--ink-soft);font-weight:700;text-align:center;direction:ltr}
.close-x{position:absolute;top:12px;inset-inline-end:12px;width:46px;height:46px;border-radius:50%;border:0;
  background:var(--purple-soft);color:var(--purple-deep);font-size:20px;font-weight:800}

/* ---------- اتجاه الدوران ---------- */
#rotate-hint{display:none}
@media (orientation:portrait){
  #rotate-hint{
    position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    background:linear-gradient(180deg,#fdf3e2,#efdfc4);text-align:center;padding:24px;
  }
  #rotate-hint p{font-size:clamp(18px,4vw,30px);font-weight:800;color:var(--purple-deep);margin:0}
}

/* عناصر SVG تفاعلية */
.tap{cursor:pointer;}
.tap:active{opacity:.9}
.wob{animation:wob 1.6s ease-in-out infinite}
@keyframes wob{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}


/* تحسينات احترافية إضافية */
#stage-wrap::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:1;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(0,0,0,0) 18%,rgba(0,0,0,.05) 100%);}
#stage{z-index:0;}
#hud,.round-btn,#controls,#banner,#toast,#overlay,#teacher-panel,#confirm-box,#credit{position:absolute;}
#controls .btn{min-width:min(32vw,220px);}
.btn{letter-spacing:.01em;}
.btn.primary{background:linear-gradient(180deg,#ffd6cb 0%,#e39b87 50%,var(--terra-deep) 100%);}
.btn.violet{background:linear-gradient(180deg,#e8def2 0%,#b8a6d0 50%,var(--purple-deep) 100%);}
.btn:hover{filter:brightness(1.03);}
#banner{border:1px solid rgba(255,255,255,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
#toast{backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}

/* ============ دعم اللابتوب (فأرة + لوحة مفاتيح) ============ */
/* شارة المفتاح فوق زر التحكم — تظهر فقط عند وجود فأرة */
.kbd{
  direction:ltr;font-family:Consolas,"Courier New",monospace;font-weight:800;
  font-size:clamp(10px,1.3vmin,14px);line-height:1;letter-spacing:.02em;
  background:rgba(255,255,255,.82);color:#5a4034;border:1.5px solid rgba(90,64,52,.28);
  border-radius:7px;padding:3px 7px;box-shadow:0 2px 0 rgba(90,64,52,.22);white-space:nowrap;
}
.btn.off .kbd{opacity:.6}
#kbd-legend{
  position:absolute;left:calc(12px + env(safe-area-inset-left));bottom:calc(34px + env(safe-area-inset-bottom));
  z-index:23;pointer-events:none;direction:rtl;text-align:start;
  background:rgba(255,251,242,.86);border:1.5px solid rgba(214,186,146,.6);border-radius:999px;
  padding:5px 14px;font-size:clamp(11px,1.5vmin,16px);font-weight:800;color:var(--ink-soft);
  box-shadow:0 4px 12px rgba(96,66,44,.14);white-space:nowrap;max-width:44vw;overflow:hidden;text-overflow:ellipsis;
}
body:not(.desktop) #kbd-legend{display:none}
/* تفاعل الفأرة: إبراز المناطق القابلة للنقر في الرسم */
@media (pointer:fine){
  .tap{transition:filter .12s ease}
  .tap:hover{filter:brightness(1.07) saturate(1.08) drop-shadow(0 0 6px rgba(240,190,90,.55))}
  .btn:hover,.panel button:hover,.round-btn:hover{transform:translateY(-1px)}
  .btn:active,.panel button:active,.round-btn:active{transform:translateY(4px)}
  .btn:focus-visible,.panel button:focus-visible,.round-btn:focus-visible,.close-x:focus-visible{
    outline:3px solid var(--gold);outline-offset:3px;
  }
  /* على الشاشات العريضة: توسيع منطقة اللعب بدل ترك هامش فارغ */
  @media (min-width:1100px){
    #controls{gap:clamp(18px,3vw,44px);padding-bottom:calc(14px + env(safe-area-inset-bottom))}
    .btn.big{padding:14px 30px}
  }
}

/* Active team palette */
:root {
  --pink: #bb3977; --pink-deep: #86234f; --pink-soft: #fdeaf3;
  --purple: #754db4; --purple-deep: #523382; --purple-soft: #f0e9fd;
}
body[data-team="pink"] {
  --accent: var(--pink); --accent-deep: var(--pink-deep);
  --accent-soft: var(--pink-soft); --accent-edge: #eab3ce;
}
body[data-team="purple"] {
  --accent: var(--purple); --accent-deep: var(--purple-deep);
  --accent-soft: var(--purple-soft); --accent-edge: #cfb9ef;
}
body[data-team] {
  background: radial-gradient(ellipse at top, var(--accent-soft), var(--accent-edge));
}
body[data-team] #stage-wrap::before {
  background: linear-gradient(180deg, var(--accent-soft), transparent 24%, transparent 75%, var(--accent-soft));
  opacity: .35;
}
body[data-team] #overlay {
  background: radial-gradient(ellipse at top, #fffafcdd, var(--accent-edge));
}
body[data-team] .card, body[data-team] .panel {
  background: linear-gradient(160deg, #fff, var(--accent-soft));
  border-color: var(--accent-edge);
}
body[data-team] :is(.pill, .hud-title, .timer-pill:not(.low), .round-btn, .chip, .btn.ghost) {
  background: var(--accent-soft);
  color: var(--accent-deep);
  border-color: var(--accent-edge);
}
body[data-team] :is(h3, .winner) { color: var(--accent-deep); }
body[data-team] #hud-meter-fill { background: linear-gradient(90deg, var(--accent-deep), var(--accent)); }
body[data-team] .btn:is(.primary, .violet), .btn.pick-pink, .btn.pick-purple {
  color: #fff;
  background: linear-gradient(155deg, var(--accent), var(--accent-deep));
}
.btn.pick-pink { --accent: var(--pink); --accent-deep: var(--pink-deep); }

      const hy = -128 - sh + st.headY - br * 4;
      head.setAttribute('transform', `translate(${r2(clamp(st.headX + micro.headX, -6, 6))},${r2(hy)}) rotate(${r2(st.headRot + micro.headRot)})`);
      armL.group.setAttribute('transform', `translate(-26,${r2(-98 - sh)}) rotate(${r2(st.raiseL + micro.arm)})`);
      armL.elbow.setAttribute('transform', `translate(0,26) rotate(${r2(-st.bendL)})`);
      armR.group.setAttribute('transform', `translate(26,${r2(-98 - sh)}) rotate(${r2(-(st.raiseR - micro.arm))})`);
      armR.elbow.setAttribute('transform', `translate(0,26) rotate(${r2(st.bendR)})`);

      /* حركة ثانوية: الشعر والقماش يتأخران خلف الرأس والجذع */
      const hlag = r2(-hairLag);
      lockL.setAttribute('transform', `rotate(${hlag},-38,-46)`);
      lockR.setAttribute('transform', `rotate(${hlag},38,-46)`);
      if (tailG) tailG.setAttribute('transform', `translate(34,-68) rotate(${r2(-hairLag * 1.6)})`);
      skirt.setAttribute('transform', `rotate(${r2(clothLag * .5)})`);

      const open = clamp(st.eyes * (1 - blink), 0, 1);
      [eyeL, eyeR].forEach(e => {
        e.visibleEye.setAttribute('transform', `scale(1,${r2(open)})`);
        e.visibleEye.setAttribute('opacity', open > .06 ? 1 : 0);
        e.lid.setAttribute('opacity', open <= .06 ? 1 : 0);
      });
      mouth.setAttribute('d', MOUTHS[st.mouth] || MOUTHS.neutral);
      mouth.setAttribute('fill', (st.mouth === 'open' || st.mouth === 'yawn' || st.mouth === 'oh') ? '#9c4351' : 'none');
      const bw = st.brows === 'worried' ? 5 : st.brows === 'happy' ? -4 : st.brows === 'soft' ? 2 : 0;
      browL.setAttribute('transform', `translate(0,${r2(bw)}) rotate(${r2(st.brows === 'worried' ? -8 : st.brows === 'happy' ? 6 : 0)},5,-49)`);
      browR.setAttribute('transform', `translate(0,${r2(bw)}) rotate(${r2(st.brows === 'worried' ? 8 : st.brows === 'happy' ? -6 : 0)},15,-49)`);

      if (prop && propsMap[prop]) {
        const el = propsMap[prop];
        let ax = 0, ay = 0;
        if (propAnchor === 'hands') { const hl = handPos(-1), hr = handPos(1); ax = (hl.x + hr.x) / 2; ay = (hl.y + hr.y) / 2 - 6; }
        else { ax = propAnchor.x; ay = propAnchor.y; }
        el.setAttribute('transform', `translate(${r2(ax + propOffset.x)},${r2(ay + propOffset.y)}) rotate(${r2(st.lean * .5)})`);
      }
    }

    /* ---------- راحة حيّة: رمش + تنفّس خفيف + تمايل دقيق ---------- */
    function startIdle() {
      frame = onFrame(function (d, now) {
        blinkT += d * 1000;
        const sinceBlink = blinkT - nextBlink;
        if (sinceBlink >= 180) {
          blink = 0;
          nextBlink = blinkT + 1500 + Math.random() * 3400;
        } else if (sinceBlink >= 0) {
          blink = Math.min(1, sinceBlink / 70, (180 - sinceBlink) / 90);
        }
        const t = (now - t0) / 1000;
        if (st.breathe <= .001) {
          idleB = .055 * (0.5 - 0.5 * Math.cos(t * 1.15));
          if (idleB < 0.0005) idleB = 0;
        } else idleB = 0;
        micro.headX = Math.sin(t * .62) * .9;
        micro.headRot = Math.sin(t * .43 + 1.2) * 1.5;
        micro.bob = Math.sin(t * .9) * .7;
        micro.arm = Math.sin(t * .77 + .6) * 1.4;
        const headAngle = st.headRot + micro.headRot;
        const dh = headAngle - lastHeadRot; lastHeadRot = headAngle;
        hairLag += (clamp(dh * 6, -9, 9) - hairLag) * Math.min(1, d * 7);
        clothLag += (clamp(st.lean * .5 + dh * 30, -8, 8) - clothLag) * Math.min(1, d * 5);
        render();
      });
    }
    startIdle();

    /* محرك حركة بدفعات زمنية: يعطي الحركة الرياضية إيقاعًا طبيعيًا بدل القفز بين وضعين */
    let activeDrive = null;
    function drive(durMs, fn, onDone) {
      if (activeDrive) { offFrame(activeDrive); activeDrive = null; }
      let el = 0;
      const f = onFrame(function (d) {
        el += d * 1000;
        const p = clamp(el / durMs, 0, 1);
        fn(p);
        if (p >= 1) { offFrame(f); activeDrive = null; if (onDone) onDone(); }
      });
      activeDrive = f;
      return f;
    }
    const tri = (ph, c, w) => Math.max(0, 1 - Math.abs(ph - c) / w);

    const API = {
      group: g, st, render, head, torso, props: propsMap,
      setPos(x, y, scale) { st.x = x; st.y = y == null ? st.y : y; if (scale != null) st.scale = scale; render(); return API; },
      pose(target, dur, ease) {
        const keys = Object.keys(target).filter(k => k !== 'mouth' && k !== 'brows' && k !== 'eyes');
        keys.forEach(k => {
          tween({
            from: st[k], to: target[k], dur: dur || 500, ease: ease || Ease.inOut,
            onUpdate: v => { st[k] = v; render(); }, tag: 'pose'
          });
        });
        ['mouth', 'brows'].forEach(k => { if (target[k]) setTimeout(() => { st[k] = target[k]; render(); }, (dur || 500) * .35); });
        if (target.eyes != null) tween({ from: st.eyes, to: target.eyes, dur: dur || 500, onUpdate: v => { st.eyes = v; render(); }, tag: 'pose' });
        return API;
      },
      setPose(p) { Object.assign(st, p); render(); return API; },
      expression(name, dur) {
        const e = EXPR[name]; if (!e) return API;
        return API.pose({ eyes: e.eyes, mouth: e.mouth, brows: e.brows, shoulderLift: e.shoulderLift, headRot: e.headRot }, dur == null ? 500 : dur);
      },
      /* دورة تنفس حقيقية: الصدر يرتفع، الكتفان ينفتحان، الرأس ينخفض عند الزفير */
      breathe(dur, amount) {
        amount = amount == null ? 1 : amount;
        tween({
          from: 0, to: amount, dur: dur, ease: Ease.inOut,
          onUpdate: v => {
            st.breathe = v; idleB = 0;
            st.shoulderLift = Math.max(st.shoulderLift, v * .3);
            st.headY = -v * 3.4;
            render();
          }, tag: 'breathe'
        });
        return API;
      },
      breatheOut(dur, amount) {
        amount = amount == null ? 1 : amount;
        tween({
          from: st.breathe, to: 0, dur, ease: Ease.inOut,
          onUpdate: v => {
            st.breathe = v;
            st.shoulderLift = Math.max(0, Math.min(st.shoulderLift, v * .18));
            st.headY = -v * 3.4;
            render();
          }, onComplete: () => { idleB = 0; }, tag: 'breathe'
        });
        return API;
      },
      setOutfit(pal2) {
        Object.assign(pal, pal2);
        const team = EB.data.TEAMS[document.body.dataset.team || 'pink'];
        if (opts.teamClothes) {
          const colors = team.colors;
          const outfits = EB.data.OUTFITS;
          const sport = pal2 === outfits.sport;
          const sleep = pal2 === outfits.sleep;
          const study = pal2 === outfits.study;
          pal.top = sport ? colors.main : sleep ? colors.light : study ? colors.glow : mix(colors.light, colors.main, .28);
          pal.bottom = sport ? colors.deep : sleep ? colors.glow : colors.main;
          pal.accent = colors.glow;
          pal.collar = colors.light;
          pal.pin = pal2.pin ? colors.deep : null;
          pal.band = colors.main;
          pal.shoe = colors.deep;
        }
        repaint();
        rebuildFills();
        return API;
      },
      prop(name, opts2) {
        Object.keys(propsMap).forEach(k => propsMap[k].setAttribute('opacity', k === name ? 1 : 0));
        prop = name; propAnchor = (opts2 && opts2.anchor) || 'hands';
        propOffset = (opts2 && opts2.offset) || { x: 0, y: 0 };
        render();
        return API;
      },
      dropProp() { prop = null; Object.keys(propsMap).forEach(k => propsMap[k].setAttribute('opacity', 0)); render(); return API; },

      /* ===== حركات مخصّصة ===== */
      anim(name, durMs) {
        const D = durMs || 2000;
        const save = { raiseL: st.raiseL, bendL: st.bendL, raiseR: st.raiseR, bendR: st.bendR, lean: st.lean, hipL: st.hipL, kneeL: st.kneeL, hipR: st.hipR, kneeR: st.kneeR, bob: st.bob, headRot: st.headRot, headY: st.headY, shoulderLift: st.shoulderLift };
        const restore = delay => tween({ from: 0, to: 1, dur: 1, delay: delay || 0, onComplete: () => API.pose(save, 340, Ease.out) });
        const back = () => { st.bob = 0; st.headY = 0; API.pose(save, 320, Ease.out); };
        switch (name) {
          /* رفع الذراعين فوق الرأس مع ثنية ركبكتين وخمول ثانوي */
          case 'armsUp':
            API.pose({ mouth: 'smile', eyes: 1 }, 200);
            drive(D, p => {
              const up = Ease.out(clamp((p - .18) / .34, 0, 1));
              const down = Ease.in(clamp((p - .74) / .26, 0, 1));
              const k = up * (1 - down);
              const dip = tri(p, .2, .2) * (1 - up);
              st.raiseL = st.raiseR = lerp(8, 170, k) + 6 * dip;
              st.bendL = st.bendR = lerp(10, 3, k) + 12 * dip;
              st.hipL = st.hipR = 6 + 20 * dip - 3 * k;
              st.kneeL = st.kneeR = Math.max(0, 3 + 24 * dip - 6 * k);
              st.bob = 7 * dip - 10 * k + 3 * down;
              st.lean = 2 * dip - 2 * k;
              st.headRot = -5 * k + 3 * dip;
              st.headY = -3 * k + 1.5 * dip;
              st.shoulderLift = .45 * k;
              render();
            }, back);
            break;
          /* إطالة جانبية: ميل الجذع مع رفع الذراع وتبديل الوزن */
          case 'stretch':
            API.pose({ mouth: 'calm', eyes: .9 }, 200);
            drive(D, p => {
              const up = Ease.inOut(clamp(p / .3, 0, 1)) * (1 - Ease.in(clamp((p - .72) / .28, 0, 1)));
              const wob = Math.sin(p * Math.PI * 5) * 1.6 * up;
              st.raiseR = 8 + 146 * up; st.bendR = Math.max(2, 10 - 8 * up);
              st.raiseL = 8 + 12 * up; st.bendL = 10 + 26 * up;
              st.lean = -9 * up + wob; st.headRot = 5 * up - wob * .5;
              st.headY = -5 * up; st.bob = -3 * up;
              st.hipL = 7 + 10 * up; st.kneeL = Math.max(0, 3 + 12 * up);
              st.hipR = 7 - 4 * up; st.kneeR = Math.max(0, 3 - 2 * up);
              st.shoulderLift = .3 * up;
              render();
            }, back);
            break;
          /* المشي في المكان: ركبة عالية مع تأرجع الذراعين عكسيًا واهتزاز خفيف */
          case 'march': {
            const reps = Math.max(2, Math.round(D / 430));
            API.pose({ mouth: 'neutral', eyes: 1 }, 160);
            drive(D, p => {
              const a = p * reps * Math.PI * 2;
              const s = Math.sin(a), c = Math.cos(a);
              const liftL = Math.max(0, s), liftR = Math.max(0, -s);
              st.hipL = 6 + liftL * 32; st.kneeL = 4 + liftL * 54;
              st.hipR = 6 + liftR * 32; st.kneeR = 4 + liftR * 54;
              st.raiseL = 28 - s * 24; st.raiseR = 28 + s * 24;
              st.bendL = 28 + liftR * 8; st.bendR = 28 + liftL * 8;
              st.bob = -3 * Math.abs(s);
              st.lean = c * 2.4; st.headRot = -c * 2.2; st.headY = -Math.abs(c) * 1.5;
              st.shoulderLift = .12 + .1 * Math.abs(c);
              render();
            }, back);
            break;
          }
          /* القفز: انطلاقة بثناء، هواء بمحاذاة، هبوط بامتصاص */
          case 'jump': {
            const reps = Math.max(2, Math.round(D / 620));
            API.pose({ mouth: 'smile', eyes: 1 }, 160);
            drive(D, p => {
              const ph = (p * reps) % 1;
              const air = Ease.out(Math.sin(Math.PI * clamp((ph - .17) / .66, 0, 1)));
              const crouch = tri(ph, .11, .12) * (1 - air);
              const land = tri(ph, .87, .1) * (1 - air);
              const sq = Math.max(crouch, land);
              st.bob = -23 * air + 8 * sq;
              st.hipL = st.hipR = 6 + 12 * air + 14 * sq;
              st.kneeL = st.kneeR = Math.max(0, 3 + 20 * sq - 2 * air);
              st.raiseL = st.raiseR = 8 + 122 * air + 28 * sq;
              st.bendL = st.bendR = Math.max(2, 10 + 14 * sq - 8 * air);
              st.shoulderLift = .42 * air;
              st.headRot = -4 * air + 4 * sq;
              st.headY = -2 * air + 2 * sq;
              render();
            }, back);
            break;
          }
          case 'wave':
            API.pose({ raiseR: 138, bendR: -42, mouth: 'smile', brows: 'happy' }, D * .28);
            tween({ from: -1, to: 1, dur: D * .55, repeat: 1, yoyo: true, onUpdate: v => { st.bendR = -42 + v * 28; st.headRot = v * 3; render(); }, onComplete: () => restore(0) });
            break;
          case 'nod':
            API.pose({ headRot: -11 }, D * .3); API.pose({ headRot: 6 }, D * .6); setTimeout(() => API.pose({ headRot: 0 }, D * .3), D * .7); break;
          case 'celebrate':
            API.pose({ raiseL: 164, raiseR: 164, mouth: 'smile', brows: 'happy', bob: -10, shoulderLift: .3 }, 420);
            tween({
              from: 0, to: 1, dur: 900, repeat: 2, yoyo: true,
              onUpdate: v => { st.bob = -13 * v; st.raiseL = 158 + v * 10; st.raiseR = 158 - v * 10; st.headRot = v * 4 - 2; render(); },
              onComplete: () => { st.bob = 0; API.pose(save, 420); }
            });
            break;
          case 'shrug':
            API.pose({ shoulderLift: 1, raiseL: 42, raiseR: 42, bendL: 42, bendR: 42, headRot: 4 }, 300);
            setTimeout(() => API.pose(save, 420), 900); break;
          case 'yawn':
            API.pose({ mouth: 'yawn', eyes: .15, raiseL: 72, raiseR: 72, headRot: -9, shoulderLift: .25 }, 700);
            setTimeout(() => { API.pose({ mouth: 'calm', eyes: .35, raiseL: 6, raiseR: 6, headRot: 0, shoulderLift: 0 }, 600); }, 1500); break;
          case 'sitCalm':
            API.pose({ shoulderLift: 0, mouth: 'calm', brows: 'soft', headRot: -2, eyes: .7 }, 600); break;
          default: break;
        }
        return API;
      },
      stopMotion() {
        if (activeDrive) { offFrame(activeDrive); activeDrive = null; }
        st.bob = 0; st.headY = 0; render();
        return API;
      },
      render_() { render(); }
    };

    /* إعادة تلوين الدمية عند تغيير الزيّ */
    function rebuildFills() {
      const map = {
        top: () => pal._top, topShade: () => shade(pal.top, .18), cuff: () => lite(pal.top, .55),
        bottom: () => pal._bottom, pleat: () => shade(pal.bottom, .16),
        skin: () => pal._skin, neck: () => shade(pal.skin, .1),
        hair: () => pal._hair, hairBack: () => pal._hairBack,
        accent: () => pal.accent, band: () => pal.band || pal.accent,
        pin: () => pal._pin, shoe: () => shoeOf(), shoeLite: () => lite(shoeOf(), .5), sock: () => lite(sockOf(), .04),
        sockTop: () => shade(sockOf(), .14),
        collar: () => lite(pal.collar || '#fff', .1)
      };
      g.querySelectorAll('[data-r]').forEach(el => {
        const f = map[el.getAttribute('data-r')];
        if (!f) return;
        const v = f();
        /* الأشكال الخطية (تطبيقات التنّورة، طوق المدرّبة) تُلوَّن بخطّها لا بتعبئتها */
        if (el.getAttribute('fill') === 'none') el.setAttribute('stroke', v);
        else el.setAttribute('fill', v);
      });
      /* المريلة بطبقتيها: إظهار/إخفاء + أشرطة الكتف + الحواف */
      const pinOn = pal.pin ? 1 : 0;
      pinG.setAttribute('opacity', pinOn);
      pinApron.setAttribute('opacity', pinOn);
      strapL.setAttribute('stroke', pal._pin);
      strapR.setAttribute('stroke', pal._pin);
      pinSeam.setAttribute('stroke', shade(pinOf(), .22));
      pinHem.setAttribute('stroke', shade(pinOf(), .26));
      /* العيون تتبع لون الشعر/القزحية */
      eyeL.iris.firstElementChild.setAttribute('fill', rg('eyeL', lite(pal.eye || '#5a3a28', .35), shade(pal.eye || '#5a3a28', .3)));
      eyeR.iris.firstElementChild.setAttribute('fill', rg('eyeR', lite(pal.eye || '#5a3a28', .35), shade(pal.eye || '#5a3a28', .3)));
      render();
    }

    render();
    return API;
  }

  /* ---------- أوضاع جاهزة ---------- */
  const POSES = {
    stand: { raiseL: 8, bendL: 10, raiseR: 8, bendR: 10, hipL: 7, kneeL: 3, hipR: 7, kneeR: 3, lean: 0, headRot: 0, torsoY: 0, bob: 0, shoulderLift: 0 },
    sitEdge: { raiseL: 24, bendL: 44, raiseR: 24, bendR: 44, hipL: 26, kneeL: 46, hipR: 26, kneeR: 46, lean: 2, torsoY: 26, bob: 0, shoulderLift: 0 },
    sitCross: { raiseL: 18, bendL: 52, raiseR: 18, bendR: 52, hipL: 44, kneeL: 78, hipR: 44, kneeR: 78, lean: 0, torsoY: 44, bob: 0, shoulderLift: 0 },
    desk: { raiseL: 46, bendL: 56, raiseR: 46, bendR: 56, hipL: 24, kneeL: 50, hipR: 24, kneeR: 50, lean: 8, headRot: 6, torsoY: 22, shoulderLift: .1 },
    relax: { raiseL: 14, bendL: 26, raiseR: 14, bendR: 26, hipL: 30, kneeL: 52, hipR: 22, kneeR: 42, lean: -6, headRot: -6, torsoY: 30, shoulderLift: 0 },
    holdPlate: { raiseL: 62, bendL: 62, raiseR: 62, bendR: 62, hipL: 8, kneeL: 4, hipR: 8, kneeR: 4, lean: 0, torsoY: 0, shoulderLift: 0 },
    tense: { raiseL: 18, bendL: 30, raiseR: 18, bendR: 30, hipL: 6, kneeL: 6, hipR: 6, kneeR: 6, lean: 2, headRot: 3, shoulderLift: .8 },
    breathSeated: { raiseL: 16, bendL: 22, raiseR: 16, bendR: 22, hipL: 28, kneeL: 50, hipR: 28, kneeR: 50, lean: 0, torsoY: 26, bob: 0, shoulderLift: .2 }
  };

  EB.Character = {
    create(parent, pal, opts) {
      pal = Object.assign({ top: '#f7ecd8', bottom: '#c87a52', accent: '#9cb381', hair: '#6b4a38', skin: '#fbdcc0', main: '#c1707f', deep: 'rgba(60,40,25,.1)', collar: '#fffaf0', eye: '#5a3a28', brow: '#6b4a38' }, pal || {});
      return buildRig(parent, pal, opts || {});
    },
    POSES, EXPR
  };
})(window.EB);

</script>
<script>
/* ============ EB.Room — بيئة اللعبة: منظر جانبي مُفصّل + منظور علوي للغرفة ============
   كل الرسوم SVG محلية بالكامل داخل المشروع (لا صور ولا أصول خارجية).
   الثيم: «غرفة القصة» — خشب دافئ + عاج + مريمية + تراكوتا + زهور. */
(function (EB) {
  const { svg, place, tween, Ease, lerp } = EB.util;
  const path = (d, a, p) => svg('path', Object.assign({ d }, a || {}), p);
  const W = 1024, H = 640, FLOOR = 452;
  const LINE = '#5a4034';

  /* ---------- لوحة الثيم ---------- */
  const C = {
    plaster: '#f7ecd8', plasterDark: '#e9d7b8', plank: '#dcc3a0',
    wood: 'var(--room-mid)', woodDeep: 'var(--accent-deep)', woodLite: 'var(--room-wall)',
    sage: 'var(--room-mid)', sageDeep: 'var(--accent-deep)', sageLite: 'var(--room-wall)',
    rose: 'var(--room-deep)', roseDeep: 'var(--accent-deep)', roseLite: 'var(--room-wall)',
    terra: '#c87a52', terraDeep: '#a3563a',
    cream: '#fdf6e9', parchment: '#f7ecd7', linen: '#efe0c6',
    gold: '#e8b45c', honey: '#ffdf9e', glass: '#fdeecb',
    shadow: 'rgba(120,85,55,.16)'
  };

  /* ---------- زخارف صغيرة مشتركة ---------- */
  function daisy(p, x, y, r, petal, center) {
    const g = svg('g', { transform: `translate(${x},${y})` }, p);
    for (let i = 0; i < 6; i++) {
      svg('ellipse', { cx: 0, cy: -r * .82, rx: r * .40, ry: r * .78, transform: `rotate(${i * 60})`, fill: petal || C.cream }, g);
    }
    svg('circle', { cx: 0, cy: 0, r: r * .40, fill: center || C.gold }, g);
    return g;
  }
  function sprig(p, x, y, s, flip) {
    const g = svg('g', { transform: `translate(${x},${y}) scale(${flip ? -s : s},${s})` }, p);
    path('M0,0 q7,-13 2,-27', { stroke: C.sageDeep, 'stroke-width': 2, fill: 'none', 'stroke-linecap': 'round' }, g);
    svg('ellipse', { cx: -5, cy: -11, rx: 6, ry: 3.2, transform: 'rotate(-30,-5,-11)', fill: C.sage }, g);
    svg('ellipse', { cx: 6, cy: -18, rx: 6, ry: 3.2, transform: 'rotate(30,6,-18)', fill: C.sageLite }, g);
    daisy(g, 2, -28, 3.6);
    return g;
  }

  /* ---------- تدرجات وفلاتر وأنماط أقمشة ---------- */
  function gradients(defs) {
    function lg(id, x1, y1, x2, y2, stops) {
      const el = svg('linearGradient', { id, x1, y1, x2, y2 }, defs);
      stops.forEach(s => svg('stop', { offset: s[0], 'stop-color': s[1], 'stop-opacity': s[2] == null ? 1 : s[2] }, el));
      return 'url(#' + id + ')';
    }
    function rg(id, cx, cy, r, stops) {
      const el = svg('radialGradient', { id, cx, cy, r }, defs);
      stops.forEach(s => svg('stop', { offset: s[0], 'stop-color': s[1], 'stop-opacity': s[2] == null ? 1 : s[2] }, el));
      return 'url(#' + id + ')';
    }
    lg('gWain', 0, 0, 0, 1, [['0%', 'var(--room-mid)'], ['100%', 'var(--room-deep)']]);
